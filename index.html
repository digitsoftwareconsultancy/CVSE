<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiGit ERP Login</title>
<style>body{font-family:Arial;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0} .card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1);width:360px;text-align:center} .input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0;background:#eef6ff;box-sizing:border-box} .btn{width:100%;padding:12px;border:none;border-radius:25px;font-weight:800;cursor:pointer;margin:6px 0} .btn-login{background:#0b2a5c;color:#fff} .btn-class{background:#0b2a5c;color:#fff} .btn-sub{background:#16a34a;color:#fff} .btn-back{background:#e5e7eb;color:#333}</style></head><body>
<div class="card">
<div id="loginForm"><h2 style="color:#0b2a5c">DiGit School Management<br>System . ERP</h2>
<input id="username" class="input" placeholder="Username"><input id="password" type="password" class="input" placeholder="Password">
<button class="btn btn-login" onclick="doLogin()">Login</button><p id="msg" style="color:red;min-height:18px;font-size:13px"></p></div>
<div id="roleForm" style="display:none"><h2 style="color:#0b2a5c">DiGit School Management<br>System . ERP</h2><p style="font-weight:700">Select Login Mode</p><p id="welcomeName" style="font-weight:800;color:#0b2a5c"></p><div id="roleList"></div></div>
</div>
<script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyzFPIR9-9oGTAI59J-109e_KHn7Cj1UbuvRpYt-X1tnddQVNFy3GtZgKIdS4v50jtG/exec";
let CAP = null;

async function apiPost(action, payload={}){
  let r = await fetch(WEB_URL,{method:'POST',body:JSON.stringify({action,...payload})});
  return await r.json();
}

async function doLogin(){
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value.trim();
  if(!u||!p){ document.getElementById('msg').innerText='Enter username & password'; return; }
  document.getElementById('msg').innerText='Checking...';
  try{
    let res = await apiPost('checklogin', {username:u, password:p});
    if(!res || !res.success){ document.getElementById('msg').innerText='❌ Invalid Login - '+(res.error||''); return; }
    CAP=res; 
    // Save both old and new keys for compatibility
    localStorage.setItem('cvs_user', JSON.stringify(res));
    localStorage.setItem('cvse_user', JSON.stringify(res));
    localStorage.setItem('cvs_token', res.token);
    localStorage.setItem('cvse_token', res.token);
    localStorage.setItem('token', res.token);
    localStorage.setItem('cvse_username', res.username);
    localStorage.setItem('cvse_role', res.role);
    localStorage.setItem('cvse_name', res.name);
    localStorage.setItem('cvse_classes', res.classes||'');
    localStorage.setItem('cvse_subjects', res.subjects||'');
    localStorage.setItem('cvse_examAccess', res.examAccess||'NO');
    localStorage.setItem('cvse_isClassTeacher', res.isClassTeacher ? 'true':'false');
    localStorage.setItem('cvs_username', res.username);
    localStorage.setItem('cvs_role', res.role);
    
    showRoleSwitcher(res);
  }catch(e){ document.getElementById('msg').innerText='Error: '+e.message; }
}

function showRoleSwitcher(cap){
  if(!cap.availableRoles || cap.availableRoles.length==0){
    cap.availableRoles=[{role: cap.role || 'admin', label: (cap.role||'admin').toUpperCase()}];
  }
  
  if(cap.availableRoles.length==1){
    enterRole(cap.availableRoles[0].role);
    return;
  }
  
  var first = cap.availableRoles[0].role;
  var allSame = true;
  for(var i=0;i<cap.availableRoles.length;i++){ if(cap.availableRoles[i].role!=first){ allSame=false; break; } }
  if(allSame){
    enterRole(first);
    return;
  }
  
  document.getElementById('loginForm').style.display='none';
  document.getElementById('roleForm').style.display='block';
  document.getElementById('welcomeName').innerText='Welcome, '+cap.name+' ('+cap.username.toUpperCase()+')';
  var html='';
  cap.availableRoles.forEach(function(r){
    var cls = r.role=='classTeacher' ? 'btn-class' : 'btn-sub';
    var icon = r.role=='classTeacher' ? '🏫' : '📚';
    if(r.role=='admin'){ cls='btn-class'; icon='🛡️'; }
    html+='<button class="btn '+cls+'" onclick="enterRole(\''+r.role+'\')">'+icon+' '+r.label+'</button>';
  });
  html+='<button class="btn btn-back" onclick="backToLogin()">← Back to Login</button>';
  document.getElementById('roleList').innerHTML=html;
}

function enterRole(role){
  if(!CAP) {
    try{ CAP=JSON.parse(localStorage.getItem('cvse_user')||localStorage.getItem('cvs_user')||'{}'); }catch(e){ CAP={}; }
  }
  localStorage.setItem('cvs_selected_role', role);
  localStorage.setItem('cvse_view', role=='classTeacher' ? 'class' : role=='subjectTeacher' ? 'subject' : 'admin');
  localStorage.setItem('role', role);
  localStorage.setItem('cvse_role', role);
  localStorage.setItem('cvs_role', role);
  
  // GitHub Pages routing - no WEB_URL ?page=
  if(role=='admin') window.location.href = 'admin.html';
  else if(role=='subjectTeacher' || role=='subject') window.location.href = 'subject-dashboard.html';
  else if(role=='classTeacher' || role=='teacher') window.location.href = 'class-dashboard.html';
  else window.location.href = 'class-dashboard.html';
}

function backToLogin(){
  document.getElementById('roleForm').style.display='none';
  document.getElementById('loginForm').style.display='block';
  document.getElementById('msg').innerText='';
}

// Auto redirect if already logged in
(function(){
  try{
    var u = JSON.parse(localStorage.getItem('cvse_user')||'null');
    if(u && u.token){
      CAP = u;
      var view = localStorage.getItem('cvse_view');
      if(view=='class') window.location.href='class-dashboard.html';
      else if(view=='subject') window.location.href='subject-dashboard.html';
      else if(view=='admin') window.location.href='admin.html';
    }
  }catch(e){}
})();
</script></body></html>
