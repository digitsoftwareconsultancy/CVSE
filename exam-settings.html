<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.26-S29">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Settings</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#fff3e0;color:#7c2d12;border:1px solid #ffcc80;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.badge-exam{color:#fff;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:700;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer}
.wrap{max-width:1000px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;font-family:inherit;min-height:46px;background:#fff}
input[readonly]{background:#f1f5f9;color:#475569}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-orange{background:linear-gradient(135deg,#ef6c00,#ff9800)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-red{background:linear-gradient(135deg,#c62828,#ef4444)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-grey{background:#e5e7eb;color:#475569}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:5px solid var(--purple);margin-bottom:12px}
.card.exam{border-left-color:var(--blue)}.card.rep{border-left-color:var(--orange)}.card.area{border-left-color:var(--green)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.ch b{color:var(--navy);font-size:15px}
.pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
.p-dirty{background:#fff3e0;color:#9a3412}.p-ok{background:#dcfce7;color:#166534}.p-lock{background:#fee2e2;color:#991b1b}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #cbd5e1;border-radius:999px;padding:0 12px;min-height:38px;font-weight:700;font-size:13px;color:var(--navy);background:#fff;cursor:pointer}
.chip input{width:18px;height:18px;min-height:0;padding:0;margin:0}
.chip.on{background:#e3f2fd;border-color:#90caf9}
.sw{display:flex;align-items:center;gap:8px;min-height:46px;font-weight:700;font-size:14px;cursor:pointer}
.sw input{width:22px;height:22px;min-height:0;padding:0}
.preview{background:#f8fafc;border:1px dashed #94a3b8;border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:var(--navy);margin-top:10px;line-height:1.5}
.wrow{display:flex;gap:8px;align-items:center;margin-top:6px}.wrow span{flex:1;font-weight:700;font-size:13px}.wrow input{width:100px;text-align:center}
.grow{display:grid;grid-template-columns:70px 70px 70px 1fr 46px;gap:6px;align-items:center;margin-bottom:6px}
.drow{display:grid;grid-template-columns:1fr 90px 46px;gap:6px;align-items:center;margin-bottom:6px}
.dnote{background:#f5f3ff;border-left:4px solid var(--purple);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45;margin:8px 0}
.grow input{padding:8px;text-align:center}.grow input.rem{text-align:left}
.xbtn{border:1px solid #fecaca;background:#fff;color:var(--red);border-radius:10px;min-height:46px;font-weight:900;cursor:pointer}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.prow .full{grid-column:1/-1}
.aline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.ax{min-width:46px;min-height:46px;border:none;border-radius:12px;background:#fee2e2;color:#c62828;font-weight:900;font-size:16px;cursor:pointer}
.apanel{margin-top:10px;padding:10px;border:1.5px solid #90caf9;border-radius:12px;background:#f5faff}.box.flash{box-shadow:0 0 0 3px #ef6c00}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(720px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1;position:relative}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
.tabBtn .dot{position:absolute;top:4px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--orange);display:none}
.tabBtn.dirty .dot{display:block}
</style>
<script src="config.js"></script><script src="ui.js"></script></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <div class="badge-exam" id="examBadge" style="background:#16a34a">Exam: ENABLED</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="wrap">
  <div class="box">
    <div class="title">⚙️ Exam Settings</div>
    <div class="meta">Everything about exams and report cards is set here. Each section has its own Save button. Nothing is saved until you press it, and if anything is wrong nothing is changed.</div>
    <div class="msg" id="gMsg"></div>
    <div id="problems"></div>
  </div>

  <div id="secExams" style="display:none"></div>
  <div id="secReports" style="display:none"></div>
  <div id="secGrades" style="display:none"></div>
  <div id="secAreas" style="display:none"></div>
  <div id="secResults" style="display:none"></div>
  <div id="secAssign" style="display:none"></div>
</div>

<div class="tabs">
  <button class="tabBtn" id="tab_exams" onclick="showSec('exams')"><span class="dot"></span><span class="tabIco">📝</span>Exams</button>
  <button class="tabBtn" id="tab_reports" onclick="showSec('reports')"><span class="dot"></span><span class="tabIco">📄</span>Reports</button>
  <button class="tabBtn" id="tab_grades" onclick="showSec('grades')"><span class="dot"></span><span class="tabIco">🎯</span>Grades</button>
  <button class="tabBtn" id="tab_areas" onclick="showSec('areas')"><span class="dot"></span><span class="tabIco">🎨</span>Extras</button>
  <button class="tabBtn" id="tab_results" onclick="showSec('results')"><span class="dot"></span><span class="tabIco">✅</span>Results</button>
  <button class="tabBtn" id="tab_assign" onclick="showSec('assign')"><span class="dot"></span><span class="tabIco">👩‍🏫</span>Access</button>
  <button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button>
</div>

<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin'){ window.location.href = 'index.html'; }

function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ UI.goBack('admin.html?tab=last'); }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }

/* ===== state ===== */
var ROWS = {exams:[], reports:[], grades:[], areas:[], letters:[], results:[], assign:[], divisions:[]};
var SAVED = {};          // JSON of each section as last loaded/saved, to know what is unsaved
var REF = {classes:[], levels:[], subjects:[], teachers:[], hasMarks:false, problems:[]};
var CUR = 'exams';
var SECS = ['exams', 'reports', 'grades', 'areas', 'letters', 'results', 'assign', 'divisions'];   // S29 (D): divisions live in the Grades tab

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function csv(v){ return String(v || '').split(',').map(x => x.trim()).filter(Boolean); }
function dirty(sec){ return JSON.stringify(ROWS[sec]) !== SAVED[sec]; }
function markDirty(){
  SECS.forEach(s => {
    let tb = $('tab_' + s); if(tb) tb.classList.toggle('dirty', s === 'areas' ? (dirty('areas') || dirty('letters')) : s === 'grades' ? (dirty('grades') || dirty('divisions')) : dirty(s));
    let p = $('pill_' + s); if(p){ p.className = 'pill ' + (dirty(s) ? 'p-dirty' : 'p-ok'); p.innerText = dirty(s) ? 'Unsaved changes' : 'Saved'; }
  });
}
function loadSection(sec, rows){ ROWS[sec] = clone(rows || []); SAVED[sec] = JSON.stringify(ROWS[sec]); }

/* ===== start ===== */
async function init(){
  $('wName').innerText = 'Welcome, ' + (USER.name || USER.username);
  $('wSub').innerText = 'Username: ' + USER.username.toUpperCase();
  $('avatarLetter').innerText = String(USER.name || USER.username).trim().charAt(0).toUpperCase();
  show($('gMsg'), 'Loading...', 'load');
  let r = null;
  try{
    r = await apiGet('getexamsettings', {lite:1});
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.') + (String(r.error || '').indexOf('Tab') > -1 ? ' Run EXAM_setupTabs in Apps Script first.' : ''), 'err'); return; }
    applyData(r, true);
  }catch(e){ show($('gMsg'), '❌ Network problem. Check internet and reload.', 'err'); return; }
  hide($('gMsg'));
  if(r.finishing && r.finishing.length) show($('gMsg'), '⚠️ Classes still finishing the old session: ' + r.finishing.join(', ') + '. A change to the grade scale, the exam list or the report layouts also changes THEIR report cards. Print or save their report cards first if you change these now.', 'warn');   // S14
  showSec((function(){ let q = new URLSearchParams(location.search).get('sec'); return SECS.indexOf(q) > -1 && $('tab_' + q) ? q : 'exams'; })());   // S23: ?sec=results
  loadProblems();
}
// the slow problem check runs after the page is already usable
async function loadProblems(){
  $('problems').innerHTML = '<div class="msg show load">Checking the settings for problems…</div>';
  try{
    let r = await apiGet('getexamproblems');
    if(r.success){ REF.problems = r.problems || []; REF.hasMarks = !!r.hasMarks; }
    else REF.problems = [];
  }catch(e){ REF.problems = []; }
  drawProblems();
}
function applyData(r, all, onlySec){
  REF.classes = r.classes || []; REF.levels = r.levels || []; REF.subjects = r.subjects || []; REF.teachers = r.teachers || [];
  if(!r.lite){ REF.hasMarks = !!r.hasMarks; REF.problems = r.problems || []; }
  SECS.forEach(s => { if(all || s === onlySec) loadSection(s, r[s]); });
  drawProblems();
}
function drawProblems(){
  $('problems').innerHTML = REF.problems.length
    ? '<div class="msg show warn">⚠️ Please fix:<br>' + REF.problems.map(p => '• ' + esc(p)).join('<br>') + '</div>'
    : '';
}
function showSec(sec){
  CUR = sec;
  SECS.forEach(s => { let tb = $('tab_' + s); if(tb) tb.classList.toggle('active', s === sec); });
  $('secExams').style.display = sec === 'exams' ? '' : 'none';
  $('secReports').style.display = sec === 'reports' ? '' : 'none';
  $('secGrades').style.display = sec === 'grades' ? '' : 'none';
  $('secAreas').style.display = sec === 'areas' ? '' : 'none';
  $('secResults').style.display = sec === 'results' ? '' : 'none';     // S23 (L7): own bottom tab
  $('secAssign').style.display = sec === 'assign' ? '' : 'none';
  ({exams:drawExams, reports:drawReports, grades:drawGrades, areas:drawAreas, letters:drawAreas, results:drawResults, assign:drawAssign})[sec]();
  window.scrollTo(0, 0);
}

/* ===== shared pieces ===== */
function secHead(title, note, sec){
  return '<div class="box"><div class="ch"><div class="title">' + title + '</div><span class="pill p-ok" id="pill_' + sec + '">Saved</span></div><div class="meta">' + note + '</div></div>';
}
function saveBar(sec, addLabel, addFn){
  return '<div class="box"><div class="msg" id="msg_' + sec + '"></div><div class="btnrow">' +
    (addFn ? '<button class="btn b-blue" onclick="' + addFn + '">' + addLabel + '</button>' : '') +
    '<button class="btn b-green" id="save_' + sec + '" onclick="saveSec(\'' + sec + '\')">💾 Save ' + ({exams:'Exams', reports:'Reports', grades:'Grade scale', areas:'Extra areas', letters:'Letter grades', results:'Result choices', assign:'Access', divisions:'Division bands'})[sec] + '</button></div></div>';
}
// S13: 'X (all sections)' = one tick for every section of X; a section ticked on its own is also fine
function clsOpts(){ return REF.levels.map(l => ({value:l, label:l + ' (all sections)'})).concat(REF.classes); }
function chipsHtml(sec, i, field, options, selectedCsv, allLabel){
  let sel = csv(selectedCsv).map(x => x.toUpperCase());
  let h = '<div class="chips">';
  options.forEach(o => {
    let v = typeof o === 'string' ? o : o.value, l = typeof o === 'string' ? o : o.label;
    let on = sel.indexOf(String(v).toUpperCase()) > -1;
    h += '<label class="chip ' + (on ? 'on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="toggleChip(\'' + sec + '\',' + i + ',\'' + field + '\',\'' + esc(v) + '\',this.checked)">' + esc(l) + '</label>';
  });
  h += '</div>';
  if(allLabel) h += '<div class="meta" style="margin-top:4px">' + allLabel + '</div>';
  return h;
}
function toggleChip(sec, i, field, val, on){
  let list = csv(ROWS[sec][i][field]);
  let idx = list.map(x => x.toUpperCase()).indexOf(String(val).toUpperCase());
  if(on && idx < 0) list.push(val);
  if(!on && idx > -1) list.splice(idx, 1);
  // keep list in the same order as the options
  let order = field === 'Exams' ? ROWS.exams.map(e => e.ExamID) : field === 'Reports' ? ROWS.reports.map(e => e.ReportID) : REF.levels.concat(REF.classes);
  list.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  ROWS[sec][i][field] = list.join(',');
  redraw(sec);
}
function setF(sec, i, f, v){ ROWS[sec][i][f] = v; markDirty(); if(sec === 'reports' || sec === 'exams') refreshPreview(sec, i); }
function setYN(sec, i, f, on){ ROWS[sec][i][f] = on ? 'YES' : 'NO'; markDirty(); }
function redraw(sec){ let y = window.scrollY; ({exams:drawExams, reports:drawReports, grades:drawGrades, areas:drawAreas, letters:drawAreas, results:drawResults, assign:drawAssign, divisions:drawGrades})[sec](); window.scrollTo(0, y); }
async function delRow(sec, i){
  if(!(await UI.ask('Remove this row? It is only removed for good when you press Save.'))) return;
  ROWS[sec].splice(i, 1); redraw(sec);
}
function yn(v){ return String(v || '').toUpperCase() === 'YES'; }

async function saveSec(sec){
  let b = $('save_' + sec), m = $('msg_' + sec);
  b.disabled = true; show(m, 'Saving...', 'load');
  try{
    let r = await apiPost('saveexamsettings', {section:sec, rows:ROWS[sec]});
    if(!r.success){ show(m, '❌ ' + (r.error || 'Could not save.'), 'err'); return; }
    let f = await apiGet('getexamsettings', {lite:1});
    if(f.success) applyData(f, false, sec); else loadSection(sec, ROWS[sec]);
    redraw(sec);
    loadProblems();
    show($('msg_' + sec), '✅ Saved (' + r.saved + ' row' + (r.saved === 1 ? '' : 's') + ').', 'ok');
  }catch(e){ show(m, '❌ Network problem. Nothing may have been saved. Please check and try again.', 'err'); }
  finally{ let bb = $('save_' + sec); if(bb) bb.disabled = false; }
}

/* ===== EXAMS ===== */
function drawExams(){
  let h = secHead('📝 Exams', 'The tests and exams of the session, in the order they happen. <b>PT</b> = periodic test, <b>TERM</b> = half yearly / annual type. Leave Classes empty if the exam is for every class. The ID cannot be changed after saving.', 'exams');
  if(!ROWS.exams.length) h += '<div class="box"><div class="empty-note">No exam yet. Press "Add Exam", or load a Starter set.</div></div>';
  ROWS.exams.forEach((e, i) => {
    h += '<div class="card exam"><div class="ch"><b>' + esc(e.ShortName || e.ExamName || 'New exam') + '</b>' + (yn(e.Locked) ? '<span class="pill p-lock">Locked</span>' : '') + '</div>' +
      '<div class="row"><div><label>Exam ID</label><input ' + (e._new ? '' : 'readonly') + ' maxlength="10" value="' + esc(e.ExamID) + '" placeholder="e.g. PT1" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9_]/g,\'\');setF(\'exams\',' + i + ',\'ExamID\',this.value)"></div>' +
      '<div style="flex:2"><label>Exam name</label><input value="' + esc(e.ExamName) + '" placeholder="e.g. Periodic Test 1" oninput="setF(\'exams\',' + i + ',\'ExamName\',this.value)"></div></div>' +
      '<div class="row"><div><label>Short name (on report)</label><input maxlength="12" value="' + esc(e.ShortName) + '" placeholder="e.g. PT-1" oninput="setF(\'exams\',' + i + ',\'ShortName\',this.value)"></div>' +
      '<div><label>Type</label><select onchange="setF(\'exams\',' + i + ',\'ExamType\',this.value)"><option value="PT"' + (String(e.ExamType).toUpperCase() === 'PT' ? ' selected' : '') + '>PT (periodic test)</option><option value="TERM"' + (String(e.ExamType).toUpperCase() === 'TERM' ? ' selected' : '') + '>TERM (half yearly / annual)</option></select></div></div>' +
      '<div class="meta" style="margin:4px 0 6px">Type PT uses each subject\'s <b>Periodic test</b> marks, TERM uses its <b>Term exam</b> marks (Subject Master).</div>' +
      '<label>Classes</label>' + chipsHtml('exams', i, 'Classes', clsOpts(), e.Classes, 'None ticked = all classes') +
      '<div class="row"><label class="sw"><input type="checkbox" ' + (yn(e.EntryOpen) ? 'checked' : '') + ' onchange="setYN(\'exams\',' + i + ',\'EntryOpen\',this.checked)">Marks entry open for teachers</label>' +

function examShort(id){ let e = ROWS.exams.find(x => String(x.ExamID).toUpperCase() === String(id).toUpperCase()); return e ? (e.ShortName || e.ExamName || e.ExamID) : id; }
function weightMap(r){ let m = {}; csv(r.Weights).forEach(p => { let a = p.split(':'); if(a.length === 2) m[a[0].trim().toUpperCase()] = a[1].trim(); }); return m; }
function previewText(r){
  let ex = csv(r.Exams); if(!ex.length) return 'Choose at least one exam.';
  let rule = String(r.CombineRule || '');
  let cls = csv(r.Classes).length ? 'Classes ' + csv(r.Classes).join(', ') : 'All classes';
  if(rule === 'Single') return (ex.length === 1 ? examShort(ex[0]) + ' marks shown as they are' : '⚠️ "Single" needs exactly one exam') + ' · ' + cls;
  if(ex.length < 2) return '⚠️ This rule needs two or more exams · ' + cls;
  if(rule === 'Add marks') return ex.map(examShort).join(' + ') + ' = marks added together · ' + cls;
  let w = weightMap(r), tot = 0;
  let parts = ex.map(x => { let n = Number(w[x.toUpperCase()]) || 0; tot += n; return examShort(x) + ' (' + n + '%)'; });
  return parts.join(' + ') + ' = weighted percentage' + (Math.round(tot * 100) === 10000 ? '' : ' · ⚠️ total is ' + (Math.round(tot * 100) / 100) + ', must be 100') + ' · ' + cls;
}

function gradeCheck(){
  let t = ROWS.grades.map(g => ({f:Number(g.FromPercent), t:Number(g.ToPercent), g:g.Grade}));
  if(!t.length) return 'No grades yet.';
  if(t.some(x => isNaN(x.f) || isNaN(x.t) || !x.g)) return '⚠️ Fill From, To and Grade in every row.';
  t.sort((a, b) => b.f - a.f);
  let exp = 100;
  for(let x of t){ if(x.t > exp) return '⚠️ ' + x.g + ' overlaps the grade above it.'; if(x.t < exp) return '⚠️ Gap: nothing covers ' + (x.t + 1) + ' to ' + exp + '.'; exp = x.f - 1; }
  return exp === -1 ? '✅ The scale covers 0 to 100 with no gaps or overlaps.' : '⚠️ Gap: nothing covers 0 to ' + exp + '.';
}

function divCheck(){
  let t = ROWS.divisions.map(d => ({f:Number(d.FromPercent), n:String(d.Division || '').trim(), raw:String(d.FromPercent).trim()}));
  if(!t.length) return 'No division bands yet. The Marks sheet card then prints "–" for Division.';

  let subs = A_ADD.cls ? subjectsOf(A_ADD.cls) : [];
  return '<div class="apanel"><label>Class</label><select onchange="A_ADD.cls=this.value;A_ADD.subs=[];redraw(\'assign\')"><option value="">- Class -</option>' + REF.classes.map(c => '<option' + (A_ADD.cls === c ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' +
    (A_ADD.cls ? '<label>Subjects (tick one or more)</label>' + (subs.length ? '<div class="chips">' + subs.map(sb => '<label class="chip' + (A_ADD.subs.indexOf(sb) > -1 ? ' on' : '') + '"><input type="checkbox"' + (A_ADD.subs.indexOf(sb) > -1 ? ' checked' : '') + ' onchange="aTick(\'' + esc(sb) + '\',this.checked)">' + esc(sb) + '</label>').join('') + '</div>' : '<div class="meta">Class ' + esc(A_ADD.cls) + ' has no subjects in Subject Master.</div>') : '') +
    '<label>Exam</label><select onchange="A_ADD.exam=this.value"><option value="">All exams</option>' + ROWS.exams.filter(e => e.ExamID).map(e => '<option value="' + esc(e.ExamID) + '"' + (A_ADD.exam === e.ExamID ? ' selected' : '') + '>' + esc(e.ShortName || e.ExamID) + '</option>').join('') + '</select>' +
    '<div class="btnrow"><button class="btn b-green" data-nofb onclick="aAdd(\'' + esc(u) + '\')">➕ Add</button><button class="btn b-grey" data-nofb onclick="A_OPEN=\'\';redraw(\'assign\')">Cancel</button></div></div>';
}
function aOpen(u){ A_OPEN = u; A_ADD = {cls:'', subs:[], exam:''}; delete A_NOTE[u]; redraw('assign'); }
function aTick(sb, on){ let i = A_ADD.subs.indexOf(sb); if(on && i < 0) A_ADD.subs.push(sb); if(!on && i > -1) A_ADD.subs.splice(i, 1); redraw('assign'); }
function aHas(u, cls, sub, ex){ return ROWS.assign.some(a => String(a.Username).toUpperCase() === u && String(a.Class).toUpperCase() === cls && String(a.SubjectName).toUpperCase() === sub && String(a.ExamID || '').toUpperCase() === String(ex || '').toUpperCase()); }
function aAdd(u){
  if(!A_ADD.cls){ A_NOTE[u] = ['Choose the class first.', 'err']; redraw('assign'); return; }
  if(!A_ADD.subs.length){ A_NOTE[u] = ['Tick at least one subject.', 'err']; redraw('assign'); return; }
  let added = 0, dup = [];
  A_ADD.subs.forEach(sb => { if(aHas(u, A_ADD.cls, sb, A_ADD.exam)){ dup.push(sb); return; } ROWS.assign.push({AssignID:'', Username:u, Class:A_ADD.cls, SubjectName:sb, ExamID:A_ADD.exam, Note:''}); added++; });
  A_NOTE[u] = [(added ? '✅ ' + added + ' line' + (added > 1 ? 's' : '') + ' added. ' : '') + (dup.length ? 'Already there (skipped): ' + dup.join(', ') + '. ' : '') + (added ? 'Tap 💾 Save Access.' : ''), added ? 'ok' : 'warn'];
  A_OPEN = ''; redraw('assign');
}
function aDel(i){ let u = String(ROWS.assign[i].Username || '').toUpperCase(); ROWS.assign.splice(i, 1); if(!ROWS.assign.some(a => String(a.Username || '').toUpperCase() === u) && u && A_EXTRA.indexOf(u) < 0) A_EXTRA.push(u); A_NOTE[u] = ['Line removed. Tap 💾 Save Access to keep it so.', 'warn']; redraw('assign'); }
function aAddT(u){
  if(!u) return;
  if(aUsers().indexOf(u) < 0) A_EXTRA.push(u);
  A_OPEN = u; A_ADD = {cls:'', subs:[], exam:''}; redraw('assign');
  let c = $('tc_' + u); if(c){ c.scrollIntoView({block:'center', behavior:'smooth'}); c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1500); }
}
async function aFillTT(u, btn){
  let r;
  try{ r = await apiGet('gettimetableforteacher', {username:u}); }catch(e){ A_NOTE[u] = ['❌ Could not connect. Try again.', 'err']; redraw('assign'); return; }
  if(!r || !r.success){ A_NOTE[u] = ['❌ ' + ((r && r.error) || 'Could not read the timetable.'), 'err']; redraw('assign'); return; }
  let seen = {}, added = 0, dup = 0, skip = [];
  (r.timetable || []).forEach(e => {
    let cls = String(e.className || e.grade || '').toUpperCase(), sb = String(e.subject || '').toUpperCase(), k = cls + '|' + sb;
    if(!cls || !sb || seen[k]) return; seen[k] = 1;
    if(subjectsOf(cls).indexOf(sb) < 0){ skip.push(cls + ' ' + sb); return; }
    if(aHas(u, cls, sb, '') ){ dup++; return; }
    ROWS.assign.push({AssignID:'', Username:u, Class:cls, SubjectName:sb, ExamID:'', Note:''}); added++;
  });
  A_NOTE[u] = [!Object.keys(seen).length ? 'This teacher has no periods in the timetable.' : (added ? '✅ ' + added + ' line' + (added > 1 ? 's' : '') + ' added from the timetable (All exams). Check them, then tap 💾 Save Access.' : 'Nothing new from the timetable.') + (dup ? ' Already there: ' + dup + '.' : '') + (skip.length ? ' Not in Subject Master (skipped): ' + skip.join(', ') + '.' : ''), added ? 'ok' : 'warn'];
  redraw('assign');
}

window.addEventListener('beforeunload', function(e){ if(SECS.some(dirty)){ e.preventDefault(); e.returnValue = ''; } });
init();
</script>
