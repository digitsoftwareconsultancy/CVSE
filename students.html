<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.09-S1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Students</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b;--frame:#1a4bb5;--cream:#fdf6d0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:760px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-grey{background:#e5e7eb;color:#475569}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}
.lock{background:#fff7ed;border:1px solid #ffcc80;border-radius:16px;padding:18px;text-align:center;color:#9a3412;font-weight:700;line-height:1.5}
.lock b{display:block;font-size:30px;margin-bottom:6px}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.school{display:flex;gap:12px;align-items:center}
.school img{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.school b{font-size:16px;color:var(--navy)}
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:none}.drow span{color:var(--muted);font-weight:700}.drow b{text-align:right}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:#fff;border-radius:16px;border:1px solid #eef0f3;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:14px 10px;text-align:center;font-weight:800;color:var(--navy);cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:4px solid var(--blue)}
.go .ic{font-size:28px}.go small{font-size:11px;color:var(--muted);font-weight:700}
.go.closed{opacity:.6;border-left-color:#f59e0b}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex-shrink:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:13px;color:var(--navy);background:#fff;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:5px solid var(--blue);margin-bottom:10px}
.item h4{margin:0 0 6px;color:var(--navy);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.item h4 small{color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap}
.line{font-size:13.5px;line-height:1.5;margin:3px 0}.line span{color:var(--muted);font-weight:700}
.hw{background:#fff7ed;border-left:3px solid var(--orange);padding:6px 8px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--navy)}.stat span{font-size:10.5px;color:var(--muted);font-weight:700}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fee2e2;color:#991b1b}.dchip.l{background:#fff3e0;color:#9a3412}.dchip.u{background:#ede9fe;color:#5b21b6}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#e0f2fe;color:#075985}.tag.up{background:#fff3e0;color:#9a3412}
.score{font-size:22px;font-weight:900;color:var(--navy)}.score small{font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .card{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.1);border-top:5px solid var(--navy)}
#login h1{margin:8px 0 2px;font-size:20px;color:var(--navy);text-align:center}
#login .sch{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:8px}
#login img{display:block;margin:0 auto;max-width:90px;max-height:90px;border-radius:12px}

@media print{
  body{background:#fff;padding:0}
  body>.top,body>.tabs,.noprint,#screens>.scr:not(#s_result),#resList,#resMsg,#cardBar{display:none!important}
  .wrap{margin:0;padding:0;max-width:none}
}
</style><style>
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cl{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cl label{margin:0;display:flex;align-items:center;gap:6px;border:1px solid #cbd5e1;border-radius:999px;padding:0 12px;min-height:38px;font-size:13px;background:#fff;font-weight:600}
.cl input{width:auto;min-height:0}
textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:70px}
.ty{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.t-HOLIDAY{background:#c62828}.t-EXAM{background:#7c3aed}.t-PROGRAM,.t-PTM{background:#1976d2}.t-OTHER{background:#64748b}
.item.cancelled{border-left-color:#94a3b8!important}.item.cancelled>*:not(.btnrow){opacity:.55}.item.cancelled h4 span.tt{text-decoration:line-through}
.mh{font-weight:900;color:var(--navy);font-size:14px;margin:14px 2px 6px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px;font-weight:700;color:#475569}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
pre.res{white-space:pre-wrap;font-family:inherit;margin:0}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sec{display:none}.sec.on{display:block}
.card2{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;position:relative}
.card2 h5{margin:0 0 4px;color:var(--navy);font-size:14px}
.x{position:absolute;right:8px;top:8px;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;min-height:36px;min-width:36px;font-weight:900;cursor:pointer}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.probs{background:#fff7ed;border:1px solid #ffcc80;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px;color:#9a3412;font-weight:700;line-height:1.5}
.amt{width:100%;border-collapse:collapse;font-size:13px}.amt th,.amt td{border:1px solid var(--line);padding:4px;text-align:center}
.amt th{background:#eef2f7;color:var(--navy);position:sticky;top:0}.amt td:first-child,.amt th:first-child{text-align:left;font-weight:700;min-width:110px}
.amt input{min-height:40px;padding:6px;font-size:15px;text-align:right}
.scroll{overflow-x:auto}
.mo{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.mo label{margin:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 10px;min-height:36px;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;background:#fff}.mo input{width:auto;min-height:0}
h3.g{margin:14px 0 4px;color:var(--navy);font-size:14px;border-bottom:2px solid var(--line);padding-bottom:3px}

.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap}
.pill.n{background:#dcfce7;color:#166534}.pill.o{background:#e5e7eb;color:#374151}.pill.d{background:#fee2e2;color:#991b1b}.pill.g{background:#dcfce7;color:#166534}
.srow{background:#fff;border-radius:14px;padding:12px;border:1px solid #eef0f3;border-left:5px solid var(--blue);margin-bottom:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.srow b{color:var(--navy)}.srow .l2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ft{width:100%;border-collapse:collapse;font-size:12.5px}.ft th,.ft td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}.ft th{background:#eef2f7;color:var(--navy);font-size:11.5px}.ft td:first-child,.ft th:first-child,.ft td:nth-child(2),.ft th:nth-child(2){text-align:left}
.ft tr.tot td{font-weight:900;border-top:2px solid var(--navy)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.big div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.big b{display:block;font-size:18px;color:var(--navy)}.big span{font-size:11px;color:var(--muted);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;font-weight:700;color:var(--navy)}.chk input{width:22px;height:22px;min-height:0}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}.modal.on{display:flex}
</style></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
 <div id="vList">
  <div class="box"><div class="title">Students</div><div class="meta">Choose a class, tap a student to change the details, or add a new student.</div>
   <label>Search (name or admission no)</label><input id="q" oninput="drawList()" placeholder="Type to filter">
   <div class="btnrow"><button class="btn b-green" onclick="newStu()">+ Add new student</button></div></div>
  <div class="chips" id="chips"></div>
  <div class="msg" id="gMsg"></div>
  <div id="list"></div>
 </div>
 <div id="vEdit" style="display:none"></div>
</div>
<div class="modal" id="dm"><div style="background:#fff;border-radius:16px;padding:16px;max-width:380px;width:100%"><div class="title">Delete student?</div><div class="meta" id="dMsg"></div><div class="btnrow"><button class="btn" style="background:var(--red)" id="dBtn" onclick="doDelete()">Yes, delete</button><button class="btn b-navy" onclick="$('dm').classList.remove('on')">No</button></div><div class="msg" id="dErr"></div></div></div>
<div class="tabs" id="tabsBar"><button class="tabBtn active"><span class="tabIco">🎓</span>Students</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div><script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyNYyNG5RYxe6tjztXsVbKEAkstJBNYmfwLWZvIqkPouFQsEOsovL-HPmb-KQ82_0NS/exec";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();



var CLS = null, D = null, EDIT = null, ISNEW = false, DEL = '';
async function load(){
  show($('gMsg'),'Loading students... please wait','load'); $('list').innerHTML = '<div class="empty-note">⏳ Loading...</div>';
  try{
    let r = await apiGet('liststudents', CLS ? {'class':CLS} : {});
    if(!r.success){ show($('gMsg'),'❌ '+(r.error||'Could not load.'),'err'); $('list').innerHTML=''; return; }
    D = r; hide($('gMsg'));
    if(!CLS && r.classes.length){ CLS = r.classes[0]; return load(); }
    $('chips').innerHTML = r.classes.map(c=>'<button class="chip'+(c===CLS?' on':'')+'" onclick="CLS=\''+esc(c)+'\';load()">'+esc(c)+'</button>').join('');
    drawList();
  }catch(e){ show($('gMsg'),'❌ Could not connect. Check internet and try again.','err'); $('list').innerHTML=''; }
}
function drawList(){
  if(!D) return; let q = $('q').value.trim().toLowerCase();
  let a = D.students.filter(s=>!q || (s.Name+' '+s.AdmissionNo).toLowerCase().indexOf(q) > -1);
  $('list').innerHTML = a.length ? a.map((s,i)=>'<div class="srow" onclick="editStu(\''+esc(s.AdmissionNo)+'\')"><b>'+esc(s.Name)+'</b><div class="meta">Class '+esc(s.Class)+(s.RollNo?' · Roll '+esc(s.RollNo):'')+' · Adm '+esc(s.AdmissionNo)+(s.DOB?' · DOB '+esc(s.DOB):'')+'</div></div>').join('') : '<div class="empty-note">No students found.</div>';
}
function grp(cls){ let g = (D.groups||{})[cls] || {}; return Object.keys(g).map(k=>({group:k,subjects:g[k]})); }
function editStu(adm){ EDIT = D.students.find(s=>s.AdmissionNo===adm); ISNEW = false; drawEdit(); }
function newStu(){ EDIT = {AdmissionNo:'',Name:'',RollNo:'',Class:CLS||'',DOB:'',FatherName:'',MotherName:'',House:'',electives:[]}; ISNEW = true; drawEdit(); }
function elHtml(cls, chosen){
  let gs = grp(cls); if(!gs.length) return '';
  return '<h3 class="g">Elective subjects</h3>'+gs.map((g,i)=>{ let c = (chosen||[]).find(x=>x.group===g.group); return '<label>'+esc(g.group)+'</label><select class="el" data-g="'+esc(g.group)+'"><option value="">Choose</option>'+g.subjects.map(s=>'<option'+(c&&c.subject===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'; }).join('');
}
function drawEdit(){
  let s = EDIT;
  $('vList').style.display = 'none'; $('vEdit').style.display = 'block'; window.scrollTo(0,0);
  $('vEdit').innerHTML = '<div class="box"><div class="title">'+(ISNEW?'New student':esc(s.Name))+'</div>'+
   '<label>Admission no</label><input id="f_adm" value="'+esc(s.AdmissionNo)+'" '+(ISNEW?'':'readonly style="background:#f1f5f9"')+' maxlength="30">'+
   '<label>Name</label><input id="f_name" value="'+esc(s.Name)+'" maxlength="80">'+
   '<div class="row2"><div><label>Class</label><select id="f_cls" onchange="clsChange()">'+D.classes.map(c=>'<option'+(c===s.Class?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div><div><label>Roll no</label><input id="f_roll" inputmode="numeric" value="'+esc(s.RollNo)+'"></div></div>'+
   '<label>Date of birth</label><input id="f_dob" inputmode="numeric" maxlength="10" oninput="maskD(this)" value="'+esc(s.DOB)+'" placeholder="DD-MM-YYYY">'+
   '<label>Father name</label><input id="f_fa" value="'+esc(s.FatherName)+'"><label>Mother name</label><input id="f_mo" value="'+esc(s.MotherName)+'"><label>House</label><input id="f_ho" value="'+esc(s.House)+'">'+
   '<div id="elBox">'+elHtml(s.Class, s.electives)+'</div>'+
   '<div class="btnrow"><button class="btn b-green" id="saveBtn" onclick="saveStu()">Save</button><button class="btn b-navy" onclick="closeEdit()">Back to list</button></div>'+
   (!ISNEW && D.canDelete?'<div class="btnrow"><button class="btn" style="background:var(--red)" onclick="askDelete()">Delete this student</button></div>':'')+
   '<div class="msg" id="sMsg"></div></div>';
}
function clsChange(){ $('elBox').innerHTML = elHtml($('f_cls').value, EDIT.electives); }
function closeEdit(){ $('vEdit').style.display = 'none'; $('vList').style.display = 'block'; load(); }
async function saveStu(){
  let b = $('saveBtn'), m = $('sMsg'); b.disabled = true; show(m,'Saving... please wait','load');
  let st = {AdmissionNo:$('f_adm').value.trim(),Name:$('f_name').value,Class:$('f_cls').value,RollNo:$('f_roll').value.trim(),DOB:$('f_dob').value.trim(),FatherName:$('f_fa').value,MotherName:$('f_mo').value,House:$('f_ho').value};
  let els = [...document.querySelectorAll('.el')].map(x=>({group:x.dataset.g,subject:x.value}));
  try{
    let r = await apiPost(ISNEW?'addstudent':'updatestudent',{student:JSON.stringify(st),electives:JSON.stringify(els)});
    if(r.success){ show(m,'✅ '+(r.message||'Saved.'),'ok'); CLS = st.Class; EDIT = Object.assign({},st,{electives:els.filter(x=>x.subject)}); ISNEW = false; setTimeout(closeEdit,900); return; }
    show(m,'❌ '+(r.error||'Could not save.'),'err'); m.scrollIntoView({block:'center'});
  }catch(e){ show(m,'❌ Could not connect. Nothing was saved. Try again.','err'); }
  b.disabled = false;
}
function askDelete(){ DEL = EDIT.AdmissionNo; $('dMsg').innerText = EDIT.Name + ' (' + DEL + ') will be removed. A student who has exam marks cannot be deleted.'; hide($('dErr')); $('dm').classList.add('on'); }
async function doDelete(){
  let b = $('dBtn'); b.disabled = true; show($('dErr'),'Deleting... please wait','load');
  try{ let r = await apiPost('deletestudent',{adm:DEL}); if(r.success){ $('dm').classList.remove('on'); closeEdit(); } else show($('dErr'),'❌ '+(r.error||'Could not delete.'),'err'); }
  catch(e){ show($('dErr'),'❌ Could not connect. Try again.','err'); }
  b.disabled = false;
}
load();
</script>
</body></html>
