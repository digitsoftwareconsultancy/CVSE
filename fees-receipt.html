 <div class="box noprint"><div class="title" id="ttl">Receipt</div><div class="meta" id="sub">Loading receipt... please wait</div>
  <div class="btnrow"><button class="btn b-blue" id="printBtn" onclick="window.print()" disabled>🖨 Print</button><button class="btn b-navy" onclick="history.length>1?history.back():goBack()">⬅ Back</button></div>

<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var STU = new URLSearchParams(location.search).get('stu') === '1';
var USER = STU ? {username:ls('cvse_sadm'), name:ls('cvse_sname'), role:'student'} : {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
var TOKEN = STU ? ls('cvse_stoken') : ls('cvse_token');
var HOME = STU ? 'student.html' : 'index.html';
if(!TOKEN || !USER.username || (!STU && USER.role !== 'admin' && USER.role !== 'accountant')){ window.location.href = HOME; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = HOME; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(TOKEN);
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:TOKEN}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = STU ? 'student.html' : (USER.role === 'admin' ? 'admin.html' : 'accountant.html'); }
function doLogout(){ if(STU){ window.location.href = 'student.html'; return; } try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = STU ? 'STUDENT' : (USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN');
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();



var R = null, QS = new URLSearchParams(location.search);
function money(n,dec){ n = Number(n)||0; return n.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function copyHtml(r, label){
  let L = r.layout, dec = L.decimals, sc = r.school;
  let h = '<div class="copy"><div class="hd">'+(sc.logo?'<img src="'+esc(sc.logo)+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div class="ph"><b>'+esc(sc.name||'School')+'</b>'+(sc.address?'<span>'+esc(sc.address)+(sc.phone?' · '+esc(sc.phone):'')+'</span>':'')+(sc.affiliation?'<span>Affiliation No: '+esc(sc.affiliation)+'</span>':'')+L.header.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><span class="tag">'+esc(label)+'</span></div>'+
   '<div class="meta2"><span>MONEY RECEIPT &nbsp; No: '+esc(r.receiptNo)+'</span><span>Date: '+esc(r.date)+'</span></div>'+
   '<div class="st"><div><span>Name: </span><b>'+esc(r.student.name)+'</b></div><div><span>Class: </span><b>'+esc(r.student.cls)+'</b></div><div><span>Adm No: </span><b>'+esc(r.student.adm)+'</b></div>'+(r.student.father?'<div style="grid-column:1/4"><span>Father: </span><b>'+esc(r.student.father)+'</b></div>':'')+'</div>';
  if(L.style === 'LIST'){
    h += '<table class="l"><tr><th>Particulars</th><th>Amount</th></tr>'+r.lines.map(l=>'<tr><td>'+esc(l.label)+(l.qty>1?' × '+l.qty:'')+'</td><td>'+money(l.amount,dec)+'</td></tr>').join('')+'</table>';
  }else{
    let cols = {1:[],2:[],3:[]}, gm = {}; r.groups.forEach(g=>{ gm[g.id] = g; cols[g.column] = cols[g.column] || []; });
    let boxes = {}; r.groups.forEach(g=>boxes[g.id] = {g:g, lines:[]}); let other = {g:{name:'Other',column:3}, lines:[]};
    r.lines.forEach(l=>{ (boxes[l.groupId] || other).lines.push(l); });
    let all = r.groups.map(g=>boxes[g.id]); if(other.lines.length) all.push(other);
    let used = [1,2,3].filter(c=>all.some(b=>b.g.column===c && b.lines.length));
    if(!used.length) used = [1];
    h += '<div class="cols" style="grid-template-columns:repeat('+used.length+',1fr)">'+used.map(c=>'<div>'+all.filter(b=>b.g.column===c).map(b=>'<div class="gb" style="margin-bottom:6px"><h6>'+esc(b.g.name)+'</h6>'+(b.lines.length?b.lines.map(l=>'<div class="ln"><span>'+esc(l.label)+(l.qty>1?' ×'+l.qty:'')+'</span><i>'+money(l.amount,dec)+'</i></div>').join(''):'<div class="ln"><span>—</span><i></i></div>')+'</div>').join('')+'</div>').join('')+'</div>';
  }
  h += '<div class="tt"><span>TOTAL</span><span>₹ '+money(r.total,dec)+'</span></div>'+(L.showWords?'<div class="words">'+esc(r.words)+'</div>':'')+
   '<div class="pm">Paid by <b>'+esc(r.mode)+'</b>'+(r.ref?' · Ref: '+esc(r.ref):'')+(r.note?' · '+esc(r.note):'')+(r.status==='ACTIVE'&&r.balanceAfter>0?' · Balance due: ₹ '+money(r.balanceAfter,dec):'')+'</div>'+
   '<div class="sg"><span>Parent / Guardian</span><span>Accountant'+(r.collectedBy?' ('+esc(r.collectedBy)+')':'')+'</span></div>'+(L.footer?'<div class="ft">'+esc(L.footer)+'</div>':'')+
   (r.sample?'<div class="wm s">SAMPLE</div>':'')+(r.status==='CANCELLED'?'<div class="wm">CANCELLED</div>':'')+'</div>';
  return h;
}
function render(){
  let r = R, mode = r.layout.copies, h = '';
  if(mode === 'ONE_COPY') h = copyHtml(r,'Parent copy');
  else if(mode === 'TWO_PAGES') h = '<div class="pgbreak">'+copyHtml(r,'Parent copy')+'</div>'+copyHtml(r,'Office copy');
  else h = copyHtml(r,'Parent copy')+'<div class="cut">✂ - - - - - - - - - - - - - - - - - - - - - - - - - -</div>'+copyHtml(r,'Office copy');
  $('sheet').innerHTML = h; fit();
  $('ttl').innerText = (r.sample ? 'Sample receipt' : 'Receipt ' + r.receiptNo) + (r.status==='CANCELLED' ? ' — CANCELLED' : '');
  $('sub').innerText = r.sample ? 'This is only a sample with made-up data, to show the design. Change the look in Fees Settings → Receipt & Rules.' : r.student.name + ' · ₹ ' + money(r.total, r.layout.decimals) + ' · ' + r.date;
  $('hint').innerText = 'Layout: '+(r.layout.style==='LIST'?'simple list':'form boxes')+' · '+({ONE_PAGE:'parent + office copy on one page',TWO_PAGES:'two pages',ONE_COPY:'one copy'}[r.layout.copies])+'. In the print window choose A4 and turn off “Headers and footers”.';
  $('printBtn').disabled = false;
}
function fit(){ let w = Math.min(1, (window.innerWidth - 24) / 720); $('sheet').style.zoom = w; }
window.addEventListener('resize', fit);
function sampleData(me){
  let L = me.layout, g = me.groups.length ? me.groups : [{id:'G1',name:'Admission',column:1},{id:'G2',name:'Accessories',column:2},{id:'G3',name:'Monthly',column:3}];
  let id = n => (g.find(x=>new RegExp(n,'i').test(x.name))||g[0]).id;
  let no = String(1); while(no.length < L.pad) no = '0' + no;
  return {sample:true, receiptNo:(L.prefix||'')+no, date:'08-11-2026', status:'ACTIVE', student:{name:'Sample Student', cls:'I', adm:'101', father:'Sample Father'}, mode:'Cash', ref:'', note:'', total:2520, words:'Rupees Two Thousand Five Hundred Twenty Only', balanceAfter:3600, collectedBy:me.name,
   lines:[{label:'Admission Fee – 1st',amount:600,kind:'FEE',qty:1,groupId:id('admis')},{label:'Tie (M)',amount:70,kind:'ITEM',qty:1,groupId:id('access')},{label:'Tuition – Apr',amount:1200,kind:'FEE',qty:1,groupId:id('month')},{label:'Tuition – May',amount:600,kind:'FEE',qty:1,groupId:id('month')},{label:'Late fine',amount:50,kind:'FINE',qty:1,groupId:''}],
   groups:g, school:me.schoolInfo, layout:L};
}
async function init(){
  show($('gMsg'),'Loading receipt... please wait','load');
  try{
    if(QS.get('sample')){
      let me = await apiGet('feeme',{});
      if(!me.success){ show($('gMsg'),'❌ '+(me.error||'Could not load.'),'err'); return; }
      R = sampleData(me); hide($('gMsg')); render(); return;
    }
    let r = await apiGet(STU ? 'studentfeereceipt' : 'feereceipt',{no:QS.get('no')||'',session:QS.get('s')||''});
    if(!r.success){ show($('gMsg'),'❌ '+(r.error||'Could not load the receipt.'),'err'); $('sub').innerText = 'Receipt not available.'; return; }
    R = r; hide($('gMsg')); render();
  }catch(e){ show($('gMsg'),'❌ Could not connect. Check internet and try again.','err'); }
}
init();
</script>
</body></html>
