<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.13-S7">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fee Reports</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b;--frame:#1a4bb5;--cream:#fdf6d0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:760px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-grey{background:#e5e7eb;color:#475569}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}
.lock{background:#fff7ed;border:1px solid #ffcc80;border-radius:16px;padding:18px;text-align:center;color:#9a3412;font-weight:700;line-height:1.5}
.lock b{display:block;font-size:30px;margin-bottom:6px}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.school{display:flex;gap:12px;align-items:center}
.school img{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.school b{font-size:16px;color:var(--navy)}
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:none}.drow span{color:var(--muted);font-weight:700}.drow b{text-align:right}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:#fff;border-radius:16px;border:1px solid #eef0f3;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:14px 10px;text-align:center;font-weight:800;color:var(--navy);cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:4px solid var(--blue)}
.go .ic{font-size:28px}.go small{font-size:11px;color:var(--muted);font-weight:700}
.go.closed{opacity:.6;border-left-color:#f59e0b}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex-shrink:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:13px;color:var(--navy);background:#fff;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:5px solid var(--blue);margin-bottom:10px}
.item h4{margin:0 0 6px;color:var(--navy);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.item h4 small{color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap}
.line{font-size:13.5px;line-height:1.5;margin:3px 0}.line span{color:var(--muted);font-weight:700}
.hw{background:#fff7ed;border-left:3px solid var(--orange);padding:6px 8px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--navy)}.stat span{font-size:10.5px;color:var(--muted);font-weight:700}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fee2e2;color:#991b1b}.dchip.l{background:#fff3e0;color:#9a3412}.dchip.u{background:#ede9fe;color:#5b21b6}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#e0f2fe;color:#075985}.tag.up{background:#fff3e0;color:#9a3412}
.score{font-size:22px;font-weight:900;color:var(--navy)}.score small{font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .card{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.1);border-top:5px solid var(--navy)}
#login h1{margin:8px 0 2px;font-size:20px;color:var(--navy);text-align:center}
#login .sch{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:8px}
#login img{display:block;margin:0 auto;max-width:90px;max-height:90px;border-radius:12px}

@media print{
  body{background:#fff;padding:0}
  body>.top,body>.tabs,.noprint,#screens>.scr:not(#s_result),#resList,#resMsg,#cardBar{display:none!important}
  .wrap{margin:0;padding:0;max-width:none}
}
</style>
<style>
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.go{min-height:84px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat{padding:10px 6px}.stat b{font-size:18px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.rt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.rt th{background:#eef2f7;color:var(--navy);font-size:11.5px;padding:7px 6px;text-align:left;border-bottom:2px solid var(--navy);position:sticky;top:0;white-space:nowrap}
.rt td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.rt .n{text-align:right;white-space:nowrap}
.rt tr.tot td{font-weight:900;border-top:2px solid var(--navy);background:#f8fafc}
.rt tbody tr:nth-child(even) td{background:#fafbfc}
.tt2{font-weight:900;color:var(--navy);font-size:14px;margin:14px 0 6px}
.pick{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;margin-bottom:6px;min-height:46px;font-size:14px;cursor:pointer;font-family:inherit}
.pick b{color:var(--navy)}
.printOnly{display:none}
@page{size:A4 landscape;margin:8mm}
@media print{
 body{background:#fff!important;padding:0!important}
 .top,.tabs,.noprint,.wrap>.box,#gMsg,#pick{display:none!important}
 .wrap{margin:0!important;padding:0!important;max-width:none!important}
 .box.rbox{border:none;box-shadow:none;padding:0;display:block!important}
 .printOnly{display:block!important}
 .scroll{overflow:visible!important}
 .rt{font-size:10.5px;min-width:0}.rt th{position:static}
 .stats{grid-template-columns:repeat(4,1fr)}
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:300;padding:16px}.modal.on{display:flex}
</style>
<script src="config.js"></script><script src="ui.js"></script></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
 <div class="box noprint" id="pickBox"><div class="title">Fee Reports</div><div class="meta">Choose a report. You can print it or download it for Excel.</div><div class="grid" id="cards" style="margin-top:10px"></div></div>
 <div class="box" id="fBox" style="display:none"><div class="title" id="fTitle"></div><div class="meta" id="fDesc"></div><div id="fForm"></div>
  <div class="btnrow"><button class="btn b-blue" id="runBtn" onclick="run()">Show report</button><button class="btn b-grey" onclick="closeReport()">Choose another report</button></div></div>
 <div class="msg" id="gMsg"></div>
 <div id="pick"></div>
 <div class="box rbox" id="rBox" style="display:none">
  <div class="printOnly" id="pHead" style="text-align:center;margin-bottom:8px"></div>
  <div class="title" id="rTitle"></div><div class="meta" id="rSub"></div><div class="meta" id="rGen"></div>
  <div class="stats" id="rSum"></div><div id="rTables"></div><div class="help" id="rNote"></div>
  <div class="btnrow noprint"><button class="btn b-navy" onclick="window.print()">🖨 Print</button><button class="btn b-green" onclick="csv()">⬇ Download CSV</button></div>
 </div>
</div>
<div class="tabs" id="tabsBar"><button class="tabBtn" onclick="window.location.href='fees-collect.html'"><span class="tabIco">💵</span>Collect</button><button class="tabBtn" onclick="window.location.href='fees-receipts.html'"><span class="tabIco">🧾</span>Receipts</button><button class="tabBtn active"><span class="tabIco">📊</span>Reports</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html?tab=last' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();

var M = null, DEF = null, OUT = null, BUSY = false, ICON = {DAILY:'💵', RECEIPTS:'🧾', HEADWISE:'🧩', CLASSDUES:'🏫', DEFAULTERS:'⏰', CONCESSIONS:'🎁', LEDGER:'📒', ALLDATA:'📦'};
function pad2(n){ return String(n).padStart(2, '0'); }
function ddmm(d){ return pad2(d.getDate()) + '-' + pad2(d.getMonth() + 1) + '-' + d.getFullYear(); }
function todayDate(){ let a = M.today.split('-'); return new Date(+a[2], +a[1] - 1, +a[0]); }
function money(n, dec){ n = Number(n) || 0; return n.toLocaleString('en-IN', {minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function rs(n){ return '₹' + money(n, OUT ? OUT.decimals : 0); }

async function init(){
  show($('gMsg'), 'Loading reports... please wait', 'load');
  try{
    let r = await apiGet('feereports', {});
    if(!r.success){ show($('gMsg'), r.code === 'ROLE' ? '❌ You do not have permission to open fee reports. Ask the admin to tick "Fee reports" for you in Users.' : '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    M = r; hide($('gMsg'));
    $('cards').innerHTML = r.reports.map(x => '<div class="go" onclick="openReport(\'' + x.key + '\')"><div class="ic">' + (ICON[x.key] || '📄') + '</div>' + esc(x.title) + '<small>' + esc(x.desc) + '</small></div>').join('');
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check internet and try again.', 'err'); }
}
function opts(list, all, allLabel){ return (all ? '<option value="">' + allLabel + '</option>' : '') + list.map(x => '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>').join(''); }
function openReport(key){
  DEF = M.reports.find(x => x.key === key); OUT = null;
  $('pickBox').style.display = 'none'; $('fBox').style.display = ''; $('rBox').style.display = 'none'; $('pick').innerHTML = ''; hide($('gMsg'));
  $('fTitle').innerText = DEF.title; $('fDesc').innerText = DEF.desc;
  let f = DEF.filters, h = '';
  if(f.indexOf('session') > -1) h += '<label>Session</label><select id="f_session">' + M.sessions.map(s => '<option' + (s === M.session ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>';
  if(f.indexOf('range') > -1){
    h += '<div class="chips"><button class="chip" onclick="quick(\'today\')">Today</button><button class="chip" onclick="quick(\'yday\')">Yesterday</button><button class="chip" onclick="quick(\'week\')">Last 7 days</button><button class="chip" onclick="quick(\'month\')">This month</button></div>';
    h += '<div class="row2"><div><label>From</label><input id="f_from" inputmode="numeric" maxlength="10" oninput="maskD(this)" placeholder="DD-MM-YYYY" value="' + esc(M.today) + '"></div><div><label>To</label><input id="f_to" inputmode="numeric" maxlength="10" oninput="maskD(this)" placeholder="DD-MM-YYYY" value="' + esc(M.today) + '"></div></div>';
  }
  if(f.indexOf('cls') > -1) h += '<label>Class</label><select id="f_class">' + opts(M.classes.map(c => [c, 'Class ' + c]), true, 'All classes') + '</select>';
  if(f.indexOf('mode') > -1) h += '<label>Payment mode</label><select id="f_mode">' + opts(M.modes.map(c => [c, c]), true, 'All modes') + '</select>';
  if(f.indexOf('user') > -1) h += '<label>Received by</label><select id="f_user">' + opts(M.users.map(u => [u.username, u.name]), true, 'Everyone') + '</select>';
  if(f.indexOf('status') > -1) h += '<label>Receipts</label><select id="f_status"><option value="ALL">All (including cancelled)</option><option value="ACTIVE">Active only</option><option value="CANCELLED">Cancelled only</option></select>';
  if(f.indexOf('minDays') > -1) h += '<div class="row2"><div><label>Overdue at least (days)</label><input id="f_minDays" inputmode="numeric" placeholder="0" value="0"></div><div><label>Overdue at least (₹)</label><input id="f_minAmount" inputmode="numeric" placeholder="0" value="0"></div></div>';
  if(f.indexOf('sort') > -1) h += '<label>Sort by</label><select id="f_sort"><option value="class">Class and roll no</option><option value="amount">Biggest amount first</option><option value="days">Longest overdue first</option></select>';
  if(f.indexOf('student') > -1) h += '<label>Student (name or admission no)</label><input id="f_q" placeholder="Type a name or admission no" onkeydown="if(event.key===\'Enter\')run()"><div class="help">If more than one student matches, you can choose from a list.</div>';
  $('fForm').innerHTML = h;
  window.scrollTo(0, 0);
}
function quick(k){
  let t = todayDate(), a = new Date(t), b = new Date(t);
  if(k === 'yday'){ a.setDate(a.getDate() - 1); b = new Date(a); }
  else if(k === 'week'){ a.setDate(a.getDate() - 6); }
  else if(k === 'month'){ a = new Date(t.getFullYear(), t.getMonth(), 1); }
  $('f_from').value = ddmm(a); $('f_to').value = ddmm(b);
}
function closeReport(){ DEF = null; OUT = null; $('fBox').style.display = 'none'; $('rBox').style.display = 'none'; $('pickBox').style.display = ''; $('pick').innerHTML = ''; hide($('gMsg')); }
function params(adm){
  let p = {report:DEF.key};
  ['session', 'from', 'to', 'class', 'mode', 'user', 'status', 'minDays', 'minAmount', 'sort', 'q'].forEach(k => { let e = $('f_' + k); if(e && e.value.trim() !== '') p[k] = e.value.trim(); });
  if(adm) p.adm = adm;
  return p;
}
async function run(adm){
  if(BUSY) return; BUSY = true; $('runBtn').disabled = true; $('pick').innerHTML = ''; $('rBox').style.display = 'none';
  show($('gMsg'), 'Preparing the report... please wait', 'load');
  try{
    let r = await apiGet('feereport', params(adm));
    if(!r.success){ show($('gMsg'), '❌ ' + (r.code === 'ROLE' ? 'You do not have permission for this report.' : (r.error || 'Could not prepare the report.')), 'err'); }
    else if(r.choose){
      hide($('gMsg'));
      $('pick').innerHTML = '<div class="box"><div class="title">Choose the student</div>' + r.choose.map(s => '<button class="pick" onclick="run(\'' + esc(s.adm) + '\')"><b>' + esc(s.name) + '</b><br><small>Class ' + esc(s.cls) + (s.roll ? ' · Roll ' + esc(s.roll) : '') + ' · Adm ' + esc(s.adm) + '</small></button>').join('') + (r.more ? '<div class="help">Showing the first 30. Type more of the name to narrow it down.</div>' : '') + '</div>';
    }
    else{ OUT = r; hide($('gMsg')); draw(); }
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check internet and try again.', 'err'); }
  BUSY = false; $('runBtn').disabled = false;
}
function cell(v, type, dec){
  if(type === 'money') return money(v, dec);
  if(type === 'int') return String(v === '' || v === null ? '' : Number(v));
  return esc(v);
}
function tableHtml(t, dec){
  let big = t.big && t.rows.length > 30, rows = big ? t.rows.slice(0, 30) : t.rows;
  let h = '<div class="tt2">' + esc(t.title) + '</div><div class="scroll"><table class="rt"><thead><tr>' + t.columns.map(c => '<th' + (c.type === 'money' || c.type === 'int' ? ' class="n"' : '') + '>' + esc(c.label) + '</th>').join('') + '</tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="' + t.columns.length + '" style="text-align:center;color:#64748b;font-weight:700;padding:16px">Nothing to show.</td></tr>';
  rows.forEach(r => { h += '<tr>' + r.map((v, i) => '<td' + (t.columns[i].type === 'money' || t.columns[i].type === 'int' ? ' class="n"' : '') + '>' + cell(v, t.columns[i].type, dec) + '</td>').join('') + '</tr>'; });
  if(t.foot && t.rows.length) h += '<tr class="tot">' + t.foot.map((v, i) => '<td' + (t.columns[i].type === 'money' || t.columns[i].type === 'int' ? ' class="n"' : '') + '>' + (v === '' ? '' : cell(v, t.columns[i].type, dec)) + '</td>').join('') + '</tr>';
  h += '</tbody></table></div>';
  if(big) h += '<div class="help">Showing the first 30 of ' + t.rows.length + ' rows. Tap "Download CSV" to get all rows for Excel.</div>';
  return h;
}
function draw(){
  let r = OUT, s = M.school;
  $('pHead').innerHTML = '<b style="font-size:16px">' + esc(s.name) + '</b><br><span style="font-size:11px">' + esc(s.address) + (s.phone ? ' · ' + esc(s.phone) : '') + '</span>';
  $('rTitle').innerText = r.title; $('rSub').innerText = r.subtitle || ''; $('rGen').innerText = 'Prepared on ' + r.generated + (USER.name ? ' by ' + USER.name : '');
  $('rSum').innerHTML = r.summary.map(x => '<div class="stat"><b>' + (x.type === 'money' ? rs(x.value) : esc(x.value)) + '</b><span>' + esc(x.label) + '</span></div>').join('');
  $('rTables').innerHTML = r.tables.map(t => tableHtml(t, r.decimals)).join('');
  $('rNote').innerText = r.note || '';
  $('rBox').style.display = ''; window.scrollTo({top:$('rBox').offsetTop - 70, behavior:'smooth'});
}
function csvCell(v){ let s = String(v === null || v === undefined ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csv(){
  if(!OUT) return;
  let lines = [csvCell(M.school.name), csvCell(OUT.title + (OUT.subtitle ? ' - ' + OUT.subtitle : '')), csvCell('Prepared on ' + OUT.generated), ''];
  OUT.summary.forEach(x => lines.push(csvCell(x.label) + ',' + csvCell(x.value)));
  if(OUT.summary.length) lines.push('');
  OUT.tables.forEach(t => {
    lines.push(csvCell(t.title)); lines.push(t.columns.map(c => csvCell(c.label)).join(','));
    t.rows.forEach(r => lines.push(r.map(csvCell).join(',')));
    if(t.foot && t.rows.length) lines.push(t.foot.map(csvCell).join(','));
    lines.push('');
  });
  let blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'fees-' + OUT.key.toLowerCase() + '-' + M.today + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  show($('gMsg'), '✅ The CSV file was downloaded.', 'ok'); setTimeout(() => hide($('gMsg')), 3000);
}
init();
</script>
