<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student Portal</title>
<meta name="theme-color" content="#0b2a5c">
<link rel="manifest" href="manifest-student.webmanifest">
<link rel="icon" href="icons/student-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="rc-card.css">
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b;--frame:#1a4bb5;--cream:#fdf6d0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:760px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-grey{background:#e5e7eb;color:#475569}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}
.lock{background:#fff7ed;border:1px solid #ffcc80;border-radius:16px;padding:18px;text-align:center;color:#9a3412;font-weight:700;line-height:1.5}
.lock b{display:block;font-size:30px;margin-bottom:6px}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.school{display:flex;gap:12px;align-items:center}
.school img{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.school b{font-size:16px;color:var(--navy)}
.drow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:none}.drow span{color:var(--muted);font-weight:700}.drow b{text-align:right}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:#fff;border-radius:16px;border:1px solid #eef0f3;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:14px 10px;text-align:center;font-weight:800;color:var(--navy);cursor:pointer;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:4px solid var(--blue)}
.go .ic{font-size:28px}.go small{font-size:11px;color:var(--muted);font-weight:700}
.go.closed{opacity:.6;border-left-color:#f59e0b}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex-shrink:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:13px;color:var(--navy);background:#fff;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:5px solid var(--blue);margin-bottom:10px}
.item h4{margin:0 0 6px;color:var(--navy);font-size:15px;display:flex;justify-content:space-between;gap:8px}
.item h4 small{color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap}
.line{font-size:13.5px;line-height:1.5;margin:3px 0}.line span{color:var(--muted);font-weight:700}
.hw{background:#fff7ed;border-left:3px solid var(--orange);padding:6px 8px;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--navy)}.stat span{font-size:10.5px;color:var(--muted);font-weight:700}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fee2e2;color:#991b1b}.dchip.l{background:#fff3e0;color:#9a3412}.dchip.u{background:#ede9fe;color:#5b21b6}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#e0f2fe;color:#075985}.tag.up{background:#fff3e0;color:#9a3412}
.score{font-size:22px;font-weight:900;color:var(--navy)}.score small{font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .card{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.1);border-top:5px solid var(--navy)}
#login h1{margin:8px 0 2px;font-size:20px;color:var(--navy);text-align:center}
#login .sch{text-align:center;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:8px}
#login img{display:block;margin:0 auto;max-width:90px;max-height:90px;border-radius:12px}
.pwr{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;color:#64748b;font-size:11px;font-weight:700}.pwr img,#login .pwr img{height:26px;width:auto;max-width:none;max-height:none;margin:0;border-radius:0;display:block}
#fit{padding:0}
@media print{
  body{background:#fff;padding:0}
  body>.top,body>.tabs,.noprint,#screens>.scr:not(#s_result),#resList,#resMsg,#cardBar{display:none!important}
  .wrap{margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>

<div id="login" style="display:none">
  <div class="card">
    <img id="lgLogo" alt="" style="display:none">
    <h1>Student Portal</h1>
    <div class="sch" id="lgSchool"></div>
    <label>Admission Number</label><input id="lgAdm" inputmode="text" autocomplete="username" placeholder="e.g. 1001">
    <label>Date of Birth (DD-MM-YYYY)</label><input id="lgDob" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="e.g. 03-10-2019" oninput="maskDob(this)" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="msg" id="lgMsg"></div>
    <div class="btnrow"><button class="btn b-navy" id="btnLogin" onclick="doLogin()">🔐 Login</button></div>
    <p class="meta" style="text-align:center;margin-top:12px">Forgot something? Please contact the school office.</p><div class="pwr"><span>Powered by</span><img src="icons/digit-logo.png" alt="DiGit Software Consultancy"></div>
  </div>
</div>

<div id="app" style="display:none">
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">S</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">-</div></div>
  </div>
  <div class="top-right">
    <div class="badge">STUDENT</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="wrap" id="screens">
  <div class="msg" id="gMsg"></div>

  <div class="scr" id="s_home">
    <div class="box"><div class="school"><img id="hLogo" alt="" style="display:none"><div><b id="hSchool">-</b><div class="meta" id="hSession"></div></div></div></div>
    <div class="box"><div class="title">👤 My Details</div><div id="hDetails"></div></div>
    <div class="grid" id="hGo"></div><div class="pwr"><span>Powered by</span><img src="icons/digit-logo.png" alt="DiGit Software Consultancy"></div>
  </div>

  <div class="scr" id="s_daily" style="display:none"><div id="dBody"></div></div>
  <div class="scr" id="s_attendance" style="display:none"><div id="aBody"></div></div>
  <div class="scr" id="s_tests" style="display:none"><div id="tBody"></div></div>

  <div class="scr" id="s_result" style="display:none">
    <div id="resList"></div>
    <div class="msg" id="resMsg"></div>
    <div id="cardBar" class="noprint" style="display:none">
      <div class="btnrow"><button class="btn b-green" onclick="window.print()">🖨️ Print / Save as PDF</button><button class="btn b-grey" onclick="backToList()">⬅️ Back to results</button></div>
    </div>
    <div id="fit"></div>
  </div>
</div>

<div class="tabs" id="tabsBar">
  <button class="tabBtn active" data-t="home" onclick="openTab('home')"><span class="tabIco">🏠</span>Home</button>
  <button class="tabBtn" data-t="daily" onclick="openTab('daily')"><span class="tabIco">📚</span>Daily</button>
  <button class="tabBtn" data-t="attendance" onclick="openTab('attendance')"><span class="tabIco">✅</span>Attendance</button>
  <button class="tabBtn" data-t="tests" onclick="openTab('tests')"><span class="tabIco">📝</span>Tests</button>
  <button class="tabBtn" data-t="result" onclick="openTab('result')"><span class="tabIco">🎓</span>Results</button>
</div>
</div>

<script src="rc-render.js"></script>
<script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyNYyNG5RYxe6tjztXsVbKEAkstJBNYmfwLWZvIqkPouFQsEOsovL-HPmb-KQ82_0NS/exec";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lset(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
var SKEYS = ['cvse_stoken', 'cvse_sadm', 'cvse_sname', 'cvse_sclass'];    // only the student keys are ever removed here: a teacher logged in on the same phone is not touched
function clearStudent(){ SKEYS.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} }); }
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }

async function api(action, params, post){
  let r;
  if(post) r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_stoken')}, params || {}))});
  else{
    let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_stoken'));
    for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
    r = await fetch(url);
  }
  let j = await r.json();
  if(j && j.code === 'AUTH'){ clearStudent(); showLogin('Your session has ended. Please login again.'); throw new Error('AUTH'); }
  return j;
}

/* ---------- login ---------- */
function maskDob(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
async function showLogin(note){
  $('app').style.display = 'none'; $('login').style.display = 'flex';
  if(note) show($('lgMsg'), note, 'warn');
  try{
    let s = await (await fetch(WEB_URL + '?action=getallsettings')).json();
    $('lgSchool').innerText = s.School_Name || (s.settings && s.settings.School_Name) || '';
    let logo = s['Logo Path'] || (s.settings && s.settings['Logo Path']) || '';
    if(logo){ $('lgLogo').src = logo; $('lgLogo').style.display = 'block'; }
  }catch(e){}
}
async function doLogin(){
  let adm = $('lgAdm').value.trim(), dob = $('lgDob').value.trim();
  if(!adm || !dob){ show($('lgMsg'), 'Enter the admission number and the date of birth.', 'err'); return; }
  let b = $('btnLogin'); b.disabled = true; show($('lgMsg'), 'Logging in...', 'load');
  try{
    let r = await (await fetch(WEB_URL, {method:'POST', body:JSON.stringify({action:'studentlogin', admissionNo:adm, dob:dob})})).json();
    if(!r.success){ show($('lgMsg'), '❌ ' + (r.error || 'Could not login.'), 'err'); return; }
    lset('cvse_stoken', r.token); lset('cvse_sadm', r.student.admissionNo); lset('cvse_sname', r.student.name); lset('cvse_sclass', r.student.className);
    hide($('lgMsg')); $('lgDob').value = ''; startApp();
  }catch(e){ show($('lgMsg'), '❌ Network problem. Check the internet and try again.', 'err'); }
  finally{ b.disabled = false; }
}
function doLogout(){ clearStudent(); $('lgAdm').value = ''; hide($('lgMsg')); showLogin(''); }

/* ---------- app ---------- */
var HOME = null, CUR = 'home', LOADED = {};
async function startApp(){
  $('login').style.display = 'none'; $('app').style.display = 'block';
  $('wName').innerText = 'Welcome, ' + (ls('cvse_sname') || 'Student');
  $('wSub').innerText = 'Adm No: ' + ls('cvse_sadm') + ' · Class ' + ls('cvse_sclass');
  $('avatarLetter').innerText = String(ls('cvse_sname') || 'S').trim().charAt(0).toUpperCase();
  LOADED = {}; show($('gMsg'), 'Loading...', 'load');
  try{
    let r = await api('studenthome');
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    HOME = r; hide($('gMsg')); drawHome(); openTab('home');
  }catch(e){ if(e.message !== 'AUTH') show($('gMsg'), '❌ Network problem. Check the internet and reload.', 'err'); }
}
function tabInfo(k){ return (HOME && HOME.tabs || []).find(t => t.key === k) || {open:true}; }
function drawHome(){
  $('hSchool').innerText = HOME.school.name || ''; $('hSession').innerText = HOME.school.session ? 'Session ' + HOME.school.session : '';
  if(HOME.school.logo){ $('hLogo').src = HOME.school.logo; $('hLogo').style.display = 'block'; }
  $('hDetails').innerHTML = HOME.details.map(d => '<div class="drow"><span>' + esc(d.label) + '</span><b>' + esc(d.value) + '</b></div>').join('') || '<div class="meta">No details on record.</div>';
  let ic = {daily:'📚', attendance:'✅', tests:'📝', result:'🎓'};
  $('hGo').innerHTML = HOME.tabs.map(t => '<div class="go ' + (t.open ? '' : 'closed') + '" onclick="openTab(\'' + t.key + '\')"><span class="ic">' + (ic[t.key] || '📌') + '</span>' + esc(t.label) + (t.open ? '' : '<small>🔒 Not available</small>') + '</div>').join('');
}
function openTab(k){
  CUR = k;
  document.querySelectorAll('.scr').forEach(s => s.style.display = 'none');
  $('s_' + k).style.display = '';
  document.querySelectorAll('#tabsBar .tabBtn').forEach(b => b.classList.toggle('active', b.dataset.t === k));
  window.scrollTo({top:0});
  hide($('gMsg'));
  if(k === 'daily') loadDaily(''); else if(k === 'attendance') loadAtt(''); else if(k === 'tests') loadTests(); else if(k === 'result') loadResults();
}
function lockHtml(m){ return '<div class="lock"><b>🔒</b>' + esc(m || 'This section is not available right now. Please contact the school office.') + '</div>'; }
function failHtml(retry){ return '<div class="msg show err">❌ Network problem. Please check the internet and <a href="#" onclick="' + retry + ';return false">try again</a>.</div>'; }

/* ---------- daily ---------- */
async function loadDaily(date){
  $('dBody').innerHTML = '<div class="msg show load">Loading...</div>';
  try{
    let r = await api('studentdaily', date ? {date:date} : {});
    if(!r.success){ $('dBody').innerHTML = '<div class="msg show err">❌ ' + esc(r.error || 'Could not load.') + '</div>'; return; }
    if(r.closed){ $('dBody').innerHTML = lockHtml(r.message); return; }
    if(!r.dates.length){ $('dBody').innerHTML = '<div class="empty-note">No daily update has been published yet.</div>'; return; }
    let h = '<div class="chips">' + r.dates.map(d => '<button class="chip ' + (d === r.date ? 'on' : '') + '" onclick="loadDaily(\'' + d + '\')">' + esc(d) + '</button>').join('') + '</div>';
    h += r.items.map(i => '<div class="item"><h4>' + esc(i.subject) + '<small>' + esc(i.time || ('Period ' + i.period)) + '</small></h4>' +
      (i.chapter ? '<div class="line"><span>Chapter:</span> ' + esc(i.chapter) + '</div>' : '') +
      (i.topic ? '<div class="line"><span>Topic / Activity:</span> ' + esc(i.topic) + '</div>' : '') +
      (i.homework ? '<div class="line hw"><span>Homework:</span> ' + esc(i.homework) + (i.submissionDate ? ' <b>(Submit by ' + esc(i.submissionDate) + ')</b>' : '') + '</div>' : '') +
      (i.reminder ? '<div class="line"><span>Reminder:</span> ' + esc(i.reminder) + '</div>' : '') +
      (i.comment ? '<div class="line"><span>Teacher\'s note:</span> ' + esc(i.comment) + '</div>' : '') +
      (i.teacherName ? '<div class="line" style="font-size:11.5px;color:var(--muted)">' + esc(i.teacherName) + '</div>' : '') + '</div>').join('');
    $('dBody').innerHTML = h;
  }catch(e){ if(e.message !== 'AUTH') $('dBody').innerHTML = failHtml("loadDaily('')"); }
}

/* ---------- attendance ---------- */
async function loadAtt(month){
  $('aBody').innerHTML = '<div class="msg show load">Loading...</div>';
  try{
    let r = await api('studentattendance', month ? {month:month} : {});
    if(!r.success){ $('aBody').innerHTML = '<div class="msg show err">❌ ' + esc(r.error || 'Could not load.') + '</div>'; return; }
    if(r.closed){ $('aBody').innerHTML = lockHtml(r.message); return; }
    if(!r.months.length){ $('aBody').innerHTML = '<div class="empty-note">No attendance has been recorded yet.</div>'; return; }
    let m = r.monthData, pc = v => v === null ? '-' : v + '%';
    let h = '<div class="box"><div class="title">🗓️ Whole session</div><div class="stats"><div class="stat"><b>' + r.session.workingDays + '</b><span>Days</span></div><div class="stat"><b>' + r.session.present + '</b><span>Present</span></div><div class="stat"><b>' + r.session.absent + '</b><span>Absent</span></div><div class="stat"><b>' + pc(r.session.percent) + '</b><span>Attendance</span></div></div></div>';
    h += '<div class="box"><div class="title">📅 Month</div><select onchange="loadAtt(this.value)">' + r.months.map(x => '<option value="' + esc(x.value) + '"' + (x.value === r.month ? ' selected' : '') + '>' + esc(x.label) + '</option>').join('') + '</select>' +
      '<div class="stats"><div class="stat"><b>' + m.workingDays + '</b><span>Days</span></div><div class="stat"><b>' + m.present + '</b><span>Present</span></div><div class="stat"><b>' + m.absent + '</b><span>Absent</span></div><div class="stat"><b>' + pc(m.percent) + '</b><span>Attendance</span></div></div>' +
      (m.absentDates.length ? '<div class="line"><span>Absent on</span></div><div class="dchips">' + m.absentDates.map(d => '<span class="dchip">' + esc(d) + '</span>').join('') + '</div>' : '<div class="line">🎉 No absence this month.</div>') +
      (m.lateDates.length ? '<div class="line" style="margin-top:10px"><span>Late entry on</span></div><div class="dchips">' + m.lateDates.map(d => '<span class="dchip l">' + esc(d) + '</span>').join('') + '</div>' : '') +
      (m.uniformDates.length ? '<div class="line" style="margin-top:10px"><span>Incomplete uniform on</span></div><div class="dchips">' + m.uniformDates.map(d => '<span class="dchip u">' + esc(d) + '</span>').join('') + '</div>' : '') + '</div>';
    $('aBody').innerHTML = h;
  }catch(e){ if(e.message !== 'AUTH') $('aBody').innerHTML = failHtml("loadAtt('')"); }
}

/* ---------- tests ---------- */
async function loadTests(){
  $('tBody').innerHTML = '<div class="msg show load">Loading...</div>';
  try{
    let r = await api('studenttests');
    if(!r.success){ $('tBody').innerHTML = '<div class="msg show err">❌ ' + esc(r.error || 'Could not load.') + '</div>'; return; }
    if(r.closed){ $('tBody').innerHTML = lockHtml(r.message); return; }
    if(!r.tests.length){ $('tBody').innerHTML = '<div class="empty-note">No class test yet.</div>'; return; }
    $('tBody').innerHTML = r.tests.map(t => '<div class="item" style="border-left-color:' + (t.upcoming ? '#ef6c00' : '#1976d2') + '"><h4>' + esc(t.subject) + ' · ' + esc(t.testName) + '<small>' + esc(t.date) + '</small></h4>' +
      (t.upcoming ? '<span class="tag up">Upcoming</span> <span class="meta">Full marks ' + t.maxMarks + '</span>' :
        (t.marks === '' ? '<span class="tag">Marks not entered</span>' : (String(t.marks).toUpperCase() === 'AB' ? '<span class="tag up">Absent</span>' : '<div class="score">' + esc(t.marks) + ' <small>/ ' + t.maxMarks + '</small></div>'))) +
      (t.remark ? '<div class="line"><span>Remark:</span> ' + esc(t.remark) + '</div>' : '') + '</div>').join('');
  }catch(e){ if(e.message !== 'AUTH') $('tBody').innerHTML = failHtml('loadTests()'); }
}

/* ---------- results ---------- */
async function loadResults(){
  backToList(true);
  $('resList').innerHTML = '<div class="msg show load">Loading...</div>';
  try{
    let r = await api('studentresults');
    if(!r.success){ $('resList').innerHTML = '<div class="msg show err">❌ ' + esc(r.error || 'Could not load.') + '</div>'; return; }
    if(r.closed){ $('resList').innerHTML = lockHtml(r.message); return; }
    if(!r.reports.length){ $('resList').innerHTML = '<div class="empty-note">' + esc(r.message) + '</div>'; return; }
    $('resList').innerHTML = '<div class="box"><div class="title">🎓 My Report Cards</div>' + r.reports.map(x => x.available
      ? '<div class="btnrow"><button class="btn b-navy" onclick="openCard(\'' + esc(x.reportId) + '\')">📄 ' + esc(x.name) + '</button></div>'
      : '<div class="lock" style="margin-top:10px;padding:12px"><b style="font-size:20px">🔒</b>' + esc(x.name) + '<br><span style="font-weight:600">' + esc(x.message) + '</span></div>').join('') + '</div>';
  }catch(e){ if(e.message !== 'AUTH') $('resList').innerHTML = failHtml('loadResults()'); }
}
async function openCard(id){
  show($('resMsg'), 'Opening your report card...', 'load');
  try{
    let r = await api('studentreportcard', {reportId:id});
    if(r.closed){ hide($('resMsg')); $('resList').innerHTML = lockHtml(r.message); return; }
    if(!r.success){ show($('resMsg'), '❌ ' + (r.error || 'Could not open.'), 'err'); return; }
    hide($('resMsg')); $('resList').style.display = 'none'; $('cardBar').style.display = '';
    $('fit').innerHTML = rcCardsHtml(r, r.students); rcFit($('fit'));
    window.scrollTo({top:0});
  }catch(e){ if(e.message !== 'AUTH') show($('resMsg'), '❌ Network problem. Please try again.', 'err'); }
}
function backToList(quiet){ $('fit').innerHTML = ''; $('cardBar').style.display = 'none'; $('resList').style.display = ''; if(!quiet) hide($('resMsg')); }
window.addEventListener('resize', () => { if($('fit').innerHTML) rcFit($('fit')); });
window.addEventListener('beforeprint', () => { $('fit').querySelectorAll('.cw').forEach(c => { c.style.width = ''; c.style.height = ''; }); });
window.addEventListener('afterprint', () => { if($('fit').innerHTML) rcFit($('fit')); });

/* ---------- PWA (installable app) ---------- */
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }

if(ls('cvse_stoken') && ls('cvse_sadm')) startApp(); else showLogin('');
</script>
