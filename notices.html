<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>

    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>

    <div class="title">📢 Notices</div>

    <div class="btnrow" id="writeRow" style="display:none"><button class="btn b-green" data-nofb onclick="openForm()">➕ Write a notice</button></div>
    <div class="chips" id="whichChips" style="display:none;margin-top:12px"><button class="chip on" id="chAct" onclick="loadList(0)">Showing now</button><button class="chip" id="chOld" onclick="loadList(1)">Ended / removed</button></div>
    <div class="msg" id="gMsg"></div>
  </div>

    <label for="nText">Notice</label><textarea id="nText" maxlength="2000" placeholder="Write the notice here"></textarea>

<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function goBack(){ UI.goBack(USER.role === 'admin' ? 'admin.html?tab=last' : USER.role === 'accountant' ? 'accountant.html' : 'teacher.html'); }
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'admin' ? 'ADMIN' : USER.role === 'accountant' ? 'OFFICE STAFF' : USER.role === 'classTeacher' ? 'CLASS TEACHER' : 'SUBJECT TEACHER';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();
/* S30 (stage 4): read notices; admin, Office Staff with the Notices tick and class teachers (own class) also write them */
let D = null, OLD = 0, EDIT = '', FORM_OPEN = false;
function plus7(){ let d = new Date(); d.setDate(d.getDate() + 7); return ('0' + d.getDate()).slice(-2) + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + d.getFullYear(); }
async function loadList(old){
  OLD = old ? 1 : 0; $('chAct').classList.toggle('on', !OLD); $('chOld').classList.toggle('on', !!OLD);
  $('list').innerHTML = '<div class="empty-note">⏳ Loading...</div>';
  try{
    let r = await apiGet('noticelist', OLD ? {old:1} : {});
    if(!r.success){ $('list').innerHTML = ''; show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    D = r; hide($('gMsg'));
    $('writeRow').style.display = r.writer ? '' : 'none'; $('whichChips').style.display = r.writer ? '' : 'none';
    if(r.writer === 'CT') $('topMeta').innerText = 'Notices for the students and parents of your class (' + (r.ctClasses || []).join(', ') + '), and notices for staff from the office.';
    draw();
    if(!OLD){ try{ UI.bellSeen(USER.username, r.notices.map(n => n.id)); }catch(e){} }
  }catch(e){ $('list').innerHTML = ''; show($('gMsg'), '❌ Could not connect. Check the internet and try again.', 'err'); }
}
function draw(){
  let list = D.notices || [], seen = [];
  try{ seen = JSON.parse(localStorage.getItem('cvse_keep_ntc_' + String(USER.username).toLowerCase()) || '[]') || []; }catch(e){}
  if(!list.length){ $('list').innerHTML = '<div class="empty-note">' + (OLD ? 'No ended or removed notices.' : 'No notices right now.' + (D.writer ? ' Tap "➕ Write a notice" to add one.' : '')) + '</div>'; return; }
  $('list').innerHTML = list.map(n => '<div class="box ntc' + (n.pinned && !OLD ? ' pin' : '') + (OLD ? ' old' : '') + '"><div class="title" style="font-size:15.5px">' + (n.pinned ? '📌 ' : '') + esc(n.title) +
    (!OLD && seen.indexOf(String(n.id)) < 0 ? '<span class="ntcNew">NEW</span>' : '') + '</div>' +
    '<div class="tx">' + esc(n.text).replace(/\n/g, '<br>') + '</div>' +
    '<div class="mt">For: ' + esc(n.forText) + (n.forKey !== 'STAFF' ? ' · ' + esc(n.classesText) : '') + '<br>' + (n.removed ? '🗑 Removed' : 'Shows until ' + esc(n.until)) + ' · by ' + esc(n.byName) + ' · ' + esc(n.at) + (n.edited ? ' · changed ' + esc(n.edited) : '') + '</div>' +
    (n.canEdit && !OLD ? '<div class="ibtn"><button class="btn b-blue" data-nofb onclick="openForm(\'' + esc(n.id) + '\')">✏️ Change</button><button class="btn b-red" id="rm_' + esc(n.id) + '" onclick="removeN(\'' + esc(n.id) + '\')">🗑 Remove</button></div><div class="msg" id="rmMsg_' + esc(n.id) + '"></div>' : '') +
    '</div>').join('');
}
function drawClasses(){
  let ct = D.writer === 'CT', all = $('nAll').checked, f = $('nFor').value;
  $('forBox').style.display = ct ? 'none' : '';
  $('clsBox').style.display = (!ct && f === 'STAFF') ? 'none' : '';
  $('allRow').style.display = ct ? 'none' : '';
  let classes = D.classes || [], keep = [...document.querySelectorAll('#clsList input:checked')].map(c => c.value);
  if(ct || !all){
    if(!$('clsList').dataset.done || $('clsList').dataset.done !== String(classes.length)){
      $('clsList').innerHTML = classes.map(c => '<label><input type="checkbox" value="' + esc(c) + '"' + (ct || keep.indexOf(c) > -1 ? ' checked' : '') + '> ' + esc(c) + '</label>').join('');
      $('clsList').dataset.done = String(classes.length);
    }
    $('clsList').style.display = '';
    $('clsHelp').innerText = ct ? 'Only the students of your class see it.' : 'Tick the classes. Students of the other classes do not see it.';
  } else { $('clsList').style.display = 'none'; $('clsHelp').innerText = 'Every student sees it.'; }
}
function openForm(id){
  EDIT = id || ''; let n = EDIT ? (D.notices || []).find(x => x.id === EDIT) : null;
  $('fTitle').innerText = n ? '✏️ Change the notice' : '➕ Write a notice';
  $('nTitle').value = n ? n.title : ''; $('nText').value = n ? n.text : '';
  $('nFor').value = n ? n.forKey : 'STUDENTS'; $('nUntil').value = n ? n.until : plus7(); $('nPin').checked = n ? n.pinned : false;
  $('clsList').dataset.done = ''; $('clsList').innerHTML = '';
  $('nAll').checked = !(n && n.classes && n.classes.length);
  drawClasses();
  if(n && n.classes && n.classes.length) document.querySelectorAll('#clsList input').forEach(c => c.checked = n.classes.indexOf(String(c.value).toUpperCase()) > -1);
  hide($('fMsg')); $('form').style.display = 'block'; $('list').style.display = 'none'; $('topBox').style.display = 'none';
  if(!FORM_OPEN){ FORM_OPEN = true; try{ UI.innerOpen(function(){ closeForm(true); }); }catch(e){} }
  window.scrollTo(0, 0); $('nTitle').focus();
}
function closeForm(fromBack){
  $('form').style.display = 'none'; $('list').style.display = ''; $('topBox').style.display = '';
  if(FORM_OPEN){ FORM_OPEN = false; if(!fromBack){ try{ UI.innerClosed(); }catch(e){} } }
}
async function save(){
  let m = $('fMsg'), b = $('saveBtn'), ct = D.writer === 'CT';
  let title = $('nTitle').value.trim(), text = $('nText').value.trim(), until = $('nUntil').value.trim(), f = $('nFor').value;
  if(!title){ show(m, '❌ Please type a title.', 'err'); return; }
  if(!text){ show(m, '❌ Please type the notice text.', 'err'); return; }
  if(!UI.dateOk(until)){ show(m, '❌ Please choose the "Show until" date (DD-MM-YYYY).', 'err'); return; }
  let classes = (ct || ($('nAll').checked === false && f !== 'STAFF')) ? [...document.querySelectorAll('#clsList input:checked')].map(c => c.value) : [];
  if((ct || (!$('nAll').checked && f !== 'STAFF')) && !classes.length){ show(m, '❌ Tick at least one class (or tick "Whole school").', 'err'); return; }
  b.disabled = true; b.textContent = '⏳ Saving...'; show(m, 'Saving... please wait', 'load');
  try{
    let r = await apiPost('noticesave', {id:EDIT, title:title, text:text, 'for':ct ? 'STUDENTS' : f, classes:classes.join(','), until:until, pin:$('nPin').checked ? 'YES' : 'NO'});
    if(r.success){ try{ UI.bellSeen(USER.username, [r.id]); }catch(e){} b.textContent = '✅ Saved'; show(m, '✅ ' + (r.message || 'Saved.'), 'ok'); setTimeout(function(){ closeForm(); b.disabled = false; b.textContent = '💾 Save notice'; loadList(0); }, 900); return; }
    show(m, '❌ ' + (r.error || 'Could not save.'), 'err');
  }catch(e){ show(m, '❌ Could not connect. Nothing was saved. Try again.', 'err'); }
  b.disabled = false; b.textContent = '💾 Save notice';
}
async function removeN(id){
  let n = (D.notices || []).find(x => x.id === id); if(!n) return;
  if(!(await UI.ask('Remove the notice "' + n.title + '"? Nobody will see it any more (it stays in the sheet).', 'Remove'))) return;
  let b = $('rm_' + id), m = $('rmMsg_' + id);
  b.disabled = true; b.textContent = '⏳ Removing...'; show(m, 'Removing... please wait', 'load');
  try{
    let r = await apiPost('noticeremove', {id:id});
    if(r.success){ b.textContent = '✅ Removed'; show(m, '✅ ' + (r.message || 'Removed.'), 'ok'); setTimeout(function(){ loadList(0); }, 900); return; }
    show(m, '❌ ' + (r.error || 'Could not remove.'), 'err');
  }catch(e){ show(m, '❌ Could not connect. Nothing was changed. Try again.', 'err'); }
  b.disabled = false; b.textContent = '🗑 Remove';
}
loadList(0);
</script>
</body></html>
