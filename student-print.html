<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.26-S27">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student print</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#eef2f7;margin:0;color:#111;padding-bottom:96px}
.bar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .btn{padding:10px 14px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}
.bar .btn.g{background:linear-gradient(135deg,#16a34a,#22c55e)}.bar .btn.p{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.bar .btn.on{outline:3px solid #ef6c00}
.msg{margin:12px;padding:12px;border-radius:12px;font-weight:700;background:#e0f2fe;color:#075985}.msg.err{background:#fee2e2;color:#991b1b}
.page{background:#fff;width:210mm;min-height:297mm;margin:12px auto;padding:10mm 12mm;box-shadow:0 4px 18px rgba(0,0,0,.1);font-size:12px;position:relative}
@media(max-width:820px){.page{width:auto;min-height:0;margin:10px;padding:12px}}
.hdi{border-bottom:2px solid #0b2a5c;padding-bottom:6px;margin-bottom:6px}.hdi img{display:block;width:100%;max-height:120px;object-fit:contain}
.hd{display:flex;gap:10px;align-items:center;border-bottom:2px solid #0b2a5c;padding-bottom:6px;margin-bottom:6px}
.hd img{width:54px;height:54px;object-fit:contain}
.hd b{font-size:18px;color:#0b2a5c;display:block}.hd span{font-size:11px;color:#333}
h1{text-align:center;font-size:17px;margin:4px 0 8px;font-weight:700;letter-spacing:.3px}
.topb{display:flex;gap:10px;align-items:flex-start}.topb>.lft{flex:1;min-width:0}
.photo{width:30mm;height:38mm;flex-shrink:0;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666;text-align:center;background:#fff;margin-top:5px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.fr{display:flex;gap:8px;align-items:flex-end;margin:5px 0}
.fr .l{white-space:nowrap;font-size:11.5px}
.fr .v{flex:1;border:1px solid #444;min-height:21px;padding:2px 6px;font-size:12px;font-weight:700;line-height:1.35}

.grp{display:flex;gap:8px;margin:5px 0}.grp .l0{width:40mm;font-size:11px;line-height:1.75}
.grp .bx{flex:1;border:1px solid #444;padding:3px 6px}
.ln{display:flex;gap:6px;font-size:11px;line-height:1.75;border-bottom:1px dotted #999}.ln:last-child{border-bottom:none}.ln span{min-width:34mm;color:#333}.ln b{flex:1;font-size:11.5px}
.sig{display:flex;justify-content:space-between;margin-top:22px;font-size:11px}.sig div{border-top:1px solid #333;padding-top:3px;width:30%;text-align:center}
.ph2 h3{font-size:13px;color:#0b2a5c;margin:10px 0 3px;border-bottom:1.5px solid #0b2a5c;padding-bottom:2px}
table.pt{width:100%;border-collapse:collapse;font-size:11.5px}table.pt td{border:1px solid #bbb;padding:3px 6px;vertical-align:top}table.pt td.k{width:19%;color:#333;background:#f6f7f9;font-size:10.5px}table.pt td{width:31%}
.foot{font-size:10px;color:#555;margin-top:8px;text-align:right}
/* S27 (R9): the registration form fills the whole A4 page (rows spread evenly, a little taller) and leaves room to sign */
.page.reg{display:flex;flex-direction:column;justify-content:space-between}
.page.reg>*{margin-top:0}   /* in a column the gaps add up (no margin collapsing) – keep the old row spacing, the free space is shared out */
.page.reg .sig{margin-top:12mm}
@media print{
  .page.reg{box-sizing:border-box}   /* the 10 mm edge stays free on paper */
  .page.reg .ln,.page.reg .grp .l0{line-height:1.8}
  @page{size:A4;margin:0}
  body{background:#fff;padding:0}
  .bar,.msg{display:none!important}
  .page{margin:0;box-shadow:none;width:210mm;min-height:0;height:297mm;overflow:hidden;page-break-after:always}
  .page.ph2{height:auto;overflow:visible}
}
</style><script src="config.js"></script><script src="ui.js"></script></head>
<body>
<div class="bar" id="bar">
  <button class="btn g" id="bPrint" onclick="window.print()">🖨️ Print</button>
  <button class="btn p" id="bForm" onclick="setType('form')">Registration form</button>
  <button class="btn p" id="bProf" onclick="setType('profile')">Student profile</button>
  <button class="btn" onclick="history.length>1?history.back():window.close()">⬅️ Back</button>
</div>
<div class="msg" id="msg">Loading... please wait</div>
<div id="out"></div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || "";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
if(!ls('cvse_token') || (ls('cvse_role') !== 'admin' && ls('cvse_role') !== 'accountant')){ window.location.href = 'index.html'; }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json();
  if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
  return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
var Q = new URLSearchParams(location.search), ADM = Q.get('adm') || '', BLANK = Q.get('blank') === '1' || !ADM, TYPE = Q.get('type') === 'profile' && !BLANK ? 'profile' : 'form';
var S = {}, D = null, R = {};
var STATUS_LABEL = {ACTIVE:'Active', LEFT:'Left (TC)', DROPOUT:'Drop out', PASSEDOUT:'Passed out'};
if(BLANK){ $('bProf').style.display = 'none'; }
function setType(t){ TYPE = t; draw(); }
function gv(m){ for(var i = 1; i < arguments.length; i++){ var v = m[arguments[i]]; if(v !== undefined && String(v).trim() !== '') return String(v).trim(); } return ''; }
async function load(){
  try{
    let [s, r] = await Promise.all([apiGet('getfullsettings', {}), apiGet('mrget', ADM && !BLANK ? {adm:ADM} : {})]);
    let m = (s && (s.settings || s.map)) || {};
    S = {name:gv(m, 'School_Name', 'School Name', 'SCHOOL_NAME'), address:gv(m, 'School_Address', 'School Address', 'SCHOOL_ADDRESS'), phone:gv(m, 'School_Phone', 'School Phone', 'Phone'), logo:gv(m, 'Logo Path', 'Logo_Path', 'LogoPath'), printHeader:gv(m, 'Print Header Path')};     // S15: print header image
    if(!r.success){ $('msg').className = 'msg err'; $('msg').innerText = '❌ ' + (r.error || 'Could not load.'); return; }
    D = r; R = BLANK ? {} : (r.record || {}); UI.printDates(m.Date_Style);   // S22
    $('msg').style.display = 'none'; draw();
    if(!BLANK && r.photo && r.photo.has) loadPhoto();                      // S17: the student's photo in the photo box
  }catch(e){ $('msg').className = 'msg err'; $('msg').innerText = '❌ Could not connect. Check internet and try again.'; }
}
function v(k){ return esc(R[k] || ''); }
function head(){
  // S15: print header image (Settings → School info); if it cannot be shown, the logo + name header comes back
  if(S.printHeader) return '<div class="hdi"><img src="'+esc(S.printHeader)+'" alt="" onerror="this.parentNode.style.display=\'none\';this.parentNode.nextSibling.style.display=\'flex\'"></div>'+txtHead().replace('<div class="hd">','<div class="hd" style="display:none">');
  return txtHead();
}
function txtHead(){
  return '<div class="hd">'+(S.logo?'<img src="'+esc(S.logo)+'" alt="" onerror="this.style.display=\'none\'">':'')+'<div><b>'+esc(S.name || 'School')+'</b><span>'+esc(S.address)+(S.phone?' · Phone '+esc(S.phone):'')+'</span></div></div>';
}
function fr(label, val, cls){ return '<div class="fr'+(cls?' '+cls:'')+'"><span class="l">'+label+'</span><span class="v">'+val+'</span></div>'; }
function frs(list, cls){ return '<div class="fr'+(cls?' '+cls:'')+'">' + list.map(x=>'<span class="l">'+x[0]+'</span><span class="v">'+x[1]+'</span>').join('') + '</div>'; }
function person(title, p, rel){
  return '<div class="fr"><span class="l">'+title+'</span><span class="v">'+v(p+'Name')+(rel && R[p+'Relation'] ? ' ('+v(p+'Relation')+')' : '')+'</span></div>'+
    '<div class="grp"><div class="l0"></div><div class="bx">'+
    '<div class="ln"><span>A) Educational level</span><b>'+v(p+'Education')+'</b></div>'+
    '<div class="ln"><span>B) Occupation</span><b>'+v(p+'Occupation')+'</b></div>'+
    '<div class="ln"><span>C) Department</span><b>'+v(p+'Department')+'</b></div>'+
    '<div class="ln"><span>D) Contact no</span><b>'+v(p+'Mobile')+'</b></div></div></div>';
}
function form(){
  let corr = R.SameAddress === 'YES' ? 'Same as permanent' : v('CorrespondenceAddress');
  let tc = R.TCBrought ? (R.TCBrought === 'YES' ? 'Yes' : 'No') : '';
  return '<div class="page reg">' + head() + '<h1>Student’s Registration Form</h1><div class="topb"><div class="lft">' +
    fr('Admission No. (Office use only)', v('AdmissionNo')) + fr('Full Name', v('Name')) + fr('Phone No.', v('Phone')) + fr('Date of Birth', v('DOB')) +
    frs([['Category', v('Category')], ['Community', v('Community')]]) + '</div>'+phHtml()+'</div>' +
    frs([['Religion', v('Religion')], ['Gender', v('Gender')], ['Blood group', v('BloodGroup')]]) +
    fr('Identity Mark', v('IdentityMark')) + fr('Disability (if any)', v('Disability')) +
    frs([['Aadhaar', BLANK ? '' : esc(R.Aadhaar || '')], ['Mother tongue', v('MotherTongue')]]) +
    person('Father', 'Father') + person('Mother', 'Mother') + person('Guardian', 'Guardian', true) +
    fr('Permanent Address', v('PermanentAddress')) + fr('Correspondence Address', corr) +
    frs([['Class Applied for', v('ClassApplied') || (BLANK ? '' : v('Class'))], ['Year', v('AdmissionYear')]]) +
    '<div class="grp"><div class="l0">Name of Last School</div><div class="bx">'+
      '<div class="ln"><span>School</span><b>'+v('PrevSchool')+'</b></div><div class="ln"><span>Class</span><b>'+v('PrevClass')+'</b></div>'+
      '<div class="ln"><span>Result</span><b>'+v('PrevResult')+'</b></div><div class="ln"><span>TC brought</span><b>'+tc+'</b></div></div></div>' +
    frs([['Email', v('Email')], ['Location', v('Location')]]) + fr('TC Date', v('TCDate')) + fr('Remarks', v('Remarks')) +
    '<div class="sig"><div>Signature of parent / guardian</div><div>Date</div><div>Signature of the office</div></div>' +
    (BLANK ? '' : '<div class="foot">Printed '+new Date().toLocaleDateString('en-GB').replace(/\//g,'-')+'</div>') + '</div>';
}
function profile(){
  let rows = (sec)=>D.meta.fields.filter(f=>f.section===sec && f.type!=='history' && f.key!=='SameAddress').map(f=>{
    let x = R[f.key] || '';
    if(f.key==='Status') x = STATUS_LABEL[R.StatusShow] || R.StatusShow || '';
    if(f.key==='CorrespondenceAddress' && R.SameAddress==='YES') x = 'Same as permanent';
    if(f.type==='yesno') x = x==='YES'?'Yes':(x==='NO'?'No':'');
    if(f.type==='stype') x = x==='NEW'?'New':(x==='OLD'?'Old':'');
    return '<td class="k">'+esc(f.label)+'</td><td>'+esc(x)+'</td>';
  }).reduce((a,c,i,arr)=>a+(i%2===0?'<tr>'+c+(i+1<arr.length?'':'<td class="k"></td><td></td>')+(i+1<arr.length?'':'</tr>'):c+'</tr>'),'');
  let h = '<div class="page ph2">' + head() + '<h1>Student Profile</h1><div class="topb"><div class="lft" style="font-size:13px;line-height:1.6"><b style="font-size:16px">'+v('Name')+'</b><br>Admission No <b>'+v('AdmissionNo')+'</b> · Class <b>'+v('Class')+'</b>'+(R.RollNo?' · Roll <b>'+v('RollNo')+'</b>':'')+'<br>Status <b>'+esc(STATUS_LABEL[R.StatusShow]||R.StatusShow||'')+'</b>'+(R.StatusDate?' since '+v('StatusDate'):'')+'</div>'+phHtml()+'</div>';
  for(let n = 1; n <= 6; n++) h += '<h3>'+n+'. '+esc(D.meta.sections[n])+'</h3><table class="pt">'+rows(n)+'</table>';
  h += '<h3>Class history</h3><div style="font-size:11.5px;line-height:1.6">'+(R.ClassHistory ? R.ClassHistory.split('; ').map(esc).join(' · ') : '—')+'</div>';
  if((D.family||[]).length) h += '<h3>Brothers and sisters</h3><div style="font-size:11.5px">'+D.family.map(x=>esc(x.name)+' ('+esc(x.adm)+', '+esc(x.cls||'-')+')').join(' · ')+'</div>';
  return h + '<div class="foot">Printed '+new Date().toLocaleDateString('en-GB').replace(/\//g,'-')+' · Aadhaar is shown masked</div></div>';
}
/* S17: photo (Print waits until it is in) */
var PH_URL = '';
function phHtml(){ return '<div class="photo">' + (PH_URL ? '<img src="' + esc(PH_URL) + '" alt="">' : 'Photo') + '</div>'; }
async function loadPhoto(){
  let b = $('bPrint'), t = b.innerHTML; b.disabled = true; b.innerHTML = '⏳ Loading photo…';
  try{
    let r = await apiGet('photoget', {adms:ADM});
    if(r.success) PH_URL = r.photos[ADM] || r.photos[String(ADM).toUpperCase()] || '';
    draw();
  }catch(e){}
  b.disabled = false; b.innerHTML = t;
}
function draw(){
  $('bForm').classList.toggle('on', TYPE === 'form'); $('bProf').classList.toggle('on', TYPE === 'profile');
  $('out').innerHTML = TYPE === 'profile' ? profile() : form();
  document.title = (TYPE === 'profile' ? 'Student profile' : 'Registration form') + (R.Name ? ' - ' + R.Name : '');
}
load();
</script>
</body></html>
