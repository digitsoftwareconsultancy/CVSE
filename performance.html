<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.09-S1">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Performance</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#fff3e0;color:#7c2d12;border:1px solid #ffcc80;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.badge-exam{color:#fff;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:700;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer}
.wrap{max-width:1000px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 10px}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;font-family:inherit;min-height:46px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-grey{background:#e5e7eb;color:#666}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:130px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:5px solid var(--green);display:flex;flex-direction:column;gap:7px;cursor:pointer}
.card.warn{border-left-color:var(--orange)}.card.bad{border-left-color:var(--red)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:800;font-size:15px}.nm small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.pill{font-size:12px;font-weight:900;padding:5px 10px;border-radius:999px;white-space:nowrap}
.g{background:#dcfce7;color:#166534}.o{background:#fff3e0;color:#9a3412}.r{background:#fee2e2;color:#991b1b}.n{background:#f1f5f9;color:#475569}
.bar{height:8px;border-radius:99px;background:#e5e7eb;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.meta{font-size:12.5px;color:#374151;line-height:1.55}.meta b{color:var(--navy)}
.note{font-size:12px;color:#374151;background:#f8fafc;border-left:3px solid var(--orange);border-radius:6px;padding:5px 8px;margin-top:3px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#fee2e2;color:#991b1b;margin-right:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:80px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--navy)}.stat span{font-size:10.5px;color:var(--muted);font-weight:700}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.info{background:#fff3e0;color:#9a3412}
.empty-note{text-align:center;color:var(--muted);padding:26px 10px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.trow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(720px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
</style>
</head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">T</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">TEACHER</div>
    <div class="badge-exam" id="examBadge" style="background:#c1272d">Exam: -</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="wrap">
  <div class="box">
    <div class="title">📊 Monthly Performance Report</div>
    <div class="row">
      <div><label>Class</label><select id="fClass"></select></div>
      <div><label>Month</label><input type="month" id="fMonth"></div>
    </div>
    <div class="btnrow">
      <button class="btn b-blue" id="btnLoad" onclick="loadReport()">🔍 Load Report</button>
      <button class="btn b-green" id="btnPrint" onclick="printReport()" style="display:none">🖨️ Print</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="box" id="statsBox" style="display:none"><div class="stats" id="stats"></div></div>
  <div class="grid" id="cards"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="title" id="mTitle">Student</div>
    <div class="meta" id="mMeta"></div>
    <div id="mBody" style="margin-top:8px"></div>
    <div class="btnrow"><button class="btn b-grey" onclick="closeModal()">Close</button></div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tabBtn active"><span class="tabIco">📈</span>Performance</button>
  <button class="tabBtn" onclick="goAtt()"><span class="tabIco">✅</span>Attendance</button>
  <button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button>
</div>

<script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyNYyNG5RYxe6tjztXsVbKEAkstJBNYmfwLWZvIqkPouFQsEOsovL-HPmb-KQ82_0NS/exec";

function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role'), classes:ls('cvse_classes'), examAccess:ls('cvse_examAccess'), isClassTeacher:ls('cvse_isClassTeacher') === 'true'};
if(!ls('cvse_token') || !USER.username){ window.location.href = 'index.html'; }
var REAL_ROLE = USER.role; if(USER.role === 'accountant') USER.role = 'admin';       // an accountant the admin allowed works like admin on this page
var IS_ADMIN = USER.role === 'admin';
var IS_CT = USER.role === 'classTeacher' || USER.isClassTeacher;
if(!IS_ADMIN && !IS_CT){ alert('The performance report is only for class teachers.'); window.location.href = 'subject-dashboard.html'; }

function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(text, kind){ let e = $('msg'); e.className = 'msg show ' + kind; e.innerText = text; }
function hide(){ $('msg').className = 'msg'; }

var DATA = null, SETTINGS = {};

async function init(){
  $('wName').innerText = 'Welcome, ' + (USER.name || USER.username);
  $('wSub').innerText = 'Username: ' + USER.username.toUpperCase();
  $('avatarLetter').innerText = String(USER.name || USER.username).trim().charAt(0).toUpperCase();
  $('roleBadge').innerText = REAL_ROLE === 'accountant' ? 'ACCOUNTANT' : (IS_ADMIN ? 'ADMIN' : 'CLASS TEACHER');
  let ex = IS_ADMIN || String(USER.examAccess).toUpperCase() === 'YES';
  $('examBadge').innerText = ex ? 'Exam: ENABLED' : 'Exam: DISABLED'; $('examBadge').style.background = ex ? '#16a34a' : '#c1272d';
  let d = new Date(); $('fMonth').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');

  let list = null;
  if(!IS_ADMIN && String(USER.classes).toUpperCase().trim() !== 'ALL') list = String(USER.classes).split(/[,;|]+/).map(c => c.trim().toUpperCase()).filter(Boolean);
  if(list === null){ try{ let r = await apiGet('getallclasses'); list = r.classes || []; }catch(e){ list = []; } }
  $('fClass').innerHTML = list.length ? list.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('') : '<option value="">No class assigned</option>';
  try{ let s = await apiGet('getfullsettings'); SETTINGS = s.settings || s.map || {}; }catch(e){}
  if(list.length) loadReport();
  else show('No class is assigned to you. Ask admin to set your Class in the Teachers tab.', 'err');
}

function goBack(){ window.location.href = REAL_ROLE === 'accountant' ? 'accountant.html' : (IS_ADMIN ? 'admin.html' : 'class-dashboard.html'); }
function goAtt(){ window.location.href = 'daily.html?tab=att'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }

async function loadReport(){
  let cls = $('fClass').value, month = $('fMonth').value;
  if(!cls){ show('Choose a class', 'err'); return; }
  if(!month){ show('Choose a month', 'err'); return; }
  show('Loading ' + cls + ' - ' + month + '...', 'load'); $('cards').innerHTML = ''; $('statsBox').style.display = 'none'; $('btnPrint').style.display = 'none';
  let b = $('btnLoad'); b.disabled = true;
  try{
    let r = await apiGet('getmonthlyreport', {className:cls, month:month});
    if(!r.success){ show(r.error || 'Could not load', 'err'); return; }
    DATA = r;
    if(!r.students.length){ show('No data found. No students in class ' + cls + '.', 'err'); return; }
    if(r.note) show(r.note, 'info'); else hide();
    render();
  }catch(e){ show('Network problem. Check internet and tap Load Report.', 'err'); }
  finally{ b.disabled = false; }
}

function shortDate(d){ let p = String(d).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : d; }
function attClass(s){ return s.attPercent >= 75 ? 'g' : (s.attPercent >= 60 ? 'o' : 'r'); }
function render(){
  let r = DATA, sm = r.summary;
  $('statsBox').style.display = 'block'; $('btnPrint').style.display = 'block';
  $('stats').innerHTML = `<div class="stat"><b>${sm.students}</b><span>Students</span></div><div class="stat"><b>${sm.workingDays}</b><span>Working days</span></div><div class="stat"><b>${sm.tests}</b><span>Class tests</span></div><div class="stat"><b style="color:${sm.lowAttendance ? '#c62828' : '#16a34a'}">${sm.lowAttendance}</b><span>Low attendance</span></div>`;
  $('cards').innerHTML = r.students.map((s, i) => {
    let ac = r.workingDays ? attClass(s) : 'n';
    let border = !r.workingDays ? '' : (s.attPercent < 60 ? 'bad' : (s.attPercent < 75 ? 'warn' : ''));
    let chips = s.remark !== '-' ? s.remark.split(', ').map(x => `<span class="chip">${esc(x)}</span>`).join('') : '';
    return `<div class="card ${border}" onclick="openStudent(${i})">
      <div class="ch"><div class="nm">${esc(s.name)}<small>Roll ${esc(s.rollNo || '-')} · Adm ${esc(s.admissionNo)}</small></div><span class="pill ${ac}">${r.workingDays ? s.attPercent + '%' : '-'}</span></div>
      <div class="bar"><i style="width:${r.workingDays ? s.attPercent : 0}%"></i></div>
      <div class="meta"><b>Present</b> ${s.present}/${s.total} · <b>Absent</b> ${s.absent} · <b>Late</b> ${s.late} · <b>Uniform</b> ${s.uniform}</div>
      <div class="meta"><b>Tests</b> ${s.testCount} · <b>Marks</b> ${s.totalObt}/${s.totalMax} · <b>Avg</b> ${s.testCount ? s.avgPercent + '%' : '-'}</div>
      ${chips ? '<div>' + chips + '</div>' : ''}
      ${s.notes.map(n => `<div class="note">📝 <b>${esc(shortDate(n.date))}</b> ${esc(n.text)}</div>`).join('')}
    </div>`;
  }).join('');
}

function openStudent(i){
  let s = DATA.students[i];
  $('mTitle').innerText = s.name;
  $('mMeta').innerText = 'Roll ' + (s.rollNo || '-') + ' · Class ' + DATA.className + ' · ' + DATA.month;
  let notes = s.notes.length ? '<div class="title" style="font-size:14px;margin-top:6px">Remarks</div>' + s.notes.map(n => `<div class="trow"><span><b>${esc(n.date)}</b><br><small style="color:#64748b">${n.kind === 'test' ? 'Class test' : 'Attendance'}</small></span><span style="text-align:right">${esc(n.text)}</span></div>`).join('') : '';
  let body = notes + (s.tests.length ? '<div class="title" style="font-size:14px;margin-top:10px">Class tests</div>' : '') + (s.tests.length
    ? s.tests.map(t => `<div class="trow"><span><b>${esc(t.subject)}</b> — ${esc(t.testName)}<br><small style="color:#64748b">${esc(t.date)}</small></span><span style="font-weight:800">${t.marks === 'AB' ? 'AB' : esc(t.marks) + ' / ' + esc(t.maxMarks)}</span></div>`).join('')
    : (s.notes.length ? '' : '<div class="empty-note">No data found. No class test marks or remarks this month.</div>'));
  $('mBody').innerHTML = body;
  $('modal').classList.add('show');
}
function closeModal(){ $('modal').classList.remove('show'); }

/* ---------- print (school details from Settings, black borders, page numbers) ---------- */
function printReport(){
  if(!DATA){ return; }
  let r = DATA;
  let monthText = r.month;
  try{ monthText = new Date(r.month + '-01T00:00:00').toLocaleString('en-GB', {month:'long', year:'numeric'}); }catch(e){}
  let school = SETTINGS.School_Name || '', addr = SETTINGS.School_Address || '', sess = SETTINGS.Academic_Session || '';
  let rows = r.students.map(s => `<tr><td>${esc(s.rollNo)}</td><td>${esc(s.admissionNo)}</td><td style="text-align:left">${esc(s.name)}</td><td>${s.total}</td><td>${s.present}</td><td>${s.absent}</td><td>${s.late}</td><td>${s.uniform}</td><td>${r.workingDays ? s.attPercent + '%' : '-'}</td><td>${s.testCount}</td><td>${s.totalObt} / ${s.totalMax}</td><td>${s.testCount ? s.avgPercent + '%' : '-'}</td><td style="text-align:left">${esc(s.remark !== '-' ? s.remark : '')}${s.notes.map(n => (s.remark !== '-' || s.notes[0] !== n ? '<br>' : '') + esc(shortDate(n.date)) + ': ' + esc(n.text)).join('') || (s.remark === '-' ? '-' : '')}</td></tr>`).join('');
  let css = '@page{size:A4 landscape;margin:12mm 10mm 16mm 10mm}body{font-family:Arial;margin:0}.h{text-align:center;line-height:1.4}.h .s{font-size:18px;font-weight:900}.h .t{font-size:14px;font-weight:800}.h .a{font-size:10px}.h .c{font-size:12px;font-weight:600;margin-top:4px}hr{border:0;border-top:1.5px solid #000;margin:8px 0}' +
    'table{width:100%;border-collapse:collapse}th,td{border:1px solid #000;padding:5px 4px;font-size:11px;text-align:center}td:last-child{width:26%}th{background:#000;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}thead{display:table-header-group}tr{page-break-inside:avoid}' +
    '.foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px}.foot:after{content:"Page " counter(page)}';
  let html = `<html><head><title>Monthly Performance</title><style>${css}</style></head><body>
    <div class="h"><div class="s">${esc(school)}</div><div class="a">${esc(addr)}</div><div class="t">Monthly Performance Report</div>
    <div class="c">Class: ${esc(r.className)} | Month: ${esc(monthText)} | Working Days: ${r.workingDays} | Class Tests: ${r.summary.tests}${sess ? ' | Session: ' + esc(sess) : ''}</div><hr></div>
    <table><thead><tr><th>Roll</th><th>AdmNo</th><th>Name</th><th>Total</th><th>Present</th><th>Absent</th><th>Late</th><th>Uniform</th><th>Att %</th><th>Tests</th><th>Obt / Max</th><th>Avg %</th><th>Remark</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot"></div><script>setTimeout(function(){window.print()},400)<\/script></body></html>`;
  let w = window.open('', '_blank');
  if(!w){ show('Allow pop-ups to print', 'err'); return; }
  w.document.write(html); w.document.close();
}

init();
</script>
</body></html>
