<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.21-S23">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Staff profiles</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:760px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
label .req{color:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
textarea{min-height:70px}
input:disabled,select:disabled,textarea:disabled,input[readonly]{background:#f1f5f9;color:#334155}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-orange{background:linear-gradient(135deg,#ef6c00,#fb8c00)}.b-grey{background:#e5e7eb;color:#475569}.b-red{background:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45;white-space:pre-line}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}.msg.info{background:#e0f2fe;color:#075985}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--blue);margin-bottom:10px;overflow:hidden}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;cursor:pointer;min-height:56px;font-weight:800;color:var(--navy);font-size:15px}
.sech small{font-weight:700;color:var(--muted);font-size:11.5px}
.secb{padding:0 14px 14px;display:none}.sec.open .secb{display:block}.sec.open .arr{transform:rotate(90deg)}
.arr{transition:transform .2s;font-size:14px;color:var(--muted)}
h4.g{margin:16px 0 0;color:var(--purple);font-size:13.5px;border-bottom:2px solid var(--line);padding-bottom:3px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap;display:inline-block}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fee2e2;color:#991b1b}.pill.grey{background:#e5e7eb;color:#374151}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--navy);min-height:40px}.chk input{width:24px;height:24px;min-height:0;flex-shrink:0}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.fam{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13.5px}
.res{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.res .btn{width:auto;min-width:90px}
.hist{font-size:13px;line-height:1.6;background:#f8fafc;border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1;min-height:46px}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
@media print{body>.top,body>.tabs{display:none!important}}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex-shrink:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:13px;color:var(--navy);background:#fff;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.who{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f3;cursor:pointer;min-height:56px}
.who:last-child{border-bottom:none}.who .nm{font-weight:800;color:var(--text);font-size:14.5px}.who .mt{font-size:12px;color:var(--muted)}
.who .r{margin-left:auto;text-align:right;flex-shrink:0}
.pf-ph{width:90px;height:120px;border-radius:12px;background:#f1f5f9;border:1px solid #e5e7eb;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11px;font-weight:700;text-align:center}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.fl{border-top:1px solid #eef0f3;padding:12px 0}.fl:first-child{border-top:none}
.fl .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800;color:var(--navy);font-size:13px;margin-bottom:6px}
.cur{font-size:14.5px;white-space:pre-line;word-break:break-word}.cur.none{color:#94a3b8}
.new{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14.5px;white-space:pre-line;word-break:break-word}
.dec{display:flex;gap:6px;margin-top:8px}.dec label{flex:1;margin:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #cbd5e1;border-radius:10px;min-height:44px;font-size:13px;cursor:pointer;background:#fff}
.dec input{width:20px;height:20px;min-height:0}.dec label.ok{border-color:#16a34a;background:#dcfce7}.dec label.no{border-color:#c62828;background:#fee2e2}
.lk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#075985;margin:6px 0 0;min-height:36px}.lk input{width:20px;height:20px;min-height:0}
.sgv{min-height:50px;border:1.5px dashed #cbd5e1;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff;color:#64748b;font-weight:700;font-size:12px;padding:4px;margin:4px 0}.sgv img{max-width:100%;max-height:80px}
</style><script src="config.js"></script><script src="ui.js"></script><script src="photo.js"></script></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">STAFF</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
  <div class="msg" id="gMsg"></div>
  <div id="main"><div class="empty-note">⏳ Loading...</div></div>
</div>
<div class="tabs"><button class="tabBtn active" onclick="toList()"><span class="tabIco">👥</span>Staff</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || "";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} try{ sessionStorage.setItem('cvse_flash', JSON.stringify({m:'Session expired. Please login again.', t:Date.now()})); }catch(e){} window.location.href = 'index.html'; } return j; }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); return authCheck(await r.json());
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  return authCheck(await r.json());
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('avatarLetter').innerText = String(USER.name || USER.username || 'U').trim().charAt(0).toUpperCase();
if(!ls('cvse_token') || USER.role !== 'admin'){ window.location.href = 'index.html'; }
$('roleBadge').innerText = 'ADMIN';
var ROLE = {admin:'Admin', accountant:'Accountant', classTeacher:'Class teacher', subjectTeacher:'Subject teacher'};
var LIST = null, ONE = null, FILTER = 'wait';
function goBack(){ window.location.href = 'admin.html?tab=last'; }
function toList(){ ONE = null; loadList(); }
async function loadList(){
  $('main').innerHTML = '<div class="empty-note">⏳ Loading...</div>';
  var j; try{ j = await apiGet('staffprofiles'); }catch(e){ $('main').innerHTML = '<div class="msg show err">❌ Could not connect. Check the internet.</div>'; return; }
  if(!j || !j.success){ $('main').innerHTML = '<div class="msg show err">❌ ' + esc((j && j.error) || 'Could not load.') + '</div>'; return; }
  LIST = j.staff; if(!j.waiting && FILTER === 'wait') FILTER = 'all'; drawList();
}
function drawList(){
  var w = LIST.filter(function(x){ return x.waiting; }).length;
  var list = LIST.filter(function(x){ return FILTER === 'all' || (FILTER === 'wait' ? x.waiting : x.done < x.total); });
  var h = '<div class="box"><div class="title">👥 Staff profiles</div><div class="meta">Teachers fill their own empty details in their Profile and send them here. Accept or do not accept each one (with a reason). Accepted details are locked for them. You can also fill or correct any detail yourself.</div></div>' +
    '<div class="chips"><button class="chip' + (FILTER === 'wait' ? ' on' : '') + '" onclick="FILTER=\'wait\';drawList()">Waiting (' + w + ')</button><button class="chip' + (FILTER === 'gap' ? ' on' : '') + '" onclick="FILTER=\'gap\';drawList()">Not complete</button><button class="chip' + (FILTER === 'all' ? ' on' : '') + '" onclick="FILTER=\'all\';drawList()">All (' + LIST.length + ')</button></div>';
  h += '<div class="box" style="padding:4px 14px">' + (list.length ? list.map(function(x){
    return '<div class="who" onclick="openOne(\'' + esc(x.username) + '\')"><div class="avatar" style="width:40px;height:40px;font-size:16px">' + esc(x.name.charAt(0).toUpperCase()) + '</div><div style="min-width:0"><div class="nm">' + esc(x.name) + (x.status === 'Inactive' ? ' <span class="pill grey">Inactive</span>' : '') + '</div><div class="mt">' + esc(ROLE[x.role] || x.role) + ' · ' + esc(x.username) + '</div></div>' +
      '<div class="r">' + (x.waiting ? '<span class="pill warn">' + x.waiting + ' waiting</span>' : '') + '<div class="mt">' + x.done + ' of ' + x.total + ' accepted</div></div></div>';
  }).join('') : '<div class="empty-note">' + (FILTER === 'wait' ? '✔ Nothing is waiting.' : 'Nobody here.') + '</div>') + '</div>';
  $('main').innerHTML = h;
}
async function openOne(u){
  $('main').innerHTML = '<div class="empty-note">⏳ Loading...</div>'; window.scrollTo(0, 0);
  var j; try{ j = await apiGet('staffprofile', {username:u}); }catch(e){ $('main').innerHTML = '<div class="msg show err">❌ Could not connect.</div>'; return; }
  if(!j || !j.success){ $('main').innerHTML = '<div class="msg show err">❌ ' + esc((j && j.error) || 'Could not load.') + '</div>'; return; }
  ONE = j; drawOne(); photos();
}
function stTxt(f){ return {LOCKED:'<span class="pill ok">🔒 Accepted</span>', WAITING:'<span class="pill warn">⏳ Waiting</span>', REFUSED:'<span class="pill bad">✖ Not accepted</span>', EMPTY:'<span class="pill grey">Not filled</span>', OPEN:'<span class="pill">🔓 Unlocked</span>'}[f.state]; }
function drawOne(){
  var u = ONE.user, fs = ONE.fields, w = fs.filter(function(f){ return f.state === 'WAITING'; });
  var h = '<div class="box" style="border-left-color:var(--blue)"><div class="title">' + esc(u.name) + '</div><div class="meta">' + esc(ROLE[u.role] || u.role) + ' · ' + esc(u.username) + (u.classes && u.role === 'classTeacher' ? ' · Class ' + esc(u.classes) : '') +
    (ONE.updatedAt ? '<br>Last change ' + esc(ONE.updatedAt) + ' by ' + esc(ONE.updatedBy) : '') + '</div></div>';
  if(w.length){
    h += '<div class="box" style="border-left-color:var(--orange)"><div class="title">⏳ Waiting for you (' + w.length + ')</div><div class="meta">Choose for each: Accept, or Do not accept with a short reason (the teacher sees it).</div>';
    w.forEach(function(f){
      h += '<div class="fl" data-k="' + f.k + '"><div class="h"><span>' + esc(f.label) + '</span></div>' +
        (f.k === 'Photo' ? '<div style="display:flex;gap:10px"><div><div class="meta">Now</div><div class="pf-ph" id="phAcc">' + (f.value ? '⏳' : 'No<br>photo') + '</div></div><div><div class="meta">New</div><div class="pf-ph" id="phWait">⏳</div></div></div>' :
         f.k === 'Signature' ? '<div class="meta">Now</div><div class="sgv" id="sgAcc">' + (f.value ? '⏳' : 'No signature') + '</div><div class="meta">New</div><div class="sgv" id="sgWait">⏳</div>' :
          '<div class="meta">Now</div><div class="cur' + (f.value ? '' : ' none') + '">' + esc(f.value || '—') + '</div><div class="new"><b>New:</b> ' + esc(f.wait) + '</div>') +
        '<div class="dec"><label id="okL_' + f.k + '"><input type="radio" name="d_' + f.k + '" value="ok" onchange="mark(\'' + f.k + '\')"> ✔ Accept</label><label id="noL_' + f.k + '"><input type="radio" name="d_' + f.k + '" value="no" onchange="mark(\'' + f.k + '\')"> ✖ Do not accept</label></div>' +
        '<input id="why_' + f.k + '" placeholder="Reason for the teacher" maxlength="200" style="display:none;margin-top:6px"></div>';
    });
    h += '<div class="btnrow"><button class="btn b-green" type="button" onclick="acceptAll()" data-nofb>✔ Tick Accept for all</button><button class="btn b-blue" type="button" onclick="decide()">💾 Save decisions</button></div><div class="msg" id="dMsg"></div></div>';
  }
  h += '<div class="box"><div class="title">✏️ All details</div><div class="meta">What you type here is accepted and locked at once. Tick "Unlock" to let the teacher change an accepted detail.</div>';
  fs.forEach(function(f){
    if(f.k === 'Signature'){          // S23 (L4)
      h += '<div class="fl"><div class="h"><span>✍️ Signature</span>' + stTxt(f) + '</div>' + (f.state !== 'WAITING' ? '<div class="sgv" id="sgAcc2">' + (f.value ? '⏳' : 'No signature') + '</div>' : '<div class="meta">See "Waiting for you" above.</div>') +
        '<div class="btnrow"><button class="btn b-blue" type="button" data-nofb onclick="pickSign(true)">📷 Take photo</button><button class="btn b-navy" type="button" data-nofb onclick="pickSign(false)">🖼 Gallery</button></div>' +
        (f.value ? '<label class="lk"><input type="checkbox" id="ul_Signature"' + (f.open ? ' checked' : '') + '> 🔓 Unlock (teacher may send a new signature)</label>' : '') + '</div>';
      return;
    }
    if(f.k === 'Photo'){
      h += '<div class="fl"><div class="h"><span>Photo</span>' + stTxt(f) + '</div>' + (f.state !== 'WAITING' ? '<div class="pf-ph" id="phAcc2">' + (f.value ? '⏳' : 'No<br>photo') + '</div>' : '<div class="meta">See "Waiting for you" above.</div>') +
        '<div class="btnrow"><button class="btn b-blue" type="button" data-nofb onclick="pick(true)">📷 Take photo</button><button class="btn b-navy" type="button" data-nofb onclick="pick(false)">🖼 Gallery</button></div>' +
        (f.value ? '<label class="lk"><input type="checkbox" id="ul_Photo"' + (f.open ? ' checked' : '') + '> 🔓 Unlock (teacher may send a new photo)</label>' : '') + '</div>';
      return;
    }
    var id = 'a_' + f.k;
    h += '<div class="fl"><div class="h"><span>' + esc(f.label) + '</span>' + stTxt(f) + '</div>' +
      (f.note && f.state === 'REFUSED' ? '<div class="meta" style="color:#991b1b">Not accepted: ' + esc(f.note) + '</div>' : '') +
      (f.kind === 'area' ? '<textarea id="' + id + '" maxlength="' + f.max + '">' + esc(f.value) + '</textarea>' :
        '<input id="' + id + '" value="' + esc(f.value) + '"' + (f.kind === 'date' ? ' data-date inputmode="numeric" maxlength="10" placeholder="DD-MM-YYYY"' : '') + (f.kind === 'mobile' ? ' inputmode="numeric" maxlength="10"' : '') + (f.max ? ' maxlength="' + f.max + '"' : '') + '>') +
      (f.value ? '<label class="lk"><input type="checkbox" id="ul_' + f.k + '"' + (f.open ? ' checked' : '') + '> 🔓 Unlock (teacher may change it)</label>' : '') + '</div>';
  });
  h += '<div class="btnrow"><button class="btn b-navy" type="button" onclick="adminSave()">💾 Save details</button></div><div class="msg" id="aMsg"></div></div>';
  $('main').innerHTML = h;
  if(window.UI && UI.enhanceDates) UI.enhanceDates($('main'));
}
async function photos(){
  var f = ONE.fields.filter(function(x){ return x.k === 'Photo'; })[0];
  async function put(id, which){ var el = $(id); if(!el) return; try{ var j = await apiGet('staffphotoget', {username:ONE.user.username, which:which}); el.innerHTML = j && j.photo ? '<img src="' + j.photo + '" alt="Photo">' : 'No<br>photo'; }catch(e){ el.innerHTML = '–'; } }
  if(f.value){ put('phAcc', 'acc'); put('phAcc2', 'acc'); }
  if(f.wait) put('phWait', 'wait');
  var g = ONE.fields.filter(function(x){ return x.k === 'Signature'; })[0];          // S23 (L4)
  async function putS(id, which){ var el = $(id); if(!el) return; try{ var j = await apiGet('staffphotoget', {username:ONE.user.username, which:which, field:'Signature'}); el.innerHTML = j && j.photo ? '<img src="' + j.photo + '" alt="Signature">' : 'No signature'; }catch(e){ el.innerHTML = '–'; } }
  if(g && g.value){ putS('sgAcc', 'acc'); putS('sgAcc2', 'acc'); }
  if(g && g.wait) putS('sgWait', 'wait');
}
function mark(k){
  var v = (document.querySelector('input[name="d_' + k + '"]:checked') || {}).value;
  $('okL_' + k).className = v === 'ok' ? 'ok' : ''; $('noL_' + k).className = v === 'no' ? 'no' : '';
  $('why_' + k).style.display = v === 'no' ? 'block' : 'none'; if(v === 'no') $('why_' + k).focus();
}
function acceptAll(){ ONE.fields.forEach(function(f){ if(f.state !== 'WAITING') return; var r = document.querySelector('input[name="d_' + f.k + '"][value="ok"]'); if(r){ r.checked = true; mark(f.k); } }); }
function say(id, t, k){ var m = $(id); if(m){ m.className = 'msg show ' + k; m.innerText = t; } }
async function decide(){
  var dec = {}, miss = [];
  ONE.fields.forEach(function(f){
    if(f.state !== 'WAITING') return;
    var v = (document.querySelector('input[name="d_' + f.k + '"]:checked') || {}).value;
    if(!v) return;
    if(v === 'ok') dec[f.k] = {ok:true};
    else { var why = $('why_' + f.k).value.trim(); if(why.length < 3) miss.push(f.label); dec[f.k] = {ok:false, why:why}; }
  });
  if(miss.length){ say('dMsg', '❌ Write the reason for: ' + miss.join(', ') + '. Nothing was saved.', 'err'); return; }
  if(!Object.keys(dec).length){ say('dMsg', 'Choose Accept or Do not accept first.', 'warn'); return; }
  var j; try{ j = await apiPost('staffdecide', {username:ONE.user.username, decisions:JSON.stringify(dec)}); }catch(e){ say('dMsg', '❌ Could not connect. Nothing was saved.', 'err'); return; }
  if(!j || !j.success){ say('dMsg', '❌ ' + ((j && j.error) || 'Not saved.'), 'err'); return; }
  ONE = j; setTimeout(function(){ drawOne(); photos(); say('gMsg', j.message, 'ok'); window.scrollTo(0, 0); }, 800);
}
async function adminSave(){
  var data = {}, unlock = [], lock = [], bad = [];
  ONE.fields.forEach(function(f){
    var u = $('ul_' + f.k); if(u){ if(u.checked && !f.open) unlock.push(f.k); if(!u.checked && f.open) lock.push(f.k); }
    if(f.k === 'Photo' || f.k === 'Signature') return;
    var el = $('a_' + f.k); if(!el) return;
    var v = el.value.trim(); if(v === f.value) return;
    if(f.kind === 'date' && v && window.UI && !UI.checkDate(el)) bad.push(f.label);
    data[f.k] = v;
  });
  if(bad.length){ say('aMsg', '❌ Please correct: ' + bad.join(', ') + ' (DD-MM-YYYY). Nothing was saved.', 'err'); return; }
  if(!Object.keys(data).length && !unlock.length && !lock.length){ say('aMsg', 'Nothing changed.', 'warn'); return; }
  var j; try{ j = await apiPost('staffadminsave', {username:ONE.user.username, data:JSON.stringify(data), unlock:JSON.stringify(unlock), lock:JSON.stringify(lock)}); }catch(e){ say('aMsg', '❌ Could not connect. Nothing was saved.', 'err'); return; }
  if(!j || !j.success){ say('aMsg', '❌ ' + ((j && j.error) || 'Not saved.'), 'err'); return; }
  ONE = j; setTimeout(function(){ drawOne(); photos(); say('gMsg', j.message, 'ok'); window.scrollTo(0, 0); }, 800);
}
async function pick(camera){
  var file = await PHOTO.choose(camera); if(!file) return;
  PHOTO.open({file:file, title:'Photo of ' + ONE.user.name, sub:'Saved and locked at once', onSave:async function(data){
    var j = await apiPost('staffadminphoto', {username:ONE.user.username, data:data});
    if(!j || !j.success) return {ok:false, msg:'❌ ' + ((j && j.error) || 'The photo was not saved.')};
    ONE = j; drawOne(); photos(); say('gMsg', j.message, 'ok'); return {ok:true};
  }});
}
async function pickSign(camera){     // S23 (L4)
  var file = await PHOTO.choose(camera); if(!file) return;
  PHOTO.open({file:file, sign:true, title:'Signature of ' + ONE.user.name, sub:'Saved and locked at once', onSave:async function(data){
    var j = await apiPost('staffadminphoto', {username:ONE.user.username, data:data, field:'Signature'});
    if(!j || !j.success) return {ok:false, msg:'❌ ' + ((j && j.error) || 'The signature was not saved.')};
    ONE = j; drawOne(); photos(); say('gMsg', j.message, 'ok'); return {ok:true};
  }});
}
var q = new URLSearchParams(location.search).get('u');
if(q) openOne(q); else loadList();
