<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }

/* ---------- Excel (.xlsx made in the page: no outside service) ---------- */
const CRC = (() => { let t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

}
function xe(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ''); }
function colL(i){ let s = ''; i++; while(i){ let m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

    {name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ' + NS + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + xe(SHEET) + '" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet ' + NS + '><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1" applyNumberFormat="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    {name:'xl/worksheets/sheet1.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ' + NS + '><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + sd + '</sheetData></worksheet>'}
  ]);
}
/* S33b: UDISE+ Excel (route udiseget) + APAAR to-do list (route apaarlist) – 40_Udise.gs */
let U = null, AP = null, SHEET = 'UDISE+';
function udPart(p){   // not 'part': inside onclick that name is the button's own .part property
 $('chUd').classList.toggle('on', p === 'ud'); $('chAp').classList.toggle('on', p === 'ap'); $('pUd').style.display = p === 'ud' ? '' : 'none'; $('pAp').style.display = p === 'ap' ? '' : 'none'; }
async function init(){
  try{
    let r = await apiGet('udiseget', {});
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not open.'), 'err'); $('uCls').innerHTML = '<option value="">—</option>'; return; }
    let o = r.classes.map(c => '<option>' + esc(c) + '</option>').join('');
    $('uCls').innerHTML = o + '<option value="ALL">All classes (one Excel)</option>'; $('aCls').innerHTML = '<option value="ALL">All classes</option>' + o;
    $('fullRow').style.display = r.canFull ? '' : 'none';
    if(!r.udise) show($('gMsg'), '⚠️ The UDISE code of the school is empty. Admin: Settings → School info → UDISE code (11 digits).', 'warn');
    if(new URLSearchParams(location.search).get('p') === 'apaar') udPart('ap');
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check the internet and try again.', 'err'); }
}
async function loadUd(){
  let b = $('bUd'), m = $('uMsg'), c = $('uCls').value; if(!c){ show(m, '❌ Choose a class.', 'err'); return; }
  b.disabled = true; show(m, 'Preparing the UDISE+ rows... please wait', 'load'); $('udOut').innerHTML = '';
  try{
    let r = await apiGet('udiseget', {cls:c, aadhaar:$('uFull').checked ? 1 : 0}); b.disabled = false;
    if(!r.success){ show(m, '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    hide(m); U = r;
    if(!r.rows.length){ $('udOut').innerHTML = '<div class="empty-note">No active pupils in ' + esc(r.cls) + '.</div>'; return; }
    let ix = h => r.columns.findIndex(x => x.h === h), iA = ix('4.2.1 Admission Number'), iN = ix('4.1.1 Name of the Student'), iR = ix('Section Roll No.'), iG = ix('Grade/Class'), iS = ix('Section'), iM = r.columns.length - 1;
    $('udOut').innerHTML = '<div class="box" style="border-left-color:var(--green)"><div class="title">' + (r.cls === 'ALL' ? 'All classes' : 'Class ' + esc(r.cls)) + ' · ' + esc(r.year) + '</div>' +
      '<div class="big"><div><b>' + r.rows.length + '</b><span>pupils</span></div><div><b style="color:' + (r.incomplete ? '#c2410c' : '#166534') + '">' + r.incomplete + '</b><span>with something missing</span></div></div>' +
      (r.warning ? '<div class="msg show warn">⚠️ ' + esc(r.warning) + '</div>' : '') +
      '<div class="btnrow"><button class="btn b-green" id="bX" data-nofb onclick="dlUd()">⬇ Download Excel (' + r.columns.length + ' columns)</button></div>' +
      '<div class="meta" style="margin-top:6px">Aadhaar: ' + (r.full ? '<b>full numbers</b> (written in the log)' : 'masked') + '. Fill what is missing in the student record (section 7), then download again. Facility and year-end details are filled on the portal.</div>' +
      '<table class="tbl"><tr><th>Roll</th><th>Pupil</th><th>Missing</th></tr>' + r.rows.map(x => '<tr><td>' + esc(x[iR]) + '</td><td>' + esc(x[iN]) + '<br><small style="color:#64748b">' + esc(x[iG]) + '-' + esc(x[iS]) + ' · Adm ' + esc(x[iA]) + '</small></td>' +
        (x[iM] ? '<td class="ms">' + esc(x[iM]) + '</td>' : '<td class="okc">✓ complete</td>') + '</tr>').join('') + '</table></div>';
  }catch(e){ b.disabled = false; show(m, '❌ Could not connect. Check the internet and try again.', 'err'); }
}
function dl(blob, name){ let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
function dlUd(){
  if(!U) return; SHEET = 'UDISE+ ' + U.year;
  let b = $('bX'), old = b.textContent;
  try{
    dl(xlsx(U.columns.map(c => c.h), U.rows.map(r => r.map((v, i) => i === 0 ? v : String(v === null || v === undefined ? '' : v))), U.columns.map(c => c.w)), ('UDISE_' + (U.udise || 'school') + '_' + U.cls + '_' + U.year).replace(/[^A-Za-z0-9_-]+/g, '_') + '.xlsx');
    b.textContent = '✅ Downloaded'; setTimeout(() => { b.textContent = old; }, 2000);
  }catch(e){ b.textContent = '❌ Could not make the file'; setTimeout(() => { b.textContent = old; }, 2500); }
}
async function loadAp(){
  let b = $('bAp'), m = $('aMsg'); b.disabled = true; show(m, 'Loading... please wait', 'load'); $('apOut').innerHTML = '';
  try{
    let r = await apiGet('apaarlist', {cls:$('aCls').value}); b.disabled = false;
    if(!r.success){ show(m, '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    hide(m); AP = r;
    let h = '<div class="box" style="border-left-color:var(--purple)"><div class="title">APAAR · ' + (r.cls === 'ALL' ? 'all classes' : 'class ' + esc(r.cls)) + '</div>' +
      '<div class="big"><div><b>' + r.done + ' / ' + r.total + '</b><span>have an APAAR ID</span></div><div><b style="color:' + (r.list.length ? '#c2410c' : '#166534') + '">' + r.list.length + '</b><span>still to do</span></div></div>' +
      (r.list.length ? '<div class="btnrow noprint"><button class="btn b-navy" data-nofb onclick="window.print()">🖨 Print</button><button class="btn b-green" id="bAX" data-nofb onclick="dlAp()">⬇ Excel</button></div>' : '<div class="msg show ok">✅ Every pupil here has an APAAR ID.</div>') + '</div>';
    r.groups.forEach(g => {
      let l = r.list.filter(x => x.group === g.key); if(!l.length) return;
      h += '<div class="grp ' + g.key + '"><h4><span>' + esc(g.title) + '</span><span class="pill">' + l.length + '</span></h4><div class="meta">' + esc(g.help) + '</div>' +
        l.map(x => '<div class="who"><a href="student-record.html?adm=' + encodeURIComponent(x.adm) + '">' + esc(x.name) + '</a><small>Class ' + esc(x.cls) + (x.roll ? ' · Roll ' + esc(x.roll) : '') + ' · Adm ' + esc(x.adm) + (x.pen ? ' · PEN ' + esc(x.pen) : '') + (x.mobile ? ' · 📞 ' + esc(x.mobile) : '') + '</small></div>').join('') + '</div>';
    });
    $('apOut').innerHTML = h;
  }catch(e){ b.disabled = false; show(m, '❌ Could not connect. Check the internet and try again.', 'err'); }
}
function dlAp(){
  if(!AP) return; SHEET = 'APAAR to do';
  let t = {}; AP.groups.forEach(g => t[g.key] = g.title);
  dl(xlsx(['Class', 'Roll', 'Admission no', 'Name', 'PEN', 'Consent', 'Consent date', 'Mobile', 'What is missing'], AP.list.map(x => [x.cls, x.roll, x.adm, x.name, x.pen, x.consent, x.consentDate, x.mobile, t[x.group]]), [10, 7, 14, 26, 14, 9, 12, 13, 36]),
    ('APAAR_to_do_' + AP.cls).replace(/[^A-Za-z0-9_-]+/g, '_') + '.xlsx');
}
init();
</script>
