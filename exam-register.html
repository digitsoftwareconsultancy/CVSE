<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.17-S22">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Exam Register</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:1180px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
label .req{color:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
textarea{min-height:70px}
input:disabled,select:disabled,textarea:disabled,input[readonly]{background:#f1f5f9;color:#334155}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-orange{background:linear-gradient(135deg,#ef6c00,#fb8c00)}.b-grey{background:#e5e7eb;color:#475569}.b-red{background:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45;white-space:pre-line}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}.msg.info{background:#e0f2fe;color:#075985}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--blue);margin-bottom:10px;overflow:hidden}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;cursor:pointer;min-height:56px;font-weight:800;color:var(--navy);font-size:15px}
.sech small{font-weight:700;color:var(--muted);font-size:11.5px}
.secb{padding:0 14px 14px;display:none}.sec.open .secb{display:block}.sec.open .arr{transform:rotate(90deg)}
.arr{transition:transform .2s;font-size:14px;color:var(--muted)}
h4.g{margin:16px 0 0;color:var(--purple);font-size:13.5px;border-bottom:2px solid var(--line);padding-bottom:3px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap;display:inline-block}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fee2e2;color:#991b1b}.pill.grey{background:#e5e7eb;color:#374151}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--navy);min-height:40px}.chk input{width:24px;height:24px;min-height:0;flex-shrink:0}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.fam{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13.5px}
.res{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.res .btn{width:auto;min-width:90px}
.hist{font-size:13px;line-height:1.6;background:#f8fafc;border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1;min-height:46px}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
@media print{body>.top,body>.tabs{display:none!important}}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0}
.chip{flex-shrink:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 14px;min-height:40px;font-weight:700;font-size:13px;color:var(--navy);background:#fff;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sumg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.sumg div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.sumg b{display:block;font-size:18px;color:var(--navy)}.sumg span{font-size:11px;color:var(--muted);font-weight:700}
.scroll{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
#reg{font-family:Arial,Helvetica,sans-serif;color:#000;min-width:1000px}
#reg .ph{text-align:center;margin-bottom:4px}#reg .ph img{display:block;width:100%;max-height:30mm;object-fit:contain}
#reg .phs b{font-size:15pt}#reg .phs div{font-size:9pt}
#reg h1{font-size:13pt;text-align:center;margin:3px 0 1px;letter-spacing:1px}#reg .fl{text-align:center;font-size:8pt;margin-bottom:4px}
#reg table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.5pt;line-height:1.2}
#reg th,#reg td{border:0.6pt solid #444;padding:1mm 0.8mm;text-align:center;vertical-align:middle;overflow-wrap:break-word}
#reg th{background:#e8edf5;font-size:7pt}#reg th.v{height:24mm}#reg th.v span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block}
#reg td.nm{text-align:left}#reg td.ex{font-weight:700;background:#f5f7fb}
#reg .t{font-weight:700;font-size:8pt;display:block}#reg .s{font-size:6pt;color:#555;display:block}
#reg td.thin{text-align:left;font-size:6.8pt;background:#fbfbfd;padding:0.8mm 1.2mm}
#reg thead{display:table-header-group}#reg tbody.st{break-inside:avoid;page-break-inside:avoid}
#reg .sum{margin-top:4mm;font-size:8pt;break-inside:avoid}#reg .sum table{font-size:7.5pt}
#reg .sign{display:flex;justify-content:space-between;margin-top:14mm;font-size:9pt;break-inside:avoid}#reg .sign div{border-top:0.6pt solid #000;padding-top:1mm;width:55mm;text-align:center}
@media print{body{background:#fff;padding:0}body>*:not(.wrap){display:none!important}.wrap{max-width:none;margin:0;padding:0}.wrap>*:not(#regBox){display:none!important}
 #regBox{border:none;box-shadow:none;padding:0;margin:0}#regBox>*:not(.scroll){display:none!important}.scroll{border:none;padding:0;overflow:visible}#reg{min-width:0}
 th{-webkit-print-color-adjust:exact;print-color-adjust:exact}td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style><script src="config.js"></script><script src="ui.js"></script></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Exam Register</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">STAFF</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
  <div class="msg" id="gMsg"></div>
  <div class="box" id="pickBox">
    <div class="title">📒 Exam Register</div>
    <div class="meta">The marks of a whole class, with the same numbers as the report cards.</div>
    <div class="row2"><div><label for="selClass">Class</label><select id="selClass" onchange="fillReports()"></select></div>
      <div><label for="selRep">Report</label><select id="selRep" onchange="fillExams();load()"></select></div></div>
    <label>Show</label>
    <div class="chips" id="viewChips"><button class="chip on" id="vTerm" type="button" onclick="setView('TERM')">Whole term (all exams)</button><button class="chip" id="vOne" type="button" onclick="setView('ONE')">One exam</button></div>
    <div id="exWrap" style="display:none"><label for="selEx">Exam</label><select id="selEx" onchange="draw()"></select></div>
  </div>
  <div class="msg" id="warn"></div>
  <div class="box" id="sumBox" style="display:none;border-left-color:var(--green)"><div class="title">📊 Class summary</div><div class="sumg" id="sumG"></div></div>
  <div class="box" id="regBox" style="display:none;border-left-color:var(--purple)">
    <div class="btnrow" style="margin-top:0"><button class="btn b-green" id="bPrint" type="button" data-nofb onclick="doPrint()">🖨 Print (A4 landscape)</button><button class="btn b-navy" id="bXlsx" type="button" data-nofb onclick="doExcel()" style="display:none">⬇ Excel</button></div>
    <div class="msg" id="pMsg"></div>
    <div class="scroll"><div id="reg"></div></div>
  </div>
</div>
<div class="tabs"><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button><button class="tabBtn active"><span class="tabIco">📒</span>Exam Register</button></div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || "";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} try{ sessionStorage.setItem('cvse_flash', JSON.stringify({m:'Session expired. Please login again.', t:Date.now()})); }catch(e){} window.location.href = 'index.html'; } return j; }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); return authCheck(await r.json());
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, t, k){ el.className = 'msg show ' + k; el.innerText = t; }
function hide(el){ el.className = 'msg'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html?tab=last' : (USER.role === 'accountant' ? 'accountant.html' : 'teacher.html'); }
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('avatarLetter').innerText = String(USER.name || USER.username || 'U').trim().charAt(0).toUpperCase();
$('roleBadge').innerText = USER.role === 'admin' ? 'ADMIN' : (USER.role === 'accountant' ? 'ACCOUNTANT' : 'CLASS TEACHER');
var O = null, D = null, VIEW = 'TERM';
async function boot(){
  show($('gMsg'), 'Loading...', 'load');
  let r; try{ r = await apiGet('examregget', {}); }catch(e){ show($('gMsg'), '❌ Could not connect. Check the internet and open the page again.', 'err'); return; }
  if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); $('pickBox').style.display = 'none'; return; }
  O = r; hide($('gMsg'));
  if(!r.classes.length || !r.reports.length){ show($('gMsg'), 'No report is set up for your classes yet (Exam Settings → Reports).', 'warn'); $('pickBox').style.display = 'none'; return; }
  let withRep = r.classes.filter(c => r.reports.some(x => x.classes.indexOf(c) > -1));
  $('selClass').innerHTML = withRep.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('');
  $('bXlsx').style.display = r.canExcel ? '' : 'none';
  fillReports();
}
function fillReports(){
  let c = $('selClass').value, reps = O.reports.filter(x => x.classes.indexOf(c) > -1);
  $('selRep').innerHTML = reps.map(x => '<option value="' + esc(x.id) + '">' + esc(x.name) + ' (' + x.exams.map(e => e.short || e.name).map(esc).join(' + ') + ')</option>').join('');
  fillExams(); load();
}
function rep(){ return O.reports.find(x => x.id === $('selRep').value) || {exams:[]}; }
function fillExams(){ $('selEx').innerHTML = rep().exams.map(e => '<option value="' + esc(e.examId) + '">' + esc(e.name || e.short) + '</option>').join(''); }
function setView(v){ VIEW = v; $('vTerm').classList.toggle('on', v === 'TERM'); $('vOne').classList.toggle('on', v === 'ONE'); $('exWrap').style.display = v === 'ONE' ? '' : 'none'; draw(); }
async function load(){
  if(!$('selClass').value || !$('selRep').value) return;
  $('regBox').style.display = 'none'; $('sumBox').style.display = 'none'; hide($('warn'));
  show($('gMsg'), 'Loading the marks of class ' + $('selClass').value + '...', 'load');
  let r; try{ r = await apiGet('examregget', {className:$('selClass').value, reportId:$('selRep').value}); }catch(e){ show($('gMsg'), '❌ Could not connect. Check the internet.', 'err'); return; }
  if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
  D = r; hide($('gMsg')); UI.printDates(r.school && r.school.dateStyle);
  if(D.report.exams.length < 2) setView('ONE'); else draw();
}
/* ---------- helpers on the engine answer ---------- */
function exList(){ return VIEW === 'ONE' ? D.report.exams.filter(e => e.examId === $('selEx').value) : D.report.exams; }
function comp(ss, exId){ return ss && !ss.notTaken && ss.exams ? (ss.exams.filter(x => x && x.examId === exId)[0] || null) : null; }
function subOf(st, sub){ return st.subjects.filter(x => x.subjectId === sub.subjectId)[0]; }
function cellHtml(ss, exId){
  if(!ss) return '';
  if(ss.notTaken) return '—';
  let c = comp(ss, exId); if(!c) return '';
  if(c.absent) return '<span class="t">AB</span>';
  if(!c.entered) return '';
  return '<span class="t">' + fmt(c.total) + '</span>' + (c.iaMax > 0 ? '<span class="s">' + fmt(c.marks || 0) + '+' + fmt(c.ia || 0) + '</span>' : '');
}
function cellText(ss, exId){ if(!ss) return ''; if(ss.notTaken) return '—'; let c = comp(ss, exId); if(!c) return ''; if(c.absent) return 'AB'; if(!c.entered) return ''; return c.iaMax > 0 ? fmt(c.marks || 0) + '+' + fmt(c.ia || 0) + '=' + fmt(c.total) : fmt(c.total); }
function fmt(n){ return n === null || n === undefined || n === '' ? '' : String(Math.round(n * 10) / 10); }
function exTotal(st, exId){
  let t = 0, m = 0, any = false;
  D.subjects.forEach(sub => { let ss = subOf(st, sub), c = comp(ss, exId); if(!c) return; m += c.max || 0; if(c.entered || c.absent){ any = true; t += c.total || 0; } });
  return any ? {t:t, m:m, p:m ? t / m * 100 : null} : null;
}
function grade(p){ if(p === null || p === undefined) return ''; let q = Math.round(p); let g = (D.gradeScale || []).filter(x => q >= x.from && q <= x.to)[0]; return g ? g.grade : ''; }
function resultOf(st){ let r = st.final && st.final.result ? st.final.result : (st.suggested && st.suggested !== 'INCOMPLETE' ? st.suggested : ''); return r; }
function thin(st){
  let ex = D.report.exams, bits = [];
  let per = list => list.filter(x => x.perExam.some(p => p.value)).map(x => esc(x.name) + ' ' + esc(x.perExam.map(p => p.value).filter(v => v).join('/'))).join(' · ');
  if((st.co || []).length && st.co.some(x => x.perExam.some(p => p.value))) bits.push('<b>Co-scholastic:</b> ' + per(st.co));
  if((st.psd || []).length && st.psd.some(x => x.perExam.some(p => p.value))) bits.push('<b>Personal / social:</b> ' + per(st.psd));
  let f = st.final || {};
  if(f.workingDays || f.presentDays){ let pc = (+f.workingDays) ? ' (' + fmt(+f.presentDays / +f.workingDays * 100) + '%)' : ''; bits.push('<b>WD</b> ' + esc(f.workingDays || '–') + ' · <b>Present</b> ' + esc(f.presentDays || '–') + pc); }
  if(f.remark) bits.push('<b>Remark:</b> ' + esc(f.remark));
  return bits.join(' &nbsp;|&nbsp; ');
}
/* ---------- draw ---------- */
function schoolHead(){
  let s = D.school || {}, txt = '<div class="phs"><b>' + esc(s.name || '') + '</b>' + (s.address ? '<div>' + esc(s.address) + '</div>' : '') + (s.affiliation ? '<div>' + esc(/^affil/i.test(s.affiliation) ? s.affiliation : 'Affiliation No: ' + s.affiliation) + '</div>' : '') + '</div>';
  return '<div class="ph">' + (s.printHeader ? '<img src="' + esc(s.printHeader) + '" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\'"><div style="display:none">' + txt + '</div>' : txt) + '</div>';
}
function draw(){
  if(!D) return;
  let exs = exList(), subs = D.subjects, one = VIEW === 'ONE', vert = subs.length > 9;
  if(!exs.length){ show($('warn'), 'Choose an exam.', 'warn'); return; }
  // missing marks warning
  let names = {}; subs.forEach(s => { names[s.subjectId] = s.name; }); let exn = {}; D.report.exams.forEach(e => { exn[e.examId] = e.short || e.name; });
  let miss = (D.progress || []).filter(p => p.entered < p.expected && exs.some(e => e.examId === p.examId) && names[p.subjectId]).map(p => names[p.subjectId] + ' ' + exn[p.examId] + ': ' + (p.expected - p.entered) + ' student' + (p.expected - p.entered === 1 ? '' : 's'));
  if(miss.length) show($('warn'), '⚠ Marks not entered yet – ' + miss.slice(0, 8).join(' · ') + (miss.length > 8 ? ' · and ' + (miss.length - 8) + ' more' : '') + '. You can still print; those boxes stay empty.', 'warn'); else hide($('warn'));
  // widths in mm (A4 landscape 281 mm)
  let fixed = one ? [8, 15, 34, 15, 11, 9, 9] : [8, 15, 34, 15, 15, 13, 22];
  let left = 281 - fixed.reduce((a, b) => a + b, 0), sw = Math.max(9, left / Math.max(1, subs.length));
  let colsMm = fixed.slice(0, one ? 3 : 4).concat(subs.map(() => sw)).concat(fixed.slice(one ? 3 : 4)), tot = colsMm.reduce((a, b) => a + b, 0);
  let colg = '<colgroup>' + colsMm.map(w => '<col style="width:' + (w * 100 / tot).toFixed(2) + '%">').join('') + '</colgroup>';
  let th = t => vert ? '<th class="v"><span>' + esc(t) + '</span></th>' : '<th>' + esc(t) + '</th>';
  let head = '<thead><tr><th>Roll</th><th>Adm No</th><th>Name</th>' + (one ? '' : '<th>Exam</th>') + subs.map(s => th(s.name)).join('') +
    (one ? '<th>Total</th><th>%</th><th>Grade</th><th>Rank</th>' : '<th>Total</th><th>% · Grade</th><th>Result</th>') + '</tr></thead>';
  let ncols = colsMm.length, body = '';
  let rows = D.students.slice();
  if(one){
    let ex = exs[0], tots = rows.map(st => exTotal(st, ex.examId)), ranked = tots.map((t, i) => [t ? t.p : null, i]).filter(x => x[0] !== null).sort((a, b) => b[0] - a[0]), rk = {};
    ranked.forEach((x, i) => { rk[x[1]] = (i && ranked[i - 1][0] === x[0]) ? rk[ranked[i - 1][1]] : i + 1; });
    rows.forEach((st, i) => { let t = tots[i];
      body += '<tbody class="st"><tr><td>' + esc(st.rollNo) + '</td><td>' + esc(st.admissionNo) + '</td><td class="nm">' + esc(st.name) + '</td>' + subs.map(s => '<td>' + cellHtml(subOf(st, s), ex.examId) + '</td>').join('') +
        '<td><span class="t">' + (t ? fmt(t.t) + '/' + fmt(t.m) : '') + '</span></td><td>' + (t && t.p !== null ? fmt(t.p) : '') + '</td><td>' + (t ? grade(t.p) : '') + '</td><td>' + (rk[i] || '') + '</td></tr></tbody>'; });
  } else {
    rows.forEach(st => {

          '<td class="ex">' + esc(e.short || e.name) + '</td>' + subs.map(s => '<td>' + cellHtml(subOf(st, s), e.examId) + '</td>').join('') +
          '<td><span class="t">' + (t ? fmt(t.t) + '/' + fmt(t.m) : '') + '</span></td>' +
          (k ? '' : '<td rowspan="' + exs.length + '"><span class="t">' + (st.pct !== null && st.pct !== undefined ? fmt(st.pct) + '%' : '') + '</span>' + esc(st.grade || '') + '</td><td rowspan="' + exs.length + '"><span class="t">' + esc(res) + '</span>' + (st.rank ? 'Rank ' + esc(st.rank) : '') + '</td>') + '</tr>';

  $('reg').innerHTML = schoolHead() + '<h1>EXAM REGISTER</h1><div class="fl">' + title + ' · printed ' + esc(D.today) + ' by ' + esc(D.by) + '</div><table>' + colg + head + body + '</table>' + sumHtml +

  let foot = ('Exam Register · ' + (D.school && D.school.name || '') + ' · Class ' + (D.classShow || D.className) + ' · ' + D.report.name).replace(/["\\]/g, '');
  st.textContent = '@page{size:A4 landscape;margin:8mm 8mm 11mm 8mm;@bottom-left{content:"' + foot + '";font:7pt Arial,Helvetica,sans-serif;color:#444}@bottom-right{content:"Page " counter(page) " of " counter(pages);font:7pt Arial,Helvetica,sans-serif;color:#444}}';
}
function summary(exs, one){
  let rows = D.students, n = rows.length, subs = D.subjects, avg = [], hi = [];
  subs.forEach(sub => {
    let ps = [];
    rows.forEach(st => { let ss = subOf(st, sub); if(!ss || ss.notTaken) return;
      if(one){ let c = comp(ss, exs[0].examId); if(c && (c.entered || c.absent) && c.max) ps.push((c.total || 0) / c.max * 100); }
      else if(ss.pct !== null && ss.pct !== undefined) ps.push(ss.pct); });
    avg.push(ps.length ? fmt(ps.reduce((a, b) => a + b, 0) / ps.length) : '–'); hi.push(ps.length ? fmt(Math.max.apply(null, ps)) : '–');
  });
  let pcts = one ? rows.map(st => exTotal(st, exs[0].examId)).filter(t => t && t.p !== null).map(t => t.p) : rows.map(st => st.pct).filter(p => p !== null && p !== undefined);
  let av = pcts.length ? fmt(pcts.reduce((a, b) => a + b, 0) / pcts.length) : '–';
  let res = {}, pass = 0, failN = 0; if(!one) rows.forEach(st => { let r = String(resultOf(st) || 'Not decided').toUpperCase(); res[r] = (res[r] || 0) + 1; if(/FAIL|DETAIN|REPEAT|NOT PROMOT/.test(r)) failN++; else if(/PASS|PROMOT/.test(r)) pass++; });
  let resTxt = Object.keys(res).map(k => k + ' ' + res[k]).join(' · ');
  let line = n + ' students' + (resTxt ? ' · ' + resTxt : '') + ' · class average ' + av + (av === '–' ? '' : '%');
  let cards = '<div><b>' + n + '</b><span>Students</span></div><div><b>' + av + (av === '–' ? '' : '%') + '</b><span>Class average</span></div>' +
    (one ? '<div><b>' + pcts.length + '</b><span>With marks</span></div><div><b>' + (n - pcts.length) + '</b><span>No marks</span></div>' :
      '<div><b>' + pass + '</b><span>Pass / promoted</span></div><div><b>' + failN + '</b><span>Fail / not promoted</span></div>');
  return {avg:avg, hi:hi, line:line, cards:cards};
}
async function doPrint(){
  let b = $('bPrint'), label = b.innerText; if(!D) return;

  await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; setTimeout(res, 4000); })));

/* ---------- Excel (.xlsx made in the page: no outside service) ---------- */
const CRC = (() => { let t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  files.forEach(f => {
    let name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    let common = [].concat(u16(20), u16(0x0800), u16(0), u16(0), u16(0x21), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    let local = new Uint8Array([].concat(u32(0x04034b50), common));
    parts.push(local, name, data);
    central.push(new Uint8Array([].concat(u32(0x02014b50), u16(20), common, u16(0), u16(0), u16(0), u32(0), u32(off))), name);
    off += local.length + name.length + data.length;
  });
  let cs = central.reduce((a, b) => a + b.length, 0);
  let end = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cs), u32(off), u16(0)));
  return new Blob(parts.concat(central, [end]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xe(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ''); }
function colL(i){ let s = ''; i++; while(i){ let m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function xlsx(heads, rows, widths){

    {name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook ' + NS + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Exam Register" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet ' + NS + '><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1" applyNumberFormat="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'},
    {name:'xl/worksheets/sheet1.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ' + NS + '><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + sd + '</sheetData></worksheet>'}
  ]);
}
function fileName(){ return ('Exam_Register_' + (D.classShow || D.className) + '_' + D.report.name + '_' + D.today).replace(/[^A-Za-z0-9_-]+/g, '_') + '.xlsx'; }
function doExcel(){
  if(!D || !O.canExcel) return;
  let exs = exList(), subs = D.subjects, one = VIEW === 'ONE', heads, rows = [];
  heads = ['Roll', 'Adm No', 'Name'].concat(one ? [] : ['Exam']).concat(subs.map(s => s.name)).concat(['Total', 'Full marks']).concat(one ? ['%', 'Grade'] : ['Overall %', 'Grade', 'Result', 'Rank', 'Working days', 'Present', 'Remark']);
