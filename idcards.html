<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.16-S18">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Print ID cards</title>
<style>

*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:760px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
label .req{color:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
textarea{min-height:70px}
input:disabled,select:disabled,textarea:disabled,input[readonly]{background:#f1f5f9;color:#334155}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-orange{background:linear-gradient(135deg,#ef6c00,#fb8c00)}.b-grey{background:#e5e7eb;color:#475569}.b-red{background:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45;white-space:pre-line}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}.msg.info{background:#e0f2fe;color:#075985}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--blue);margin-bottom:10px;overflow:hidden}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;cursor:pointer;min-height:56px;font-weight:800;color:var(--navy);font-size:15px}
.sech small{font-weight:700;color:var(--muted);font-size:11.5px}
.secb{padding:0 14px 14px;display:none}.sec.open .secb{display:block}.sec.open .arr{transform:rotate(90deg)}
.arr{transition:transform .2s;font-size:14px;color:var(--muted)}
h4.g{margin:16px 0 0;color:var(--purple);font-size:13.5px;border-bottom:2px solid var(--line);padding-bottom:3px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap;display:inline-block}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fee2e2;color:#991b1b}.pill.grey{background:#e5e7eb;color:#374151}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--navy);min-height:40px}.chk input{width:24px;height:24px;min-height:0;flex-shrink:0}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.fam{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13.5px}
.res{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.res .btn{width:auto;min-width:90px}
.hist{font-size:13px;line-height:1.6;background:#f8fafc;border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1;min-height:46px}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
@media print{body>.top,body>.tabs{display:none!important}}


.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.bar .chipb{flex:1;min-width:90px;min-height:40px;border:1px solid #cbd5e1;background:#fff;border-radius:999px;font-weight:800;font-size:12.5px;color:#334155;cursor:pointer}
.bar .chipb.on{background:#e3f2fd;border-color:#1976d2;color:#0d47a1}
.cnt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.radio{display:flex;align-items:flex-start;gap:10px;margin:8px 0;font-size:14px;font-weight:700;color:var(--navy);min-height:40px;cursor:pointer}.radio input{width:22px;height:22px;min-height:0;flex-shrink:0;margin-top:1px}
.radio small{display:block;font-weight:600;color:var(--muted);font-size:11.5px;margin-top:2px}
.cardrow{background:#fff;border:1px solid #eef0f3;border-left:4px solid var(--green);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.cardrow.miss{border-left-color:var(--orange)}.cardrow.bad{border-left-color:var(--red)}.cardrow.off{opacity:.45}
.cardrow .hd2{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cardrow .hd2 input{width:24px;height:24px;min-height:0;flex-shrink:0}
.cardrow .hd2 .nm2{font-weight:800;color:var(--navy);font-size:14px;flex:1;min-width:0}
.sides{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sides .idc{box-shadow:0 2px 10px rgba(0,0,0,.18);border-radius:3mm}
.stick{position:sticky;top:66px;z-index:20}
#print{display:none}
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body>*{display:none!important}
  body>#print{display:block!important}
  #print .pg{position:relative;overflow:hidden;page-break-after:always;break-after:page}
  #print .pg:last-child{page-break-after:auto;break-after:auto}
  #print .idc{border-radius:0!important;box-shadow:none!important;outline:none!important}
  #print .at{position:absolute}
  #print .mk{position:absolute;background:#000}
}
</style><script src="config.js"></script><script src="ui.js"></script><script src="idcard.js"></script></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="wrap">
  <div class="box" style="border-left-color:var(--navy)">
    <div class="title">🪪 Print ID cards</div>
    <div class="meta" id="designInfo">The card follows the school's ID card design.</div>
    <div id="pickClass"><label for="selClass">Class</label>
    <select id="selClass" onchange="loadClass()"><option value="">Loading classes…</option></select></div>
    <div class="msg" id="gMsg"></div>
  </div>
  <div id="main"></div>
</div>
<div id="print"></div>
<div class="tabs"><button class="tabBtn active"><span class="tabIco">🪪</span>ID cards</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} try{ sessionStorage.setItem('cvse_flash', JSON.stringify({m:'Session expired. Please login again.', t:Date.now()})); }catch(e){} window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ if(!el) return; el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ if(el) el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html?tab=last' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();


var Q = new URLSearchParams(location.search), D = null, PICS = {}, FILTER = 'ALL', MODE = 'CARD', OFF = {}, LOADING = false, LOADED = 0, TOLOAD = 0;
(function(){ var st = document.createElement('style'); st.textContent = IDCARD.css(); document.head.appendChild(st); })();
var PAGE_STYLE = document.createElement('style'); document.head.appendChild(PAGE_STYLE);

async function init(){
  show($('gMsg'), 'Loading... please wait', 'load');
  try{
    let adm = Q.get('adm');
    let r = await apiGet('idcards', adm ? {adm:adm} : {});
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); $('selClass').innerHTML = '<option value="">-</option>'; return; }
    hide($('gMsg'));
    $('selClass').innerHTML = '<option value="">Choose a class</option>' + (r.classes || []).map(c => '<option>' + esc(c) + '</option>').join('');
    if(adm){ $('pickClass').style.display = 'none'; start(r); return; }
    if(!(r.classes || []).length) show($('gMsg'), 'No classes found. The admin adds classes first.', 'warn');
    designInfo(r);
    let c = Q.get('class'); if(c && r.classes.indexOf(c) > -1){ $('selClass').value = c; loadClass(); }
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check internet and reload.', 'err'); }
}
function designInfo(r){
  let d = r.design;
  $('designInfo').innerHTML = 'Design: <b>' + (d.shape === 'P' ? 'Portrait' : 'Landscape') + '</b>, <b>' + (d.sides === '2' ? 'front + back' : 'one side') + '</b>.' +
    (r.canDesign ? ' <a href="idcard-settings.html">Change the design</a>' : ' Only the admin changes the design.');
}
async function loadClass(){
  let cls = $('selClass').value; D = null; $('main').innerHTML = ''; $('print').innerHTML = '';
  if(!cls){ hide($('gMsg')); return; }
  show($('gMsg'), 'Loading class ' + cls + '... please wait', 'load');
  try{
    let r = await apiGet('idcards', {cls:cls});
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    hide($('gMsg'));
    try{ history.replaceState(null, '', 'idcards.html?class=' + encodeURIComponent(cls)); }catch(e){}
    start(r);
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check internet and try again.', 'err'); }
}
function start(r){
  D = r; OFF = {}; FILTER = 'ALL'; MODE = r.design.printMode || 'CARD';
  designInfo(r);
  draw(); loadPics();
}
function list(){ return D.students.filter(s => FILTER === 'ALL' || (FILTER === 'PHOTO' && s.photo.has)); }
function chosen(){ return list().filter(s => !OFF[s.adm]); }
function draw(){
  if(!D) return;
  let d = D.design;
  if(!D.students.length){ $('main').innerHTML = '<div class="empty-note">No current students in class ' + esc(D.cls) + '.</div>'; return; }
  let withP = D.students.filter(s => s.photo.has).length, miss = D.students.length - withP, old = D.students.filter(s => s.photo.old).length;
  let missNames = D.students.filter(s => !s.photo.has).map(s => (s.roll ? 'Roll ' + s.roll + ' ' : '') + s.name);
  let h = '<div class="box stick"><div class="cnt"><span class="pill">' + D.students.length + (D.adm ? ' student' : ' students') + '</span><span class="pill ok">✓ ' + withP + ' with photo</span>' +
    (miss ? '<span class="pill warn">✗ ' + miss + ' without photo</span>' : '') + (old ? '<span class="pill grey">' + old + ' photo(s) from an earlier session</span>' : '') + '<span class="pill bad" id="overPill" style="display:none"></span></div>' +
    '<div class="btnrow"><button class="btn b-green" id="bPrint" data-nofb onclick="doPrint()" disabled>Loading…</button></div><div class="msg" id="pMsg"></div></div>';
  h += '<div class="box"><div class="title" style="font-size:15px">Print on</div>' +
    '<label class="radio"><input type="radio" name="pm" value="CARD"' + (MODE === 'CARD' ? ' checked' : '') + ' onchange="setMode(this.value)"><span>Card printer – one card per page<small>PVC card printer: choose paper size CR80 / ' + (d.shape === 'P' ? '54 × 86 mm portrait' : '86 × 54 mm landscape') + ' in the print window. Also for a print shop that wants one card per page (Save as PDF).' + (d.sides === '2' ? ' Each front is followed by its back (two-sided printer).' : '') + '</small></span></label>' +
    '<label class="radio"><input type="radio" name="pm" value="A4"' + (MODE === 'A4' ? ' checked' : '') + ' onchange="setMode(this.value)"><span>A4 sheet with cutting marks<small>' + (d.shape === 'P' ? '9' : '10') + ' cards on one A4 page' + (d.sides === '2' ? (d.backMode === 'BESIDE' ? ', each back beside its front' : ', backs on the next page (mirrored, for printing on both sides)') : '') + '. Choose A4, margins None, scale 100% in the print window.</small></span></label>' +
    (miss ? '<div class="msg show warn">Without a photo (' + miss + '): ' + esc(missNames.slice(0, 40).join(', ')) + (missNames.length > 40 ? ' …' : '') + (D.adm ? '' : '<br>Take them on <a href="photos.html?class=' + encodeURIComponent(D.cls || '') + '">Class photo day</a>, or print only the students with a photo.') + '</div>' : '') +
    (old ? '<div class="msg show info">' + old + ' photo(s) were taken in an earlier session – retake them on Class photo day for a fresh card.</div>' : '') +
    (D.adm ? '' : '<div class="bar">' + [['ALL','All students'],['PHOTO','Only with a photo']].map(f => '<button class="chipb' + (FILTER === f[0] ? ' on' : '') + '" data-nofb onclick="setFilter(\'' + f[0] + '\')">' + f[1] + '</button>').join('') + '</div><div class="help" style="margin-top:6px">Untick a card to leave it out (for example to reprint one lost card).</div>') + '</div>';
  let ls = list();
  if(!ls.length) h += '<div class="empty-note">No student has a photo yet.</div>';
  h += ls.map(s => '<div class="cardrow' + (s.photo.has ? '' : ' miss') + (OFF[s.adm] ? ' off' : '') + '" id="cr_' + esc(s.adm) + '"><div class="hd2">' +
    (D.adm ? '' : '<input type="checkbox" aria-label="Print the card of ' + esc(s.name) + '"' + (OFF[s.adm] ? '' : ' checked') + ' onchange="tick(\'' + esc(s.adm) + '\', this.checked)">') +
    '<div class="nm2">' + esc(s.roll ? 'Roll ' + s.roll + ' – ' : '') + esc(s.name) + '<div class="sm" style="font-size:11.5px;color:var(--muted);font-weight:700">Adm ' + esc(s.adm) + '</div></div>' +
    (s.photo.has ? (s.photo.old ? '<span class="pill grey">photo from ' + esc(s.photo.session) + '</span>' : '<span class="pill ok">✓ photo</span>') : '<span class="pill warn">✗ No photo</span>') + '</div>' +
    '<div class="sides">' + IDCARD.html(d, D.fields, D.school, s, 'F', {photo:PICS[s.adm]}) + (d.sides === '2' ? IDCARD.html(d, D.fields, D.school, s, 'B', {photo:PICS[s.adm]}) : '') + '</div>' +
    '<div class="msg" id="ov_' + esc(s.adm) + '"></div></div>').join('');
  $('main').innerHTML = h;
  requestAnimationFrame(fitAll);
  printBtn();
}
function fitAll(){
  let bad = 0;
  document.querySelectorAll('#main .cardrow').forEach(row => {
    let ok = true; row.querySelectorAll('.idc').forEach(c => { if(!IDCARD.fit(c)) ok = false; });
    let adm = row.id.slice(3), m = $('ov_' + adm);
    row.classList.toggle('bad', !ok);
    if(!ok){ bad++; show(m, 'Too much text for this card – some lines do not fit. ' + (D.canDesign ? 'Switch off a field or shorten a label in the ID card design.' : 'Ask the admin to change the ID card design.'), 'err'); } else hide(m);
  });
  let p = $('overPill'); if(p){ p.style.display = bad ? '' : 'none'; p.textContent = bad + ' card(s) with too much text'; }
}
function setFilter(f){ FILTER = f; draw(); }
function setMode(m){ MODE = m; printBtn(); }
function tick(adm, on){ if(on) delete OFF[adm]; else OFF[adm] = 1; let r = $('cr_' + adm); if(r) r.classList.toggle('off', !on); printBtn(); }
function printBtn(){
  let b = $('bPrint'); if(!b) return;
  let n = chosen().length;
  if(LOADING){ b.disabled = true; b.textContent = 'Loading photos ' + LOADED + '/' + TOLOAD + '…'; return; }
  b.disabled = !n; b.textContent = n ? '🖨️ Print ' + n + ' card' + (n > 1 ? 's' : '') + (MODE === 'A4' ? ' on A4' : ' (card printer)') : 'No card chosen';
}
// photos come 10 at a time; Print waits until every photo is in
async function loadPics(){
  let want = D.students.filter(s => s.photo.has && !PICS[s.adm]).map(s => s.adm), keep = D;
  LOADING = want.length > 0; LOADED = 0; TOLOAD = want.length; printBtn();
  for(let i = 0; i < want.length; i += 10){
    let part = want.slice(i, i + 10), r = null;
    for(let t = 0; t < 2 && !r; t++){ try{ r = await apiGet('photoget', {adms:part.join(',')}); }catch(e){ r = null; } }
    if(D !== keep) return;
    if(!r || !r.success){ LOADING = false; printBtn(); show($('pMsg'), '❌ Some photos could not be loaded. Check internet and reload the page before printing.', 'err'); $('bPrint').disabled = true; return; }
    part.forEach(a => { let u = r.photos[a] || r.photos[a.toUpperCase()]; if(u){ PICS[a] = u; document.querySelectorAll('.ph[data-padm="' + CSS.escape(a) + '"]').forEach(b => { b.innerHTML = '<img src="' + u + '" alt="">'; }); } });
    LOADED += part.length; printBtn();
  }
  LOADING = false; printBtn();
}
/* ---------- the print pages ---------- */
function cardHtml(s, side){ let c = document.querySelector('#cr_' + CSS.escape(s.adm) + ' .idc[data-side="' + side + '"]'); return c ? c.outerHTML : ''; }
function doPrint(){
  let d = D.design, sel = chosen(); if(!sel.length || LOADING) return;
  let L = d.shape !== 'P', W = L ? 85.6 : 54, H = L ? 54 : 85.6, two = d.sides === '2', out = '';
  if(MODE === 'CARD'){
    PAGE_STYLE.textContent = '@page{size:' + W + 'mm ' + H + 'mm;margin:0}';
    sel.forEach(s => { out += '<div class="pg" style="width:' + W + 'mm;height:' + H + 'mm">' + cardHtml(s, 'F') + '</div>'; if(two) out += '<div class="pg" style="width:' + W + 'mm;height:' + H + 'mm">' + cardHtml(s, 'B') + '</div>'; });
  } else {
    PAGE_STYLE.textContent = '@page{size:A4 portrait;margin:0}';
    let gap = 4, beside = two && d.backMode === 'BESIDE', cw = beside ? W * 2 + 2 : W;
    let cols = Math.max(1, Math.floor((210 + gap) / (cw + gap))), rows = Math.max(1, Math.floor((297 + gap) / (H + gap))), per = cols * rows;
    let x0 = (210 - (cols * cw + (cols - 1) * gap)) / 2, y0 = (297 - (rows * H + (rows - 1) * gap)) / 2;
    let marks = (x, y) => d.marks ? mk(x, y, W, H) : '';
    for(let p = 0; p < sel.length; p += per){
      let chunk = sel.slice(p, p + per), front = '', back = '';
      chunk.forEach((s, i) => {
        let c = i % cols, r = Math.floor(i / cols), x = x0 + c * (cw + gap), y = y0 + r * (H + gap);
        front += at(x, y, cardHtml(s, 'F')) + marks(x, y);
        if(beside){ front += at(x + W + 2, y, cardHtml(s, 'B')) + marks(x + W + 2, y); }
        else if(two){ let xm = 210 - x - W; back += at(xm, y, cardHtml(s, 'B')) + marks(xm, y); }      // mirrored for printing on both sides
      });
      out += '<div class="pg" style="width:210mm;height:297mm">' + front + '</div>';
      if(two && !beside) out += '<div class="pg" style="width:210mm;height:297mm">' + back + '</div>';
    }
  }
  $('print').innerHTML = out;
  setTimeout(() => { window.print(); }, 300);
}
function at(x, y, h){ return '<div class="at" style="left:' + x.toFixed(2) + 'mm;top:' + y.toFixed(2) + 'mm">' + h + '</div>'; }
// thin cutting marks just outside the 4 corners
function mk(x, y, w, h){
  let o = 0.5, l = 1.5, t = 0.15, s = '';
  [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(c => {
    let hx = c[0] === x ? c[0] - o - l : c[0] + o, vy = c[1] === y ? c[1] - o - l : c[1] + o;
    s += '<div class="mk" style="left:' + hx.toFixed(2) + 'mm;top:' + (c[1] - t / 2).toFixed(2) + 'mm;width:' + l + 'mm;height:' + t + 'mm"></div>';
    s += '<div class="mk" style="left:' + (c[0] - t / 2).toFixed(2) + 'mm;top:' + vy.toFixed(2) + 'mm;width:' + t + 'mm;height:' + l + 'mm"></div>';
  });
  return s;
}
init();
</script>
