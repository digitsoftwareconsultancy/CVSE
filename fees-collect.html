<style>

.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fee2e2;color:#991b1b}.dchip.l{background:#fff3e0;color:#9a3412}.dchip.u{background:#ede9fe;color:#5b21b6}

.card2{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;position:relative}

h3.g{margin:14px 0 4px;color:var(--navy);font-size:14px;border-bottom:2px solid var(--line);padding-bottom:3px}

.pill.n{background:#dcfce7;color:#166534}.pill.o{background:#e5e7eb;color:#374151}.pill.d{background:#fee2e2;color:#991b1b}.pill.g{background:#dcfce7;color:#166534}
.srow{background:#fff;border-radius:14px;padding:12px;border:1px solid #eef0f3;border-left:5px solid var(--blue);margin-bottom:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.srow b{color:var(--navy)}.srow .l2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ft{width:100%;border-collapse:collapse;font-size:12.5px}.ft th,.ft td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}.ft th{background:#eef2f7;color:var(--navy);font-size:11.5px}.ft td:first-child,.ft th:first-child,.ft td:nth-child(2),.ft th:nth-child(2){text-align:left}
.ft tr.tot td{font-weight:900;border-top:2px solid var(--navy)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.big div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.big b{display:block;font-size:18px;color:var(--navy)}.big span{font-size:11px;color:var(--muted);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;font-weight:700;color:var(--navy)}.chk input{width:22px;height:22px;min-height:0}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}

.mini{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}

.ok-box b{display:block;font-size:22px;color:#166534;margin:4px 0}

<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
 <div id="vFind">
  <div class="box"><div class="title">Collect Fees</div><div class="meta">Find the student, tick what is being paid, choose how the money came, and make the receipt.</div>
   <label>Name or admission no</label><div class="row2" style="grid-template-columns:1fr auto"><input id="q" placeholder="Type name or admission no" onkeydown="if(event.key==='Enter')doSearch()"><button class="btn b-blue" style="width:auto" onclick="doSearch()">Search</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="msg" id="gMsg"></div>
  <div id="res"></div>
 </div>
 <div id="vPay" style="display:none"></div>
</div>
<div class="modal" id="unlM"><div style="background:#fff;border-radius:16px;padding:16px;max-width:400px;width:100%;max-height:90vh;overflow:auto"><div class="title">Unlock the Result tab</div><div class="meta" id="unl_who"></div>
<label>Open the Result tab for how many days? (1 to 90)</label><input id="unl_days" inputmode="numeric" maxlength="2" value="7">
<label>Reason (kept in the log)</label><input id="unl_reason" maxlength="120" placeholder="Example: Parent promised to pay on 15th">
<div class="msg" id="unl_msg"></div><div class="btnrow"><button class="btn b-green" id="unl_btn" onclick="saveUnlock(1)">Unlock</button><button class="btn b-navy" onclick="$('unlM').classList.remove('on')">Cancel</button></div></div></div>
<div class="modal" id="fixM"><div style="background:#fff;border-radius:16px;padding:16px;max-width:400px;width:100%;max-height:90vh;overflow:auto"><div class="title">Correct student details</div><div class="meta">For spelling mistakes. Class, roll no and admission no are not changed here.</div>
<label>Student name</label><input id="fx_name" maxlength="80"><label>Father name</label><input id="fx_fa" maxlength="80"><label>Mother name</label><input id="fx_mo" maxlength="80">
<div class="row2"><div><label>Date of birth</label><input id="fx_dob" inputmode="numeric" maxlength="10" oninput="maskD(this)" placeholder="DD-MM-YYYY"></div><div><label>House</label><input id="fx_ho" maxlength="30"></div></div>
<div class="msg" id="fx_msg"></div><div class="btnrow"><button class="btn b-green" id="fx_btn" onclick="saveFix()">Save correction</button><button class="btn b-navy" onclick="$('fixM').classList.remove('on')">Cancel</button></div></div></div>
<div class="tabs" id="tabsBar"><button class="tabBtn active"><span class="tabIco">💵</span>Collect</button><button class="tabBtn" onclick="window.location.href='fees-receipts.html'"><span class="tabIco">🧾</span>Receipts</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div><script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyNYyNG5RYxe6tjztXsVbKEAkstJBNYmfwLWZvIqkPouFQsEOsovL-HPmb-KQ82_0NS/exec";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();




var FIXC = null;
function openFix(d, adm, cb){
  d = d || {}; FIXC = {adm:adm, cb:cb};
  $('fx_name').value = d.name || ''; $('fx_fa').value = d.father || ''; $('fx_mo').value = d.mother || ''; $('fx_dob').value = d.dob || ''; $('fx_ho').value = d.house || '';
  hide($('fx_msg')); $('fixM').classList.add('on');
}
async function saveFix(){
  let b = $('fx_btn'); b.disabled = true; show($('fx_msg'),'Saving... please wait','load');
  try{
    let r = await apiPost('feestudentfix',{adm:FIXC.adm,data:JSON.stringify({name:$('fx_name').value,father:$('fx_fa').value,mother:$('fx_mo').value,dob:$('fx_dob').value.trim(),house:$('fx_ho').value})});
    if(r.success){ $('fixM').classList.remove('on'); if(FIXC.cb) FIXC.cb(r.details); }
    else show($('fx_msg'),'❌ '+(r.error||'Could not save.'),'err');
  }catch(e){ show($('fx_msg'),'❌ Could not connect. Nothing was saved. Try again.','err'); }
  b.disabled = false;
}

var PRIV = [];
function lockHtml(){
  let L = G.lock; if(!L || !L.on) return '';
  let can = PRIV.indexOf('UNLOCK') > -1;
  if(L.locked) return '<div class="probs" style="background:#fdecea;border-color:#ef9a9a;color:#7f1d1d">🔒 Result tab is closed for this student: '+rs(L.amount)+' overdue for '+L.days+' days.'+(can?'<div class="btnrow"><button class="btn b-purple" onclick="openUnlock()">🔓 Unlock for some days</button></div>':'<br><small>Ask the admin or an accountant with the Unlock permission to open it.</small>')+'</div>';
  if(L.unlocked) return '<div class="probs" style="background:#e8f5e9;border-color:#a5d6a7;color:#14532d">🔓 Result tab is unlocked until '+esc(L.unlockedUntil)+'. Overdue: '+rs(L.amount)+'.'+(can?'<div class="btnrow"><button class="btn b-navy" onclick="saveUnlock(0)">Remove the unlock</button></div>':'')+'</div>';
  return '';
}
function openUnlock(){ $('unl_who').innerText = G.student.name + ' · ' + rs(G.lock.amount) + ' overdue for ' + G.lock.days + ' days'; $('unl_days').value = '7'; $('unl_reason').value = ''; hide($('unl_msg')); $('unlM').classList.add('on'); }
async function saveUnlock(on){
  let b = $('unl_btn'); if(on){ b.disabled = true; show($('unl_msg'),'Saving... please wait','load'); }
  try{
    let r = await apiPost('feeunlock',{adm:G.student.adm,days:on?$('unl_days').value.trim():0,reason:on?$('unl_reason').value:''});
    if(r.success){ G.lock = r.lock; $('unlM').classList.remove('on'); draw(); show($('gMsg'),'✅ '+r.message,'ok'); }
    else if(on) show($('unl_msg'),'❌ '+(r.error||'Could not save.'),'err'); else show($('gMsg'),'❌ '+(r.error||'Could not remove.'),'err');
  }catch(e){ if(on) show($('unl_msg'),'❌ Could not connect. Nothing was saved. Try again.','err'); else show($('gMsg'),'❌ Could not connect.','err'); }
  b.disabled = false;
}
var G = null, SEL = {}, ITEMS = [], REQ = '', BUSY = false;
function rs(n){ return '₹' + (Math.round((Number(n)||0) * 100) / 100).toLocaleString('en-IN'); }
function newReq(){ REQ = 'q' + Date.now().toString(36) + Math.random().toString(36).substring(2, 8); }
async function classes(){
  try{ let r = await apiGet('feeme',{}); if(r.success) PRIV = r.privileges || []; if(r.success) $('chips').innerHTML = (r.classes||[]).map(c=>'<button class="chip" onclick="byClass(\''+esc(c)+'\')">'+esc(c)+'</button>').join(''); }catch(e){}
}
function byClass(c){ $('q').value = ''; search({'class':c}); }
function doSearch(){ let q = $('q').value.trim(); if(!q){ show($('gMsg'),'Type a name or admission number, or choose a class.','warn'); return; } search({q:q}); }
async function search(p){
  show($('gMsg'),'Searching... please wait','load'); $('res').innerHTML = '';
  try{
    let r = await apiGet('feefind',p);
    if(!r.success){ show($('gMsg'),'❌ '+(r.error||'Could not search.'),'err'); return; }
    hide($('gMsg'));
    if(!r.students.length){ $('res').innerHTML = '<div class="empty-note">No student found.</div>'; return; }
    $('res').innerHTML = r.students.map(s=>'<div class="srow" onclick="pick(\''+esc(s.adm)+'\')"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(s.name)+'</b><span class="pill '+(s.balance>0?'d':'g')+'">'+(s.balance>0?'Unpaid '+rs(s.balance):'Clear')+'</span></div><div class="meta">Class '+esc(s.cls)+(s.roll?' · Roll '+esc(s.roll):'')+' · Adm '+esc(s.adm)+'</div></div>').join('') + (r.more?'<div class="meta">Showing the first 40. Type more letters to narrow down.</div>':'');
  }catch(e){ show($('gMsg'),'❌ Could not connect. Check internet and try again.','err'); }
}
async function pick(adm, session, asClass){
  show($('gMsg'),'Opening student... please wait','load');
  try{
    let p = {adm:adm}; if(session) p.session = session; if(asClass) p.asClass = asClass;
    let r = await apiGet('feecollectget',p);
    if(!r.success){ show($('gMsg'),'❌ '+(r.error||'Could not open.'),'err'); return; }
    hide($('gMsg')); G = r; SEL = {}; ITEMS = []; if(!REQ) newReq();
    $('vFind').style.display = 'none'; $('vPay').style.display = 'block'; draw(); window.scrollTo(0,0);
  }catch(e){ show($('gMsg'),'❌ Could not connect. Check internet and try again.','err'); }
}
function back(){ $('vPay').style.display = 'none'; $('vFind').style.display = 'block'; G = null; }
function rowHtml(x){
  let s = SEL[x.key] || {on:false,amount:''};
  return '<div class="row3"><input type="checkbox" '+(s.on?'checked':'')+' onchange="tick(\''+esc(x.key)+'\',this.checked)"><div>'+esc(x.label)+'<small>'+(x.due?'Due '+esc(x.due.split('-').reverse().join('-'))+' · ':'')+'Unpaid '+rs(x.balance)+'</small></div><input class="amt" inputmode="decimal" data-k="'+esc(x.key)+'" value="'+esc(s.amount)+'" oninput="typed(\''+esc(x.key)+'\',this)"></div>';
}
function draw(){
  let today = G.today, due = [], later = [];
  G.payables.forEach(x=>{ if(!x.due || x.due <= todayIso()) due.push(x); else later.push(x); });
  let showSession = G.sessions.length > 1;
  let h = '<div class="box"><div class="title">'+esc(G.student.name)+'</div><div class="meta">Class '+esc(G.student.cls)+(G.student.roll?' · Roll '+esc(G.student.roll):'')+' · Adm '+esc(G.student.adm)+'</div>'+
   '<div class="big"><div><b>'+rs(G.totals.payableNow)+'</b><span>Overdue today</span></div><div><b>'+rs(G.totals.totalDue)+'</b><span>Total unpaid ('+esc(G.session)+')</span></div></div>'+
   lockHtml()+(G.warnings.length?'<div class="probs">⚠ '+G.warnings.map(esc).join('<br>⚠ ')+'</div>':'')+
   (showSession?'<label>Pay for session</label><select id="c_sess" onchange="pick(\''+esc(G.student.adm)+'\',this.value,\'\')">'+G.sessions.map(s=>'<option'+(s===G.session?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'+(G.asClass!==G.student.cls||true?'<label>Class in that session</label><select id="c_cls" onchange="pick(\''+esc(G.student.adm)+'\',$(\'c_sess\').value,this.value)">'+G.classes.map(c=>'<option'+(c===G.asClass?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="help">Use this to take the next session’s fees in advance. Choose the class the child will be in.</div>':''):'')+
   '<div class="btnrow"><button class="btn b-navy" onclick="back()">⬅ Choose another student</button><button class="btn b-purple" onclick="openFix(G.details,G.student.adm,function(d){G.details=d;G.student.name=d.name;draw();})">✏ Correct name / parents</button></div></div>';
  h += '<div class="box"><div class="title">What is being paid</div>'+(due.length?due.map(rowHtml).join(''):'<div class="empty-note">Nothing is overdue.</div>')+
   (later.length?'<details style="margin-top:8px"><summary style="font-weight:800;color:var(--navy);min-height:40px;cursor:pointer">Not yet due — pay in advance ('+later.length+')</summary>'+later.map(rowHtml).join('')+'</details>':'')+
   '<label>Amount received (fills the boxes automatically)</label><div class="row2" style="grid-template-columns:1fr auto"><input id="recv" inputmode="decimal" placeholder="Amount"><button class="btn b-purple" style="width:auto" onclick="allocate()">Fill</button></div><div class="help">Filled '+(G.payOrder==='CURRENT_FIRST'?'current fees first':'oldest dues first')+' (changeable in Fees Settings). You can still change any box.</div></div>';
  h += '<div class="box"><div class="title">Accessories sold</div>'+(G.items.length?'<div class="row2" style="grid-template-columns:1fr 70px auto"><select id="itSel">'+G.items.map(i=>'<option value="'+esc(i.itemId)+'">'+esc(i.name+(i.size?' ('+i.size+')':''))+' — '+rs(i.price)+'</option>').join('')+'</select><input id="itQty" inputmode="numeric" value="1"><button class="btn b-blue" style="width:auto" onclick="addItem()">Add</button></div>':'<div class="meta">No accessory items are set for this session.</div>')+'<div id="itList"></div>'+
   '<h3 class="g">Fine (typed)</h3><div class="row2"><div><label>Reason</label><input id="fnL" maxlength="30" placeholder="Late fine..." oninput="sum()"></div><div><label>Amount</label><input id="fnA" inputmode="decimal" oninput="sum()"></div></div></div>';
  h += '<div class="box"><div class="title">Payment</div><label>Received by</label><select id="mode">'+G.modes.map(m=>'<option>'+esc(m)+'</option>').join('')+'</select>'+
   '<label>Reference no (UPI / cheque, optional)</label><input id="ref" maxlength="40"><div class="row2"><div><label>Receipt date</label><input id="dt" inputmode="numeric" maxlength="10" oninput="maskD(this)" value="'+esc(today)+'"></div><div><label>Note (optional)</label><input id="note" maxlength="120"></div></div></div>';
  h += '<div class="tot"><span>Total</span><span id="totAmt">₹0</span></div><div class="box"><div class="btnrow"><button class="btn b-green" id="payBtn" onclick="submitPay()">Take payment &amp; make receipt</button></div><div class="msg" id="pMsg"></div></div>';
  $('vPay').innerHTML = h; drawItems(); sum();
}
function todayIso(){ return G.today.split('-').reverse().join('-'); }
function tick(k,on){
  let x = G.payables.find(y=>y.key===k); SEL[k] = {on:on, amount:on?String(x.balance):''};
  let i = document.querySelector('input.amt[data-k="'+k.replace(/"/g,'\\"')+'"]'); if(i) i.value = SEL[k].amount; sum();
}
function typed(k,el){ let v = el.value.trim(); SEL[k] = {on:v!=='' && Number(v)>0, amount:v}; let cb = el.parentNode.querySelector('input[type=checkbox]'); if(cb) cb.checked = SEL[k].on; sum(); }
function allocate(){
  let amt = Number($('recv').value.replace(/,/g,'')); if(!(amt > 0)){ show($('pMsg'),'Type the amount received first.','warn'); return; }
  let rows = G.payables.slice(), kind = {OPENING:0,AUTOFINE:1,FEE:2};
  if(G.payOrder === 'CURRENT_FIRST') kind = {FEE:0,OPENING:1,AUTOFINE:2};
  rows.sort((a,b)=>kind[a.kind]-kind[b.kind] || (a.due||'').localeCompare(b.due||''));
  SEL = {}; let left = amt;
  rows.forEach(x=>{ if(left <= 0) return; let a = Math.min(left, x.balance); SEL[x.key] = {on:true, amount:String(Math.round(a*100)/100)}; left = Math.round((left-a)*100)/100; });
  draw(); $('recv').value = String(amt);
  if(left > 0) show($('pMsg'),'₹'+left+' is more than all unpaid fees. The rest can go to accessories, a fine, or be returned.','warn');
}
function addItem(){ let id = $('itSel').value, q = parseInt($('itQty').value,10) || 0; if(q < 1 || q > 20){ show($('pMsg'),'Quantity must be 1 to 20.','warn'); return; } ITEMS.push({itemId:id,qty:q}); drawItems(); sum(); }
function rmItem(i){ ITEMS.splice(i,1); drawItems(); sum(); }
function drawItems(){
  $('itList').innerHTML = ITEMS.map((x,i)=>{ let it = G.items.find(y=>y.itemId===x.itemId); return '<div class="mini" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>'+esc(it.name+(it.size?' ('+it.size+')':''))+' × '+x.qty+' = <b>'+rs(it.price*x.qty)+'</b></span><button class="x" style="position:static" onclick="rmItem('+i+')">✕</button></div>'; }).join('');
}
function total(){
  let t = 0; Object.keys(SEL).forEach(k=>{ if(SEL[k].on) t += Number(SEL[k].amount) || 0; });
  ITEMS.forEach(x=>{ let it = G.items.find(y=>y.itemId===x.itemId); t += it.price * x.qty; });
  let f = $('fnA') ? Number($('fnA').value) : 0; if(f > 0) t += f;
  return Math.round(t*100)/100;
}
function sum(){ if($('totAmt')) $('totAmt').innerText = rs(total()); }
async function submitPay(){
  if(BUSY) return;
  let pay = Object.keys(SEL).filter(k=>SEL[k].on && Number(SEL[k].amount) > 0).map(k=>({key:k,amount:SEL[k].amount}));
  let fine = $('fnA').value.trim() ? {label:$('fnL').value,amount:$('fnA').value} : null;
  if(!pay.length && !ITEMS.length && !fine){ show($('pMsg'),'Choose at least one thing to pay.','warn'); return; }
  BUSY = true; let b = $('payBtn'); b.disabled = true; show($('pMsg'),'Saving receipt... please wait','load');
  try{
    let r = await apiPost('feecollect',{adm:G.student.adm,session:G.session,asClass:G.asClass,pay:JSON.stringify(pay),items:JSON.stringify(ITEMS),fine:JSON.stringify(fine),mode:$('mode').value,ref:$('ref').value,note:$('note').value,date:$('dt').value.trim(),reqId:REQ});
    if(r.success){
      newReq();
      $('vPay').innerHTML = '<div class="ok-box">✅ Payment saved<b>Receipt '+esc(r.receiptNo)+'</b><div>'+esc(r.student.name)+' · '+rs(r.total)+' · '+esc(r.mode)+'</div><div class="meta">Balance still unpaid: '+rs(r.balanceAfter)+'</div>'+
       '<div class="btnrow"><button class="btn b-blue" onclick="window.location.href=\'fees-receipt.html?no='+encodeURIComponent(r.receiptNo)+'&s='+encodeURIComponent(r.session)+'\'">🖨 Print receipt</button><button class="btn b-navy" onclick="back()">New payment</button></div></div>';
      window.scrollTo(0,0); BUSY = false; return;
    }
    show($('pMsg'),'❌ '+(r.error||'Could not save.'),'err'); $('pMsg').scrollIntoView({block:'center'});
  }catch(e){ show($('pMsg'),'❌ Could not connect. The receipt may or may not be saved. Check the Receipts list before trying again — tapping again is safe.','err'); }
  BUSY = false; b.disabled = false;
}
classes();
</script>
</body></html>
