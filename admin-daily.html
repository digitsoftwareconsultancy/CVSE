<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body{font-family:Arial;padding:10px;background:#f5f5f5}
.box{background:#fff;padding:12px;border-radius:10px;margin-bottom:12px}
table{border-collapse:collapse;width:100%} th,td{border:1px solid #ddd;padding:6px;font-size:12px;height:0.8cm}
th{background:#8b4513;color:#fff}
.btn{padding:6px 10px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;margin:2px}
.btn-green{background:#2e7d32;color:#fff}.btn-red{background:#c62828;color:#fff}.btn-blue{background:#1976d2;color:#fff}
</style></head><body>
<h2>🗂️ Admin Daily Updates Controller</h2>
<div class="box">
<button onclick="goAdmin()" style="background:#0b2a5c;color:#fff;padding:6px 12px;border:none;border-radius:6px;font-weight:700;cursor:pointer">← Back to Admin</button>
<br><br>
<input type="date" id="fDate"> <select id="fClass"><option value="ALL">All Classes</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option>VI</option><option>VII</option><option>VIII</option><option>IX</option><option>X</option></select>
<button class="btn btn-blue" onclick="loadAdmin()">🔍 Load</button>
<button class="btn btn-green" onclick="publishSelected()">📄 Publish Selected (Lock Teachers)</button>
<button class="btn btn-red" onclick="unpublishSelected()">🔓 Unpublish</button>
</div>
<div class="box" style="overflow:auto"><table id="tbl"><thead><tr><th><input type="checkbox" id="chkAll" onchange="toggleAll(this)"></th><th>Date</th><th>Class</th><th>P</th><th>Subject</th><th>Teacher</th><th>Chapter</th><th>Topic</th><th>HW</th><th>Status</th><th>Published</th><th>Action</th></tr></thead><tbody id="tbody"><tr><td colspan="12">Load data...</td></tr></tbody></table></div>

<script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyzFPIR9-9oGTAI59J-109e_KHn7Cj1UbuvRpYt-X1tnddQVNFy3GtZgKIdS4v50jtG/exec";
let TODAY = new Date().toISOString().split('T')[0];
document.getElementById('fDate').value=TODAY;

async function apiGet(action, params={}){
  let url = WEB_URL + "?action=" + action;
  for(let k in params) url += "&" + k + "=" + encodeURIComponent(params[k]);
  let r = await fetch(url);
  return await r.json();
}
async function apiPost(action, payload={}){
  let r = await fetch(WEB_URL,{method:'POST',body:JSON.stringify({action,...payload})});
  return await r.json();
}
function goAdmin(){ window.location.href='admin.html'; }

async function loadAdmin(){
  let date=document.getElementById('fDate').value;
  let cls=document.getElementById('fClass').value;
  document.getElementById('tbody').innerHTML='<tr><td colspan="12">Loading...</td></tr>';
  let res = await apiGet('getdailyupdatesadmin', {date:date, className:cls});
  let list = res.list || res.updates || res || [];
  if(typeof list==='string') list = JSON.parse(list);
  let html='';
  list.forEach(r=>{
    html+=`<tr>
      <td><input type="checkbox" class="chk" value="${r.row}"></td>
      <td>${r.date}</td><td>${r.class}</td><td>${r.period}</td><td>${r.subject}</td><td>${r.teacher}<br><small>${r.teacherName}</small></td>
      <td><input id="ch_${r.row}" value="${r.chapter||''}" style="width:80px"></td>
      <td><input id="tp_${r.row}" value="${(r.topic||'').replace(/"/g,'')}" style="width:120px"></td>
      <td><input id="hw_${r.row}" value="${(r.homework||'').replace(/"/g,'')}" style="width:100px"></td>
      <td>${r.status}</td><td><b style="color:${r.published=='YES'?'red':'green'}">${r.published}</b></td>
      <td><button class="btn btn-green" onclick="adminSave(${r.row},'${r.date}','${r.class}','${r.period}','${r.time}','${r.subject}','${r.teacher}','${r.teacherName}')">Save</button></td>
    </tr>`;
  });
  if(list.length==0) html='<tr><td colspan="12">No data</td></tr>';
  document.getElementById('tbody').innerHTML=html;
}
function toggleAll(el){ document.querySelectorAll('.chk').forEach(c=>c.checked=el.checked); }
function getSelectedRows(){ return Array.from(document.querySelectorAll('.chk:checked')).map(c=>parseInt(c.value)); }
async function publishSelected(){ let rows=getSelectedRows(); if(rows.length==0){ alert('Select rows'); return; } let res = await apiPost('setpublishstatus', {rows:rows, published:'YES'}); alert('Published '+rows.length); loadAdmin(); }
async function unpublishSelected(){ let rows=getSelectedRows(); if(rows.length==0){ alert('Select rows'); return; } let res = await apiPost('setpublishstatus', {rows:rows, published:'NO'}); alert('Unpublished '+rows.length); loadAdmin(); }
async function adminSave(row, date, cls, period, time, subject, teacher, tName){
  let obj={
    date:date, className:cls, period:period, periodTime:time, subject:subject,
    teacherUsername:teacher, teacherName:tName,
    chapter:document.getElementById('ch_'+row).value,
    topic:document.getElementById('tp_'+row).value,
    homework:document.getElementById('hw_'+row).value,
    status:'Completed', published:'NO', isAdmin:true
  };
  let res = await apiPost('savedailyupdate', obj);
  alert(res.msg || 'Saved');
  loadAdmin();
}
window.onload=loadAdmin;
</script></body></html>
