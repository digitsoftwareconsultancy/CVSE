<div class="no-print">
<div class="top-bar">
<button class="btn btn-gray" onclick="goBack()">← Back</button>
<select id="classSel" onchange="loadClass()"><option>Loading...</option></select>

</div>

<script>
var WEB_URL = "https://script.google.com/macros/s/AKfycbyzFPIR9-9oGTAI59J-109e_KHn7Cj1UbuvRpYt-X1tnddQVNFy3GtZgKIdS4vbuvRpYt-X1tnddQVNFy3GtZgKIdS4v50jtG/exec";
var DEFAULTS=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
var sel=document.getElementById('classSel');
var HD_HEADER_I = 'https://digitcda-lab.github.io/CVS//HeaderNew.jpg';
var HD_HEADER_II = 'https://digitcda-lab.github.io/CVS//HeaderNewII.jpg';
var HD_KIND = 'https://digitcda-lab.github.io/CVS//Kind_Confident_Box.jpg';
var HD_TROPHY_I = 'https://digitcda-lab.github.io/CVS//TrophyBox.jpg';
var HD_TROPHY_II = 'https://digitcda-lab.github.io/CVS//TrophyBoxII.jpg';
var SIGN_PRINCIPAL = 'https://digitcda-lab.github.io/CVS//Sign_Principal.jpg';
var CUR_SESSION='2026-2027'; var CUR_TERM='I'; var CUR_TERM_TEXT='TERM - I (PT 1 + HALF YEARLY)';
var SECURE_TOKEN=null;
var TOKEN_VALIDATED=false;
var CURRENT_USER_ROLE=null;

function getHeaderImg(){ return (CUR_TERM=='II')? HD_HEADER_II : HD_HEADER_I; }
function getTrophyImg(){ return (CUR_TERM=='II')? HD_TROPHY_II : HD_TROPHY_I; }
function getPTLine(){ return (CUR_TERM=='II')? '(PT 2 + ANNUAL)' : '(PT 1 + HALF YEARLY)'; }

async function apiGet(action, params={}){
  let url = WEB_URL + "?action=" + action;
  for(let k in params) url += "&" + k + "=" + encodeURIComponent(params[k]);
  let r = await fetch(url);
  return await r.json();
}
async function apiPost(action, payload={}){
  let r = await fetch(WEB_URL,{method:'POST',body:JSON.stringify({action,...payload})});
  return await r.json();
}

async function secureInit(){
  let urlParams = new URLSearchParams(window.location.search);
  SECURE_TOKEN = urlParams.get('token') || localStorage.getItem('cvse_token') || localStorage.getItem('cvs_token') || localStorage.getItem('token') || localStorage.getItem('student_token');
  let adParam = urlParams.get('ad');
  if(!SECURE_TOKEN){
    document.body.innerHTML='<div style="text-align:center;padding:50px;font-family:Arial;background:#fff;max-width:600px;margin:50px auto;border-radius:12px"><h2 style="color:#c62828">⛔ Access Denied - No Valid Session</h2><p>Please login from Student or Teacher panel.</p><a href="index.html" style="display:inline-block;background:#0b2a5c;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;margin-top:15px">Go to Login</a></div>';
    return;
  }
  if(urlParams.get('token')) localStorage.setItem('token', urlParams.get('token'));
  try{
    let vRes = await apiPost('validatereporttoken', {token:SECURE_TOKEN});
    if(!vRes.success){
      document.body.innerHTML='<div style="text-align:center;padding:50px;font-family:Arial;background:#fff;max-width:600px;margin:50px auto;border-radius:12px"><h2 style="color:#c62828">⛔ '+vRes.msg+'</h2><p>Session expired.</p><a href="index.html" style="display:inline-block;background:#0b2a5c;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;margin-top:15px">Login Again</a></div>';
      return;
    }
    TOKEN_VALIDATED=true; CURRENT_USER_ROLE=vRes.role||'teacher';
    if(vRes.role=='student' && adParam){
      if(vRes.admissionNo && vRes.admissionNo!=adParam){ document.body.innerHTML='<div style="text-align:center;padding:50px"><h2 style="color:red">⛔ You can only view your own report</h2></div>'; return; }
      document.querySelector('.top-bar').style.display='none'; document.getElementById('stuList').style.display='none'; genOne(adParam, '');
    } else if(vRes.role=='student' &&!adParam){
      let storedAd = localStorage.getItem('student_ad');
      if(storedAd){ genOne(storedAd, ''); document.querySelector('.top-bar').style.display='none'; document.getElementById('stuList').style.display='none'; }
    }
    loadSettingsAndClasses();
  }catch(e){
    document.body.innerHTML='<div style="text-align:center;padding:50px"><h2 style="color:red">Error: '+e.message+'</h2></div>';
  }
}

async function loadSettingsAndClasses(){
 try{ 
   let s = await apiGet('getallsettings');
   CUR_SESSION=s.session||'2026-2027'; CUR_TERM=s.activeTerm||'I'; CUR_TERM_TEXT= CUR_TERM=='II'?'TERM - II (PT2 + ANNUAL)':'TERM - I (PT1 + HALF YEARLY)';
 }catch(e){}
 fillClasses(DEFAULTS);
 try{
   let clsData = await apiGet('getclasses', {allowed:getAllowedParam()});
   fillClasses(clsData.classes||clsData);
 }catch(e){}
 let urlParams = new URLSearchParams(window.location.search); let ad = urlParams.get('ad');
 if(ad && CURRENT_USER_ROLE!='student'){ setTimeout(function(){ genOne(ad, ''); }, 800); }
}
function getAllowedParam(){
  try{
    var a=localStorage.getItem('cvse_classes')||localStorage.getItem('assignedClasses')||localStorage.getItem('classes')||'';
    if(!a){var uStr=localStorage.getItem('cvse_user')||localStorage.getItem('cvs_user')||''; if(uStr){var u=JSON.parse(uStr); a=u.assignedClasses||u.classes||'';}}
    if(!a) a=sessionStorage.getItem('assignedClasses')||''; return a||'';
  }catch(e){return '';}
}
function fillClasses(a){
  if(CURRENT_USER_ROLE=='student') return;
  var allowed=getAllowedParam(); var arr;
  if(allowed && String(allowed).toUpperCase()!='ALL' && String(allowed).trim()!=''){ arr=String(allowed).split(/[,;|]+/).map(function(x){return x.trim()}).filter(Boolean); }
  else{arr=(a&&a.length)?a:DEFAULTS;}
  sel.innerHTML='<option value="">-- Select Class --</option>';
  arr.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
  if(arr.length==1){sel.value=arr[0]; loadClass();}
}
function goBack(){
  if(CURRENT_USER_ROLE=='student'){ window.location.href='student.html'; return; }
  var role=(localStorage.getItem('cvse_role')||localStorage.getItem('role')||'teacher').toLowerCase();
  if(role.indexOf('admin')>-1) window.location.href='admin.html';
  else if(role.indexOf('subject')>-1) window.location.href='subject-dashboard.html';
  else window.location.href='class-dashboard.html';
}
function selectRow(el){document.querySelectorAll('.stu-row').forEach(function(d){d.classList.remove('active');}); el.classList.add('active');}

async function loadClass(){
  if(!TOKEN_VALIDATED){ alert('Token not validated'); return; }
  var cls=sel.value; if(!cls) return;
  var allowed=getAllowedParam();
  document.getElementById('stuList').innerHTML='<div style="padding:12px;text-align:center">Loading '+cls+'...</div>';
  try{
    let data = await apiGet('getstudentsbyclass', {className:cls, allowed:allowed});
    let list = data.students || data.list || data || [];
    if(!list||!list.length){document.getElementById('stuList').innerHTML='No students'; return;}
    list.sort((a,b)=>(parseInt(a.rollNo)||0)-(parseInt(b.rollNo)||0));
    var h=''; list.forEach(function(s){ var ad=s.admissionNo||s.ad||''; var name=s.name||''; var roll=s.rollNo||s.rl||''; h+='<div class="stu-row" onclick="selectRow(this); genOne(\''+ad+'\',\''+roll+'\')"><span style="font-weight:800">Roll '+roll+'</span> - '+name+' <span style="color:#777;font-size:11px">('+ad+')</span></div>'; });
    document.getElementById('stuList').innerHTML=h;
  }catch(e){ alert(e.message); }
}
async function genOne(ad,rl){
  if(!TOKEN_VALIDATED){ alert('Invalid session'); return; }
  var allowed=getAllowedParam();
  document.getElementById('printArea').innerHTML='<div style="padding:20px;text-align:center">Loading report...</div>';
  try{
    let r = await apiGet('checkstudentresult', {ad:ad, rollNo:rl, allowed:allowed, token:SECURE_TOKEN});
    if(!r.success) return alert(r.msg);
    document.getElementById('printArea').innerHTML=buildPage(r);
  }catch(e){ alert(e.message); }
}
async function doBulk(){
  if(CURRENT_USER_ROLE=='student'){ alert('Bulk print not allowed for students'); return; }
  var cls=sel.value; if(!cls) return alert('Select Class');
  var allowed=getAllowedParam();
  document.getElementById('printArea').innerHTML='<div style="padding:20px;text-align:center">Bulk generating...</div>';
  try{
    let data = await apiGet('getclassbulkreport', {className:cls, allowed:allowed, token:SECURE_TOKEN});
    let list = data.reports || data.list || [];
    var all=''; list.forEach(function(r){if(r.success) all+=buildPage(r);});
    document.getElementById('printArea').innerHTML=all;
  }catch(e){ alert(e.message); }
}

function buildPage(r){
 var s=r.student||{}, sch=r.scholastic||[], g=r.grand||{};
 var oa=r.otherAchievements||{};
 var subjectMaster = r.subjectMaster||[]; 
 var termResult=(oa.TermResult&&String(oa.TermResult).trim()!=='')?oa.TermResult:(oa.AA||r.TermResult||'Promoted to the next term and wishing success');
 var map={};sch.forEach(function(m){map[m.subject.toUpperCase()]=m; map[m.subject]=m;});
 var cNum={"I":"1","II":"2","III":"3","IV":"4","V":"5","VI":"6","VII":"7","VIII":"8","IX":"9","X":"10"}[String(s.class||'').toUpperCase()]||"1";
 var adNo=String(s.admissionNo||s.ad||'').trim();
 var photo=(s.photo||'').trim()||'https://digitcda-lab.github.io/CVS//GRADE_'+cNum+'/'+adNo+'.jpeg';
 var headerImg=getHeaderImg(); var trophyImg=getTrophyImg();
 var ptLabel=(CUR_TERM=='II')?'PT 2':'PT 1'; var hyLabel=(CUR_TERM=='II')?'Annual':'Half Yearly';

 var scholasticMaster = subjectMaster.filter(function(x){ return String(x.subjectType||'').toUpperCase()=='SCHOLASTIC' && String(x.isGradeSystem||'').toUpperCase()=='NO'; }).sort(function(a,b){return (a.displayOrder||0)-(b.displayOrder||0);});
 var coMaster = subjectMaster.filter(function(x){ return String(x.subjectType||'').toUpperCase()=='CO-SCHOLASTIC'; }).sort(function(a,b){return (a.displayOrder||0)-(b.displayOrder||0);});
 var perMaster = subjectMaster.filter(function(x){ return String(x.subjectType||'').toUpperCase()=='PERSONAL_SOCIAL'; }).sort(function(a,b){return (a.displayOrder||0)-(b.displayOrder||0);});

 if(scholasticMaster.length==0){ scholasticMaster = [{subjectName:'English',maxPT:50,maxTerm:100},{subjectName:'Mathematics',maxPT:50,maxTerm:100},{subjectName:'Science/EVS',maxPT:50,maxTerm:100},{subjectName:'Social Science',maxPT:50,maxTerm:100},{subjectName:'Computer',maxPT:20,maxTerm:30},{subjectName:'Hindi',maxPT:50,maxTerm:100},{subjectName:'Assamese',maxPT:25,maxTerm:50}]; }

 var ptFull=(CUR_TERM=='II')?'PT 2<br> (Written + IA)<br> Total '+ (scholasticMaster[0]?.maxPT||50) +' Pass '+(Math.ceil((scholasticMaster[0]?.maxPT||50)*0.33)):'PT 1<br> (Written + IA)<br> Total '+ (scholasticMaster[0]?.maxPT||50) +' Pass '+(Math.ceil((scholasticMaster[0]?.maxPT||50)*0.33));
 var hyFull=(CUR_TERM=='II')?'Annual <br> (Written + IA)<br> Total '+ (scholasticMaster[0]?.maxTerm||100) +' Pass '+(Math.ceil((scholasticMaster[0]?.maxTerm||100)*0.33)):'Half Yearly <br> (Written + IA)<br> Total '+ (scholasticMaster[0]?.maxTerm||100) +' Pass '+(Math.ceil((scholasticMaster[0]?.maxTerm||100)*0.33));
 var termTotal=(CUR_TERM=='II')?'Term II Total (PT2 + Annual)':'Term I Total (PT1 + Half Yearly)';

 var rows='';var tO=0,tM=0; var hasAnyNA=false;
 var teacherSignHtml = (s.teacherSign && String(s.teacherSign).trim()!='')? '<img src="'+s.teacherSign+'" onerror="this.style.display=\'none\'">' : '';
 function isNA(v){ return String(v||'').trim().toUpperCase()==='NA'; }

 scholasticMaster.forEach(function(sm){
  var subName = sm.subjectName||sm.subject||'';
  var m=map[subName.toUpperCase()]||map[subName]||null;
  var maxPT = Number(sm.maxPT||sm.max_PT||50);
  var maxTerm = Number(sm.maxTerm||sm.max_Term||100);
  var fullMax = maxPT + maxTerm;
  var label = subName + ' ('+maxPT+'/'+maxTerm+')';

  if(!m){
    rows+='<tr><td class="left">'+label+'</td><td colspan="10"></td></tr>'; return;
  }
  var pt1NA = isNA(m.pt1_w) || isNA(m.pt1_ia) || isNA(m.pt1);
  var hyNA = isNA(m.hy_w) || isNA(m.hy_ia) || isNA(m.hy);
  var bothNA = m.isNA || (pt1NA && hyNA) || isNA(m.obt);
  if(bothNA){
    hasAnyNA=true;
    rows+='<tr><td class="left">'+label+'</td><td colspan="10" style="text-align:center;font-weight:800">NA</td></tr>'; return;
  }
  var curMax=fullMax, curObt=Number(m.obt||0), curPerc=m.perc||'', curGrade=m.grade||'';
  var pt1DispW=m.pt1_w||'', pt1DispIA=m.pt1_ia||'', pt1DispT=m.pt1||'';
  var hyDispW=m.hy_w||'', hyDispIA=m.hy_ia||'', hyDispT=m.hy||'';
  if(pt1NA &&!hyNA){ hasAnyNA=true; curMax = maxTerm; curObt = Number(m.hy||0); curPerc = curMax?((curObt/curMax*100).toFixed(1)):''; pt1DispW='NA'; pt1DispIA='NA'; pt1DispT='NA'; }
  else if(!pt1NA && hyNA){ hasAnyNA=true; curMax = maxPT; curObt = Number(m.pt1||0); curPerc = curMax?((curObt/curMax*100).toFixed(1)):''; hyDispW='NA'; hyDispIA='NA'; hyDispT='NA'; }
  tO+=curObt; tM+=curMax;
  rows+='<tr><td class="left">'+label+'</td><td>'+pt1DispW+'</td><td>'+pt1DispIA+'</td><td>'+pt1DispT+'</td><td>'+hyDispW+'</td><td>'+hyDispIA+'</td><td>'+hyDispT+'</td><td>'+curMax+'</td><td>'+curObt+'</td><td>'+curPerc+'</td><td>'+curGrade+'</td></tr>';
 });

 var finalMax = hasAnyNA? tM : (g.max||tM);
 var finalObt = hasAnyNA? tO : (g.obt||tO);
 var finalPerc = hasAnyNA? (finalMax? (finalObt/finalMax*100).toFixed(2):'') : (g.perc||'');
 var finalGrade = hasAnyNA? (finalPerc>=90?'A+':finalPerc>=80?'A':finalPerc>=70?'B+':finalPerc>=60?'B':finalPerc>=50?'C':finalPerc>=33?'D':finalPerc?'E':'') : (g.grade||'');

 var coRows=''; if(coMaster.length>0){ coMaster.forEach(function(cm){ var keyBase = cm.subjectName.replace(/[^A-Za-z]/g,''); var ptVal = oa[keyBase+'_PT1']||oa[cm.subjectName+'_PT1']||oa[cm.subjectName]||''; var hyVal = oa[keyBase+'_HY']||oa[cm.subjectName+'_HY']||''; coRows+='<tr><td class="left">'+cm.subjectName+'</td><td>'+ptVal+'</td><td>'+hyVal+'</td></tr>'; }); } else { coRows='<tr><td class="left">Karbi</td><td>'+(oa.Karbi_PT1||'')+'</td><td>'+(oa.Karbi_HY||'')+'</td></tr><tr><td class="left">Art Education</td><td>'+(oa.Art_PT1||'')+'</td><td>'+(oa.Art_HY||'')+'</td></tr><tr><td class="left">General Knowledge</td><td>'+(oa.GK_PT1||'')+'</td><td>'+(oa.GK_HY||'')+'</td></tr>'; }

 var perRows=''; if(perMaster.length>0){ perMaster.forEach(function(pm){ var clean = pm.subjectName.replace(/[^A-Za-z]/g,''); var ptV = oa[clean+'_PT1']||oa[pm.subjectName+'_PT1']||oa[pm.subjectName]||''; var hyV = oa[clean+'_HY']||oa[pm.subjectName+'_HY']||''; 
   if(!ptV){ for(var k in oa){ if(k.toLowerCase().indexOf(pm.subjectName.toLowerCase().split(' ')[0])>-1 && k.indexOf('PT1')>-1){ ptV=oa[k]; break; } } }
