<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
  <div class="box" style="border-left-color:var(--navy)">
    <div class="title">🗄️ Archive Viewer</div>
    <div class="meta">Old school years, exactly as they were kept by Promotion. Read only – nothing can be changed. Every opening is noted (who and when).</div>
    <div class="chips" id="sessChips" style="margin-top:10px"></div>
    <div class="msg" id="gMsg"></div>
  </div>
  <div id="body"></div>
</div>
<div class="tabs" id="tabsBar">
  <button class="tabBtn active"><span class="tabIco">🗄️</span>Archive</button>
  <button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button>
</div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function goBack(){ location.replace('admin.html?tab=backup'); }
if(USER.role !== 'admin'){ window.location.href = 'index.html'; }
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();
/* S31 (stage 5): pick a session; Fees open the Part 1 copy, Results / Attendance of a class open the Part 2 copy holding that class */
let A = null, CUR = '', CLS = '';
function card(ic, name, line, url, col){ return '<button type="button" class="acard" data-nofb style="--c:' + col + '" onclick="window.location.href=\'' + url + '\'"><span class="ci">' + ic + '</span><span><b>' + esc(name) + '</b><small>' + esc(line) + '</small></span></button>'; }
function aUrl(page, id){ return page + (page.indexOf('?') > -1 ? '&' : '?') + 'arch=' + encodeURIComponent(id) + '&as=' + encodeURIComponent(CUR); }
async function load(){
  show($('gMsg'), 'Loading the archive list...', 'load');
  try{
    let r = await apiGet('archlist', {});
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); return; }
    A = r; hide($('gMsg'));
    if(!r.sessions.length){ $('body').innerHTML = '<div class="box"><div class="empty-note">No archive copies yet.<br>They are made once a year by Students → Promotion / new session (Part 1 and Part 2).</div></div>'; return; }
    let want = new URLSearchParams(location.search).get('s');
    CUR = r.sessions.some(s => s.session === want) ? want : r.sessions[0].session;
    draw();
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check the internet and try again.', 'err'); }
}
function pick(s){ CUR = s; CLS = ''; draw(); }
function pickCls(c){ CLS = c; draw(); }
function draw(){
  $('sessChips').innerHTML = A.sessions.map(s => '<button class="chip' + (s.session === CUR ? ' on' : '') + '" onclick="pick(\'' + esc(s.session) + '\')">Session ' + esc(s.session) + '</button>').join('');
  let s = A.sessions.find(x => x.session === CUR), h = '';
  h += '<div class="box" style="border-left-color:var(--orange)"><div class="title">💰 Fees of ' + esc(CUR) + '</div>';
  if(s.part1) h += '<div class="meta">The year\'s fees as they were when the session was closed (copy made ' + esc(s.part1.madeAt) + ' by ' + esc(s.part1.madeBy) + ').</div>' +
    card('📊', 'Fee Reports', 'Student ledger, dues, collection, bus list', aUrl('fees-reports.html', s.part1.fileId), '#0b2a5c') +
    card('🧾', 'Receipts', 'Find and reprint an old receipt (marked ARCHIVE COPY)', aUrl('fees-receipts.html', s.part1.fileId), '#ef6c00');
  else h += '<div class="note">Part 1 "Start new session" was not run for ' + esc(CUR) + ' yet, so its fees are still in the live sheet: use Fees → Fee Reports / Receipts as usual.</div>';
  h += '</div>';
  h += '<div class="box" style="border-left-color:var(--purple)"><div class="title">🎓 Results and 📅 attendance of ' + esc(CUR) + '</div>';
  if(s.classes.length){
    h += '<div class="meta">Choose the class. Each class opens the copy made just before it was promoted.</div><div class="chips" style="margin-top:8px;flex-wrap:wrap">' +
      s.classes.map(c => '<button class="chip' + (c.cls === CLS ? ' on' : '') + '" onclick="pickCls(\'' + esc(c.cls) + '\')">' + esc(c.cls) + '</button>').join('') + '</div>';
    let c = s.classes.find(x => x.cls === CLS);
    if(c){
      h += '<div class="note">In the page that opens, choose class <b>' + esc(c.cls) + '</b>.</div>' +
        card('🖨️', 'Report cards', 'View / print the report cards of class ' + c.cls, aUrl('report-card.html', c.fileId), '#16a34a') +
        card('📒', 'Exam Register', 'Whole class marks of every exam', aUrl('exam-register.html', c.fileId), '#0b2a5c') +
        card('📈', 'Monthly performance', 'Attendance % of every student, month by month', aUrl('performance.html', c.fileId), '#7c3aed');
    }
  } else h += '<div class="note">No class of ' + esc(CUR) + ' has been promoted yet (Part 2), so its results and attendance are still in the live sheet.</div>';
  h += '</div>';
  $('body').innerHTML = h;
}
load();
</script>
</body></html>
