<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elective Attendance</title>
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:10px}
select,button{padding:10px;width:100%;margin:5px 0}
.student{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}
.present{background:#e6ffe6}
</style>
</head>
<body>
<div class="card">
<h3>Mark Attendance - Elective Aware</h3>
<label>Class</label>
<select id="className"><option>XI-A</option><option>XI-B</option><option>XII</option><option>XII-A</option></select>

<label>Subject</label>
<select id="subject" onchange="loadStudents()">
<option>ENGLISH</option><option>MATHEMATICS</option><option>PHYSICS</option>
<option>HINDI</option><option>IP</option><option>PE</option><option>MM</option><option>HINDI</option>
</select>

<label>Period</label>
<select id="period"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select>

<label>Date</label>
<input type="date" id="date">

<button onclick="loadStudents()" style="background:#2196F3;color:white">Load Students (Elective Filter)</button>
</div>

<div class="card" id="list"></div>
<button onclick="saveAtt()" id="saveBtn" style="background:#4CAF50;color:white;display:none">Save Attendance</button>

<script>
const API = "https://script.google.com/macros/s/AKfycbyzFPIR9-9oGTAI59J-109e_KHn7Cj1UbuvRpYt-X1tnddQVNFy3GtZgKIdS4v50jtG/exec";

document.getElementById('date').valueAsDate = new Date();

let students = [];

function loadStudents(){
  const cls = document.getElementById('className').value;
  const sub = document.getElementById('subject').value;
  document.getElementById('list').innerHTML = "Loading "+sub+" students for "+cls+"...";
  
  fetch(`${API}?action=getStudentsForAttendance&className=${cls}&subject=${sub}`)
    .then(r=>r.json())
    .then(data=>{
      students = data.students || [];
      let html = `<b>${students.length} students found for ${sub} in ${cls}</b><br><small>If ${sub} is elective (HINDI/IP/PE/MM), it shows only that group - not full 40</small><br><br>`;
      students.forEach((s,i)=>{
        html += `<div class="student present" id="row${i}">
          <span>${s.rollNo}. ${s.name} (${s.electiveChoice||''})</span>
          <select id="st${i}"><option value="P">P</option><option value="A">A</option></select>
        </div>`;
      });
      document.getElementById('list').innerHTML = html;
      document.getElementById('saveBtn').style.display = students.length? 'block':'none';
    });
}

function saveAtt(){
  const cls = document.getElementById('className').value;
  const sub = document.getElementById('subject').value;
  const period = document.getElementById('period').value;
  const date = document.getElementById('date').value;
  
  const records = students.map((s,i)=>({
    admissionNo: s.admissionNo,
    name: s.name,
    rollNo: s.rollNo,
    status: document.getElementById('st'+i).value
  }));
  
  fetch(API, {
    method:'POST',
    body: JSON.stringify({action:'saveAttendance', className: cls, subject: sub, periodNo: period, date: date, group: sub, records: records})
  }).then(r=>r.json()).then(d=>{ alert(d.success? "Saved "+d.saved+" students" : d.error); });
}
</script>
</body>
</html>
