<!DOCTYPE html>
<html lang="en"><head><meta name="app-version" content="2026.11.24-S25">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student record</title>
<style>
*{box-sizing:border-box}
:root{--navy:#0b2a5c;--blue:#1976d2;--orange:#ef6c00;--green:#16a34a;--purple:#7c3aed;--red:#c62828;--bg:#eef2f7;--line:#e5e7eb;--text:#111827;--muted:#64748b}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);margin:0;color:var(--text);padding-bottom:96px}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;gap:10px}
.top-left{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:#e3f2fd;color:#0d47a1;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.welcome{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.top-right{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.badge{background:#e8f5e9;color:#14532d;border:1px solid #a5d6a7;padding:5px 10px;border-radius:999px;font-weight:800;font-size:10.5px;min-width:90px;text-align:center}
.btn-logout{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;min-height:34px}
.wrap{max-width:760px;margin:12px auto;padding:0 12px}
.box{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--navy);margin-bottom:12px}
.title{font-size:17px;font-weight:800;color:var(--navy);margin:0 0 6px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.5}
label{font-size:12px;font-weight:700;color:var(--navy);display:block;margin:10px 0 4px}
label .req{color:var(--red)}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;min-height:46px;background:#fff}
textarea{min-height:70px}
input:disabled,select:disabled,textarea:disabled,input[readonly]{background:#f1f5f9;color:#334155}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;min-height:46px;color:#fff;width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.b-blue{background:linear-gradient(135deg,#1976d2,#42a5f5)}.b-green{background:linear-gradient(135deg,#16a34a,#22c55e)}.b-purple{background:linear-gradient(135deg,#7c3aed,#8b5cf6)}.b-navy{background:linear-gradient(135deg,#0b2a5c,#1e4a8f)}.b-orange{background:linear-gradient(135deg,#ef6c00,#fb8c00)}.b-grey{background:#e5e7eb;color:#475569}.b-red{background:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1;min-width:120px}
.msg{padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;margin:10px 0;display:none;line-height:1.45;white-space:pre-line}
.msg.show{display:block}.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}.msg.load{background:#e0f2fe;color:#075985}.msg.warn{background:#fff7ed;color:#9a3412}.msg.info{background:#e0f2fe;color:#075985}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.empty-note{text-align:center;color:var(--muted);padding:22px 10px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;border-left:4px solid var(--blue);margin-bottom:10px;overflow:hidden}
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px;cursor:pointer;min-height:56px;font-weight:800;color:var(--navy);font-size:15px}
.sech small{font-weight:700;color:var(--muted);font-size:11.5px}
.secb{padding:0 14px 14px;display:none}.sec.open .secb{display:block}.sec.open .arr{transform:rotate(90deg)}
.arr{transition:transform .2s;font-size:14px;color:var(--muted)}
h4.g{margin:16px 0 0;color:var(--purple);font-size:13.5px;border-bottom:2px solid var(--line);padding-bottom:3px}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap;display:inline-block}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fff7ed;color:#9a3412}.pill.bad{background:#fee2e2;color:#991b1b}.pill.grey{background:#e5e7eb;color:#374151}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;font-weight:700;color:var(--navy);min-height:40px}.chk input{width:24px;height:24px;min-height:0;flex-shrink:0}
.help{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.fam{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13.5px}
.res{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px}
.res .btn{width:auto;min-width:90px}
.hist{font-size:13px;line-height:1.6;background:#f8fafc;border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
@media(min-width:761px){.tabs{left:50%;transform:translateX(-50%);right:auto;width:min(620px,calc(100% - 24px));bottom:12px;border-radius:999px;border:1px solid var(--line);padding:6px}}
.tabBtn{flex:1;padding:7px 2px 6px;border:none;border-radius:12px;cursor:pointer;background:transparent;font-weight:700;font-size:10.5px;color:#64748b;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;line-height:1.1;min-height:46px}
.tabBtn .tabIco{font-size:20px;line-height:1}.tabBtn.active{background:#e3f2fd;color:var(--blue)}
@media print{body>.top,body>.tabs{display:none!important}}
.gdChips{margin:12px 0 4px}.gdT{font-size:12px;font-weight:800;color:#0b2a5c;margin-bottom:6px}.gdRow{display:flex;gap:6px;flex-wrap:wrap}.gdC{flex:1;min-width:90px;min-height:46px;border:1.5px solid #cbd5e1;background:#fff;border-radius:12px;font-weight:800;color:#334155;cursor:pointer;font-size:13.5px}.gdC.on{background:#1976d2;border-color:#1976d2;color:#fff}.gdLock{background:#f1f5f9!important;color:#475569}
</style><script src="config.js"></script><script src="ui.js"></script><script src="photo.js"></script></head>
<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
  <div class="msg" id="gMsg"></div>
  <div id="main"><div class="empty-note">⏳ Loading...</div></div>
</div>
<div class="tabs"><button class="tabBtn active"><span class="tabIco">📇</span>Record</button><button class="tabBtn" id="tPrint" onclick="printIt('form')"><span class="tabIco">🖨️</span>Print</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div>
<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} try{ sessionStorage.setItem('cvse_flash', JSON.stringify({m:'Session expired. Please login again.', t:Date.now()})); }catch(e){} window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ if(!el) return; el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ if(el) el.className = 'msg'; }
function goBack(){ if(Q.get('new') && !Q.get('class')){ window.location.href = USER.role === 'admin' ? 'admin.html?tab=last' : 'accountant.html'; return; }     // S24 (F19): Add student from the Students tab returns there
  window.location.href = 'students.html' + (R && R.Class ? '?class=' + encodeURIComponent(R.Class) : (Q.get('class') ? '?class=' + encodeURIComponent(Q.get('class')) : '')); }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();

var Q = new URLSearchParams(location.search), ADM = Q.get('adm') || '', ISNEW = !ADM && Q.get('new') === '1';
var D = null, R = null, OPEN = {1:true};
var STATUS_LABEL = {ACTIVE:'Active', LEFT:'Left (TC)', DROPOUT:'Drop out', PASSEDOUT:'Passed out', NEXT:'Joins next session'};
function F(k){ return D.meta.fields.find(f=>f.key===k); }
function req(k){ return D.meta.required.indexOf(k) > -1; }
function printIt(type){
  if(ISNEW || !ADM){ window.open('student-print.html?blank=1', '_blank'); return; }
  window.open('student-print.html?adm=' + encodeURIComponent(ADM) + '&type=' + type, '_blank');
}

async function load(){
  show($('gMsg'), 'Loading the record... please wait', 'load');
  try{
    let r = await apiGet('mrget', ADM ? {adm:ADM} : {});
    if(!r.success){ show($('gMsg'), '❌ ' + (r.error || 'Could not load.'), 'err'); $('main').innerHTML = ''; return; }
    D = r; R = r.record || null; hide($('gMsg'));
    if(ISNEW) drawNew(); else if(R) drawRecord(); else $('main').innerHTML = '<div class="empty-note">No student chosen. Go back and tap a student.</div>';
  }catch(e){ show($('gMsg'), '❌ Could not connect. Check internet and try again.', 'err'); $('main').innerHTML = ''; }
}

/* ---------- one input for a field ---------- */
function opts(list, cur){
  let a = (D.meta.lists[list] || []).filter(o=>!o.hidden || o.v === cur);
  let h = '<option value="">Choose</option>' + a.map(o=>'<option'+(o.v===cur?' selected':'')+'>'+esc(o.v)+'</option>').join('');
  if(cur && !a.some(o=>o.v===cur)) h += '<option selected>'+esc(cur)+'</option>';
  return h;
}
function classOpts(cur){ let h = '<option value="">Choose</option>' + D.classes.map(c=>'<option'+(c===cur?' selected':'')+'>'+esc(c)+'</option>').join(''); if(cur && D.classes.indexOf(cur) < 0) h += '<option selected>'+esc(cur)+'</option>'; return h; }
function input(k, val, ro){
  let f = F(k), id = 'f_' + k, dis = ro ? ' disabled' : '', v = val === undefined ? '' : val;
  let lab = '<label for="'+id+'">'+esc(f.label)+(req(k)?' <span class="req">*</span>':'')+'</label>';
  switch(f.type){
    case 'date': return lab + '<input id="'+id+'" data-date inputmode="numeric" maxlength="10" placeholder="DD-MM-YYYY" value="'+esc(v)+'"'+dis+'>';
    case 'mobile': return lab + '<input id="'+id+'" inputmode="numeric" maxlength="10" placeholder="10 digits" value="'+esc(v)+'"'+dis+' oninput="this.value=this.value.replace(/\\D/g,\'\').substring(0,10)">';
    case 'email': return lab + '<input id="'+id+'" type="email" value="'+esc(v)+'"'+dis+'>';
    case 'area': return lab + '<textarea id="'+id+'" maxlength="'+(f.max||300)+'"'+dis+'>'+esc(v)+'</textarea>';
    case 'list': return lab + '<select id="'+id+'"'+dis+'>'+opts(f.list, v)+'</select>';
    case 'class': return lab + '<select id="'+id+'"'+dis+(k==='Class'?' onchange="clsChange()"':'')+'>'+classOpts(v)+'</select>';
    case 'yesno': return lab + '<select id="'+id+'"'+dis+'><option value="">Choose</option><option value="YES"'+(v==='YES'?' selected':'')+'>Yes</option><option value="NO"'+(v==='NO'?' selected':'')+'>No</option></select>';
    case 'stype': return lab + '<select id="'+id+'"'+dis+'><option value="">Not set (worked out from the admission date)</option><option value="NEW"'+(v==='NEW'?' selected':'')+'>New</option><option value="OLD"'+(v==='OLD'?' selected':'')+'>Old</option></select>';
    case 'year': return lab + '<input id="'+id+'" inputmode="numeric" maxlength="4" placeholder="2026" value="'+esc(v)+'"'+dis+'>';
    case 'status': {
      let show = R ? R.StatusShow : 'ACTIVE', raw = (R && R.Status) || '';
      let h = D.meta.statuses.filter(s=>s[0]!=='NEXT'||show==='NEXT').map(s=>'<option value="'+s[0]+'"'+(s[0]===show?' selected':'')+'>'+esc(s[1])+'</option>').join('');   // S14: 'Joins next session' only through Add student
      if(!STATUS_LABEL[show]) h += '<option value="'+esc(show)+'" selected>'+esc(show)+' (old word, kept)</option>';
      let note = raw && raw.toUpperCase() !== show ? '<div class="help">The sheet has the old word "'+esc(raw)+'". It is kept as it is unless you choose another status.</div>' : '';
      return lab + '<select id="'+id+'"'+dis+'>'+h+'</select>' + note;
    }
    case 'aadhaar': {
      let has = R && R.hasAadhaar;
      return lab + '<input id="'+id+'" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="'+(has?esc(R.Aadhaar)+' (saved) – type 12 digits to change':'12 digits')+'"'+dis+' oninput="this.value=this.value.replace(/[^0-9 ]/g,\'\')">' +
        (has ? '<div class="btnrow"><button class="btn b-grey" type="button" id="aShow" onclick="showAadhaar()">👁 Show the full number (logged)</button></div><div class="msg" id="aMsg"></div>' +
          (ro ? '' : '<label class="chk"><input type="checkbox" id="aClear"> Remove the saved Aadhaar number</label>') : '') +
        '<div class="help">Shown masked everywhere. Never shown in the student app, to teachers, on receipts or report cards.</div>';
    }
    case 'family': return '';
    case 'history': return '';
  }
  return lab + '<input id="'+id+'" maxlength="'+(f.max||100)+'" value="'+esc(v)+'"'+dis+'>';
}
function val(k){ let e = $('f_' + k); return e ? e.value.trim() : undefined; }

/* ---------- Add a new student ---------- */
function drawNew(){
  let c = Q.get('class') || '';
  let keys = addKeys();          // S23 (L9): follows Settings → Student record (daily fields + compulsory fields)
  let h = '<div class="box" style="border-left-color:var(--green)"><div class="title">➕ Add a new student</div><div class="meta">Fill these details now: the basic ones, the ones the daily pages use, and every compulsory field (<span style="color:var(--red)">*</span>). The rest of the record opens after Add.</div>'+
   '<h4 class="g">Admission number</h4>'+
   '<label class="chk"><input type="radio" name="am" id="amAuto" checked onchange="admMode()"> Automatic number (recommended)</label>'+
   '<label class="chk"><input type="radio" name="am" id="amMan" onchange="admMode()"> Type the number myself (for example a higher class in the middle of the year)</label>'+
   '<div id="amAutoBox"><div class="row2"><div><label for="am_year">Year of admission</label><input id="am_year" inputmode="numeric" maxlength="4" value="'+esc(D.yearNow)+'" oninput="if(this.value.length===4)nextNo()"></div><div><label>Next number</label><input id="am_next" readonly value="…"></div></div><div class="help" id="am_help"></div></div>'+
   '<div id="amManBox" style="display:none"><label for="am_no">Admission number</label><input id="am_no" maxlength="30" autocapitalize="characters"><div class="help">A number already used is refused. The number cannot be changed after saving.</div></div>'+
   (D.nextSession ? '<h4 class="g">The child joins</h4>'+
   '<label class="chk"><input type="radio" name="jn" id="jnNow" checked onchange="joinMode()"> Now, in this session</label>'+
   '<label class="chk"><input type="radio" name="jn" id="jnNext" onchange="joinMode()"> In the next session ('+esc(D.nextSession)+') – admission taken early<small>Not in any class list now. Fees of '+esc(D.nextSession)+' can be taken in Collect Fees. Class and roll number are given at the promotion.</small></label>' : '')+
   '<h4 class="g">Student</h4>' + keys.map(k=>{ let v = k==='Class' ? c : ''; return input(k, v, false); }).join('') +
   '<div id="elBox"></div>'+
   '<div class="btnrow"><button class="btn b-green" id="addBtn" onclick="addStu()">Add student</button><button class="btn b-navy" onclick="goBack()">Cancel</button></div><div class="msg" id="addMsg"></div></div>';
  $('main').innerHTML = h; R = {Class:c}; clsChange(); nextNo();
  $('tPrint').querySelector('.tabIco').nextSibling.textContent = 'Blank form';
}
// S23 (L9): always Name, DOB, Class, Roll no, Admission date, Student type + every ticked daily field + every compulsory field
function addKeys(){
  let ok = k => D.meta.fields.some(f => f.key === k && ['family','history'].indexOf(f.type) < 0);
  let keys = ['Name','DOB','Class','RollNo','AdmissionDate','StudentType'];
  (D.daily || []).concat(D.meta.required || []).forEach(k => { if(keys.indexOf(k) < 0 && ok(k)) keys.push(k); });
  return keys.filter(ok);
}
function admMode(){ let man = $('amMan').checked; $('amAutoBox').style.display = man ? 'none' : ''; $('amManBox').style.display = man ? '' : 'none'; }
// S14: admitted now for the next session: no roll number, admission year = the next session's year
function joinMode(){
  let nx = $('jnNext') && $('jnNext').checked, r = $('f_RollNo');
  if(r){ r.disabled = nx; if(nx) r.value = ''; }
  let l = document.querySelector('label[for="f_Class"]'); if(l) l.firstChild.textContent = nx ? 'Class in ' + D.nextSession + ' ' : 'Class ';
  $('am_year').value = nx ? (D.nextYear || D.yearNow) : D.yearNow; nextNo();
}
async function nextNo(){
  let y = $('am_year').value.trim(); $('am_next').value = '…';
  try{ let r = await apiGet('mrnextno', {year:y}); $('am_next').value = r.success ? r.adm : '—'; $('am_help').innerText = r.success ? 'School pattern: ' + r.pattern + '. The number is given when you tap Add (the next free one).' : '⚠️ ' + (r.error || ''); }
  catch(e){ $('am_next').value = '—'; }
}
function elHtml(cls, chosen, ro){
  let g = (D.allGroups || {})[cls] || {}, ks = Object.keys(g); if(!ks.length) return '';
  return '<h4 class="g">Elective subjects</h4><div class="help">You can choose later (also for the whole class in 📚 Elective subjects).</div>' + ks.map(k=>{ let c = (chosen||[]).find(x=>x.group===k); return '<label>'+esc(k)+(c||g[k].length<2?'':' <span class="pill" style="background:#fff7ed;color:#c2410c">Elective not chosen</span>')+'</label><select class="el" data-g="'+esc(k)+'"'+(ro?' disabled':'')+'><option value="">Not chosen yet</option>'+g[k].map(s=>'<option'+(c&&c.subject===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'; }).join('');   // S23 (L11): optional
}
function clsChange(){ let b = $('elBox'); if(b) b.innerHTML = elHtml(val('Class'), D.electives, !D.canEdit); }
function electives(){ return [...document.querySelectorAll('.el')].map(x=>({group:x.dataset.g, subject:x.value})); }
async function addStu(flags){
  if(window.UI && !UI.checkDates(['f_DOB','f_AdmissionDate'])){ show($('addMsg'), '❌ Please correct the dates first.', 'err'); return; }
  let st = {}; addKeys().forEach(k=>{ let v = val(k); if(v !== undefined) st[k] = v; });
  st.AdmissionYear = $('am_year').value.trim();
  let man = $('amMan').checked, b = $('addBtn'), m = $('addMsg');
  b.disabled = true; show(m, 'Saving... please wait', 'load');
  try{
    let r = await apiPost('mradd', Object.assign({student:JSON.stringify(st), admMode:man?'MANUAL':'AUTO', admNo:man?$('am_no').value.trim():'', year:st.AdmissionYear, electives:JSON.stringify(electives()), joins:($('jnNext') && $('jnNext').checked) ? 'NEXT' : ''}, flags || {}));
    if(r.needConfirm){
      b.disabled = false; hide(m);
      let yes = await UI.ask(r.warning + '\n\nSave anyway?', 'Save anyway', false);
      if(yes){ let f = Object.assign({}, flags || {}); if(r.needConfirm === 'SHAPE') f.shapeOk = 1; if(r.needConfirm === 'DUP') f.dupOk = 1; return addStu(f); }
      show(m, 'Not saved. Change the details and tap Add again.', 'warn'); return;
    }
    if(r.success){ show(m, '✅ ' + r.message, 'ok'); setTimeout(()=>{ location.href = 'student-record.html?adm=' + encodeURIComponent(r.adm); }, 1200); return; }
    show(m, '❌ ' + (r.error || 'Could not save.'), 'err');
  }catch(e){ show(m, '❌ Could not connect. Check internet and try again.', 'err'); }
  b.disabled = false;
}

/* ---------- the record: 6 sections ---------- */
function headBox(){
  let st = R.StatusShow, pill = st === 'ACTIVE' ? '<span class="pill ok">Active</span>' : '<span class="pill grey">'+esc(STATUS_LABEL[st] || st)+(st === 'NEXT' && R.JoinSession ? ' ' + esc(R.JoinSession) : '')+'</span>';
  let warn = '';
  if(!D.inMaster) warn += '<div class="msg show warn">This student is not in the master record yet (shown from the current student list). Saving any section adds the record.</div>';
  if(D.missing && D.missing.length) warn += '<div class="msg show warn">Incomplete: '+esc(D.missing.join(', '))+'</div>';
  if(!D.canEdit) warn += '<div class="msg show info">View only. Your login may see but not change student records.</div>';
  let eg = (D.allGroups || {})[R.Class] || {}, noEl = Object.keys(eg).filter(k=>eg[k].length > 1 && !(D.electives||[]).some(x=>x.group===k));
  if(noEl.length && R.StatusShow === 'ACTIVE') warn += '<div class="msg show warn">📚 Elective not chosen: '+esc(noEl.join(', '))+'. Choose it in section 4 (Class) or in 📚 Elective subjects.</div>';   // S23 (L11)
  return '<div class="box"><div class="title">'+esc(R.Name || '(no name)')+'</div><div class="meta">Adm '+esc(R.AdmissionNo)+' · Class '+esc(R.Class || '-')+(R.RollNo?' · Roll '+esc(R.RollNo):'')+' &nbsp;'+pill+'</div>'+warn+
   '<div id="phArea">'+photoArea()+'</div>'+
   '<div class="btnrow"><button class="btn b-purple" onclick="printIt(\'form\')">🖨️ Registration form</button><button class="btn b-navy" onclick="printIt(\'profile\')">🖨️ Student profile</button></div></div>';
}
function secHtml(n){
  let keys = D.meta.fields.filter(f=>f.section===n).map(f=>f.key), ro = !D.canEdit, body = '';
  let miss = (D.missing || []).filter(l=>D.meta.fields.some(f=>f.section===n && f.label===l));
  if(n === 2){
    body = '<h4 class="g">Father</h4>' + ['FatherName','FatherEducation','FatherOccupation','FatherDepartment','FatherMobile'].map(k=>input(k, R[k], ro)).join('') +
           '<h4 class="g">Mother</h4>' + ['MotherName','MotherEducation','MotherOccupation','MotherDepartment','MotherMobile'].map(k=>input(k, R[k], ro)).join('') +
           '<h4 class="g">Guardian (optional)</h4>' + ['GuardianName','GuardianRelation','GuardianEducation','GuardianOccupation','GuardianDepartment','GuardianMobile'].map(k=>input(k, R[k], ro)).join('');
  } else if(n === 3){
    body = input('PermanentAddress', R.PermanentAddress, ro) +
      '<label class="chk"><input type="checkbox" id="f_SameAddressBox"'+(R.SameAddress==='YES'?' checked':'')+(ro?' disabled':'')+' onchange="sameAddr()"> Correspondence address same as permanent</label>'+
      '<div id="corrBox">' + input('CorrespondenceAddress', R.CorrespondenceAddress, ro) + '</div>' +
      input('Phone', R.Phone, ro) + input('PrimaryMobile', R.PrimaryMobile, ro) +
      (ro ? '' : '<label for="pmFrom">Use as primary mobile</label><select id="pmFrom" onchange="pmCopy()"><option value="">Copy a number…</option><option value="Phone">Phone no (family)</option><option value="FatherMobile">Father’s contact</option><option value="MotherMobile">Mother’s contact</option><option value="GuardianMobile">Guardian’s contact</option></select>') +
      input('Email', R.Email, ro) + input('Location', R.Location, ro);
  } else if(n === 4){
    body = '<div class="row2"><div>'+input('Class', R.Class, ro)+'</div><div>'+input('RollNo', R.RollNo, ro)+'</div></div>' + '<div id="elBox"></div>' +
      input('ClassApplied', R.ClassApplied, ro) + '<div class="row2"><div>'+input('AdmissionYear', R.AdmissionYear, ro)+'</div><div>'+input('AdmissionDate', R.AdmissionDate, ro)+'</div></div>' +
      input('StudentType', R.StudentType, ro) + input('Status', R.Status, ro) + '<div class="row2"><div>'+input('StatusDate', R.StatusDate, ro)+'</div><div>'+input('StatusNote', R.StatusNote, ro)+'</div></div>' +
      '<h4 class="g">Brothers and sisters (family)</h4><div id="famBox">'+famHtml()+'</div>' +
      '<h4 class="g">Class history</h4><div class="hist">'+(R.ClassHistory ? R.ClassHistory.split('; ').map(esc).join('<br>') : '—')+'</div>';
  } else body = keys.map(k=>input(k, R[k], ro)).join('');
  return '<div class="sec'+(OPEN[n]?' open':'')+'" id="sec'+n+'"><div class="sech" onclick="tog('+n+')"><span>'+n+'. '+esc(D.meta.sections[n])+(miss.length?' <span class="pill warn">'+miss.length+' missing</span>':'')+'</span><span class="arr">▶</span></div>'+
    '<div class="secb">'+body+(ro?'':'<div class="btnrow"><button class="btn b-green" id="sv'+n+'" onclick="saveSec('+n+')">Save '+esc(D.meta.sections[n])+'</button></div>')+'<div class="msg" id="sm'+n+'"></div></div></div>';
}
function famHtml(){
  let h = '';
  if(R.FamilyID){
    h += '<div class="fam"><b>Family ID '+esc(R.FamilyID)+'</b>' + ((D.family||[]).length ? (D.family||[]).map(x=>'<div>• '+esc(x.name)+' ('+esc(x.adm)+', class '+esc(x.cls||'-')+(x.status!=='ACTIVE'?', '+esc(STATUS_LABEL[x.status]||x.status):'')+')'+(D.canEdit?' <a href="#" onclick="copyFam(\''+esc(x.adm)+'\');return false">copy parents/address</a>':'')+'</div>').join('') : '<div class="help">No other student has this Family ID now.</div>') + '</div>';
    if(D.canEdit) h += '<div class="btnrow"><button class="btn b-grey" id="unl" onclick="unlink()">Unlink from this family</button></div>';
  } else h += '<div class="help">Not linked. Link a brother or sister: the same Family ID is used by the sibling discount in fees.</div>';
  if(D.canEdit) h += '<label for="fq">Find the brother / sister (name, admission no or mobile)</label><div style="display:flex;gap:8px"><input id="fq" style="flex:1;min-width:0" onkeyup="if(event.key===\'Enter\')famFind()"><button class="btn b-blue" style="width:auto;min-width:90px" id="fqb" onclick="famFind()">Search</button></div><div id="fres"></div>';
  return h + '<div class="msg" id="fMsg"></div>';
}
// S16: the parent registration form of this student (student app)
function regBox(){
  let g = D.reg; if(!g) return '';
  let tone = g.status === 'SUBMITTED' ? 'warn' : 'info';
  let h = '<div class="box" style="border-left-color:var(--blue)"><div class="title" style="font-size:15px">📝 Parent registration form</div><div class="msg show '+tone+'">'+esc(g.statusText)+(g.submittedAt && g.status === 'SUBMITTED' ? ' · sent '+esc(g.submittedAt) : '')+(g.decidedAt && g.status !== 'SUBMITTED' ? ' · checked '+esc(g.decidedAt)+(g.decidedBy ? ' by '+esc(g.decidedBy) : '') : '')+'</div>';
  let b = [];
  if(g.status) b.push('<button class="btn '+(g.status === 'SUBMITTED' ? 'b-orange' : 'b-navy')+'" onclick="location.href=\'registration-requests.html?adm='+encodeURIComponent(ADM)+'\'">'+(g.status === 'SUBMITTED' && D.canEdit ? '✅ Check the form' : '👁 Open the form')+'</button>');
  if(D.canEdit && (g.status === 'ACCEPTED' || g.status === 'PARTLY')) b.push('<button class="btn b-grey" id="bRegReo" onclick="regReopen()">🔓 Reopen the form for the parent</button>');
  if(b.length) h += '<div class="btnrow">'+b.join('')+'</div>';
  return h + '<div class="msg" id="regMsg"></div></div>';
}
async function regReopen(){
  if(!(await UI.ask('Open the registration form again for the parent? It starts from the record as it is now.', 'Yes, reopen'))) return;
  let b = $('bRegReo'), m = $('regMsg'); b.disabled = true; show(m, 'Saving... please wait', 'load');
  try{
    let r = await apiPost('regreopen', {adm:ADM});
    if(!r.success){ show(m, '❌ ' + (r.error || 'Could not save.'), 'err'); b.disabled = false; return; }
    D.reg = {status:r.status, statusText:'Reopened for the parent'}; drawRecord(); show($('regMsg'), '✅ ' + r.message, 'ok');
  }catch(e){ show(m, '❌ Could not connect. Nothing was saved. Try again.', 'err'); b.disabled = false; }
}
function delBox(){          // S23 (L6): admin only, for a record made by mistake
  if(USER.role !== 'admin' || !D.canEdit) return '';
  return '<details class="box" style="border-left-color:var(--red)"><summary style="font-weight:800;color:var(--red);cursor:pointer;min-height:40px;display:flex;align-items:center">🗑 Delete this record (only for a mistake)</summary>'+
    '<div class="help" style="margin-top:6px">Only for a record added by mistake (for example a student added twice). A student who already has a fee payment, marks or attendance cannot be deleted: use Status "Left (TC)" or "Drop out" instead.</div>'+
    '<div class="btnrow"><button class="btn b-red" id="delBtn" onclick="delRec()">🗑 Delete '+esc(R.Name || R.AdmissionNo)+'</button></div><div class="msg" id="delMsg"></div></details>';
}
async function delRec(){
  if(!(await UI.ask('Delete the record of '+(R.Name || R.AdmissionNo)+' ('+R.AdmissionNo+') for good? Use this only for a record made by mistake.', 'Yes, delete', true))) return;
  let b = $('delBtn'), m = $('delMsg'); b.disabled = true; show(m, 'Deleting... please wait', 'load');
  try{
    let r = await apiPost('mrdelete', {adm:R.AdmissionNo});
    if(r.success){ show(m, '✅ ' + (r.message || 'Deleted.'), 'ok'); setTimeout(goBack, 1500); return; }
    show(m, '❌ ' + (r.error || 'Could not delete.'), 'err');
  }catch(e){ show(m, '❌ Could not connect. Nothing was deleted. Try again.', 'err'); }
  b.disabled = false;
}
function drawRecord(){
  let h = headBox() + regBox(); for(let n = 1; n <= 6; n++) h += secHtml(n);
  h += delBox();
  $('main').innerHTML = h;
  clsChange();
  sameAddr(true); gdInit('f_');
  photoLoad();
}
/* ---------- S17: the student's photo (one photo, used everywhere) ---------- */
var PH_URL = '', PH_FOR = '';
function photoArea(){
  let p = D.photo || {has:false};
  let info = p.has ? 'Photo taken <b>'+esc(p.date)+'</b>'+(p.by?' by '+esc(p.by):'')+(p.old?' <span class="pill grey">from '+esc(p.session)+'</span>':'') : 'No photo yet.';
  let btns = '';
  if(p.canAdd) btns += '<button class="btn b-blue" id="phCam" onclick="phTake(true)">📷 Take photo</button><button class="btn b-grey" id="phGal" onclick="phTake(false)">🖼 Choose from gallery</button>';
  if(p.canRemove && p.has) btns += '<button class="btn b-red" id="phDel" onclick="phRemove()">🗑 Remove photo</button>';
  if(p.canAdd) btns += '<button class="btn b-navy" id="phCard" data-nofb onclick="window.open(\'idcards.html?adm=\'+encodeURIComponent(ADM),\'_blank\')">🪪 Print ID card</button>';
  return '<div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div id="phBox">'+PHOTO.box(p.has ? PH_URL : '')+'</div><div style="min-width:0;flex:1"><div class="meta" id="phInfo">'+info+'</div>'+
    (p.has && !PH_URL ? '<div class="help" id="phLoad">Loading the photo…</div>' : '')+(p.canAdd ? '<div class="help">The same photo is used on the report card, ID card, prints and the student app.</div>' : '')+'</div></div>'+
    (btns ? '<div class="btnrow">'+btns+'</div>' : '')+'<div class="msg" id="phMsg"></div>';
}
function photoRedraw(){ let a = $('phArea'); if(a) a.innerHTML = photoArea(); }
async function photoLoad(){
  if(!D.photo || !D.photo.has || (PH_URL && PH_FOR === ADM)) return;
  try{
    let r = await apiGet('photoget', {adms:ADM});
    let u = r.success ? (r.photos[ADM] || r.photos[ADM.toUpperCase()] || '') : '';
    PH_URL = u; PH_FOR = ADM; photoRedraw();
    if(!u){ let l = $('phInfo'); if(l) l.innerHTML += '<br><span style="color:#9a3412">The photo file could not be opened. Take the photo again.</span>'; }
  }catch(e){ let l = $('phLoad'); if(l) l.innerText = 'The photo could not be loaded (internet).'; }
}
async function phTake(camera){
  let file = await PHOTO.choose(camera); if(!file) return;
  PHOTO.open({file:file, title:'Photo of ' + (R.Name || ADM), sub:'Adm ' + ADM + ' · Class ' + (R.Class || '-'), onSave:async function(data, kb, url){
    let r = await apiPost('photosave', {adm:ADM, data:data});
    if(!r.success) return {ok:false, msg:'❌ ' + (r.error || 'The photo was not saved.')};
    PH_URL = url; PH_FOR = ADM;
    D.photo = Object.assign({}, r.photo, {canAdd:D.photo.canAdd, canRemove:D.photo.canRemove});
    photoRedraw(); show($('phMsg'), r.message || '✅ Photo saved.', 'ok');
    return {ok:true};
  }});
}
async function phRemove(){
  if(!(await UI.ask('Remove the photo of ' + (R.Name || ADM) + '? The photo box becomes empty. The file is moved to "Old photos" in Drive (not deleted).', 'Yes, remove', true))) return;
  try{
    let r = await apiPost('photoremove', {adm:ADM});
    if(!r.success){ show($('phMsg'), '❌ ' + (r.error || 'Could not remove.'), 'err'); return; }
    PH_URL = ''; D.photo = Object.assign({}, D.photo, {has:false, date:'', by:'', session:'', old:false});
    photoRedraw(); show($('phMsg'), r.message, 'ok');
  }catch(e){ show($('phMsg'), '❌ Could not connect. Check internet and try again. Nothing was changed.', 'err'); }
}
function tog(n){ OPEN[n] = !OPEN[n]; $('sec'+n).classList.toggle('open', !!OPEN[n]); if(n === 4 && OPEN[n]) clsChange(); }
function sameAddr(first){ let c = $('f_SameAddressBox'); if(!c) return; $('corrBox').style.display = c.checked ? 'none' : ''; }
function pmCopy(){ let k = $('pmFrom').value; if(!k) return; let v = val(k); if(!v){ show($('sm3'), 'That number is empty. Fill it first (section 2 for parents).', 'warn'); $('pmFrom').value=''; return; } $('f_PrimaryMobile').value = v; $('pmFrom').value=''; }
async function showAadhaar(){
  let b = $('aShow'), m = $('aMsg'); b.disabled = true; show(m, 'Opening... please wait', 'load');
  try{ let r = await apiGet('mraadhaar', {adm:ADM}); if(r.success){ show(m, 'Aadhaar: ' + r.aadhaar + '  (this Show was written in the log)', 'ok'); setTimeout(()=>hide(m), 20000); } else show(m, '❌ ' + (r.error || 'Could not open.'), 'err'); }
  catch(e){ show(m, '❌ Could not connect. Try again.', 'err'); }
  b.disabled = false;
}
async function saveSec(n, flags){
  let m = $('sm'+n), b = $('sv'+n);
  let dates = D.meta.fields.filter(f=>f.section===n && f.type==='date').map(f=>'f_'+f.key).filter(id=>$(id));
  if(window.UI && dates.length && !UI.checkDates(dates)){ show(m, '❌ Please correct the dates first.', 'err'); return; }
  let data = {};
  D.meta.fields.filter(f=>f.section===n && f.type!=='family' && f.type!=='history').forEach(f=>{ let v = val(f.key); if(v !== undefined) data[f.key] = v; });
  if(n === 3){ data.SameAddress = $('f_SameAddressBox').checked ? 'YES' : 'NO'; if(data.SameAddress === 'YES') data.CorrespondenceAddress = data.PermanentAddress; }
  if(n === 1 && data.Aadhaar !== undefined) data.Aadhaar = data.Aadhaar.replace(/\s/g, '');
  let payload = Object.assign({adm:ADM, section:n, data:JSON.stringify(data)}, flags || {});
  if(n === 1 && $('aClear') && $('aClear').checked){ payload.clearAadhaar = 1; data.Aadhaar = ''; payload.data = JSON.stringify(data); }
  if(n === 4 && document.querySelector('.el')) payload.electives = JSON.stringify(electives());
  b.disabled = true; show(m, 'Saving... please wait', 'load');
  try{
    let r = await apiPost('mrsave', payload);
    if(r.needConfirm === 'ROLLREASON'){                         // S14: roll numbers locked since the promotion (admin + reason)
      b.disabled = false; hide(m);
      let why = await UI.prompt(r.warning);
      if(why && why.trim().length >= 3) return saveSec(n, Object.assign({}, flags || {}, {rollReason:why.trim()}));
      show(m, 'Not saved. A reason of at least 3 letters is needed to change a locked roll number.', 'warn'); return;
    }
    if(r.needConfirm){
      b.disabled = false; hide(m);
      let link = (r.dups || []).find(x=>x.kind === 'MOBILE');
      let yes = await UI.ask(r.warning + '\n\nSave anyway?', 'Save anyway', false);
      if(yes){ await saveSec(n, Object.assign({}, flags || {}, {dupOk:1})); if(link && !R.FamilyID) offerLink(link); return; }
      show(m, 'Not saved. Change the details and tap Save again.', 'warn'); return;
    }
    if(r.success){
      R = r.record; D.missing = r.missing || []; D.inMaster = true;
      let keepOpen = Object.assign({}, OPEN); drawRecord(); OPEN = keepOpen;
      show($('sm'+n), '✅ ' + r.message, 'ok'); return;
    }
    show(m, '❌ ' + (r.error || 'Could not save.'), 'err');
  }catch(e){ show(m, '❌ Could not connect. Check internet and try again.', 'err'); }
  b.disabled = false;
}
async function offerLink(x){
  if(await UI.ask('Link this student with ' + x.text.replace(/^Same mobile number as /, '').replace(/\. Brother.*$/, '') + ' as brother / sister?', 'Link family', false)) doLink(x.adm);
}
async function famFind(){
  let q = $('fq').value.trim(), out = $('fres'); if(!q){ out.innerHTML = '<div class="help">Type a name, admission number or mobile.</div>'; return; }
  out.innerHTML = '<div class="help">Searching…</div>';
  try{
    let r = await apiGet('mrfind', {q:q, exclude:ADM});
    if(!r.success){ out.innerHTML = '<div class="help">❌ '+esc(r.error||'Could not search.')+'</div>'; return; }
    out.innerHTML = r.students.length ? r.students.map(s=>'<div class="res"><div><b>'+esc(s.name)+'</b><div class="help">Adm '+esc(s.adm)+' · Class '+esc(s.cls||'-')+(s.status!=='ACTIVE'?' · '+esc(STATUS_LABEL[s.status]||s.status):'')+(s.familyId?' · Family '+esc(s.familyId):'')+'</div></div><button class="btn b-green" onclick="doLink(\''+esc(s.adm)+'\')">Link</button></div>').join('') + (r.more?'<div class="help">More found: type more letters.</div>':'') : '<div class="help">Nobody found.</div>';
  }catch(e){ out.innerHTML = '<div class="help">❌ Could not connect.</div>'; }
}
async function doLink(to){
  let m = $('fMsg'); show(m, 'Linking... please wait', 'load');
  try{
    let r = await apiPost('mrfamily', {adm:ADM, linkTo:to});
    if(!r.success){ show(m, '❌ ' + (r.error || 'Could not link.'), 'err'); return; }
    await reload(4);
    show($('fMsg'), '✅ ' + r.message, 'ok');
    if(await UI.ask('Copy parents, address and phone from the brother / sister? Only EMPTY fields of this student are filled.', 'Copy', false)) copyFam(to);
  }catch(e){ show(m, '❌ Could not connect. Try again.', 'err'); }
}
async function unlink(){
  if(!(await UI.ask('Remove this student from the family (sibling discount stops for this student)?', 'Unlink', false))) return;
  let m = $('fMsg'); show(m, 'Saving... please wait', 'load');
  try{ let r = await apiPost('mrfamily', {adm:ADM, unlink:1}); if(r.success){ await reload(4); show($('fMsg'), '✅ ' + r.message, 'ok'); } else show(m, '❌ ' + (r.error || 'Could not save.'), 'err'); }
  catch(e){ show(m, '❌ Could not connect. Try again.', 'err'); }
}
async function copyFam(from){
  let m = $('fMsg'); show(m, 'Copying... please wait', 'load');
  try{ let r = await apiPost('mrcopyfamily', {adm:ADM, from:from}); if(r.success){ await reload(4); show($('fMsg'), '✅ ' + r.message, r.copied ? 'ok' : 'warn'); } else show(m, '❌ ' + (r.error || 'Could not copy.'), 'err'); }
  catch(e){ show(m, '❌ Could not connect. Try again.', 'err'); }
}
async function reload(openSec){
  let r = await apiGet('mrget', {adm:ADM});
  if(r.success){ D = r; R = r.record; if(openSec) OPEN[openSec] = true; drawRecord(); }
}
load();

/* S23 (L14): "Guardian is: Father · Mother · Other person" – Father / Mother copies their details into the guardian fields */
var GD = {}, GD_K = ['Name','Education','Occupation','Department','Mobile'];
function gdInit(px){
  var gn = document.getElementById(px + 'GuardianName'); if(!gn || gn.disabled || document.getElementById(px + 'gdChips')) return;
  var lab = document.querySelector('label[for="' + px + 'GuardianName"]'); if(!lab) return;
  var d = document.createElement('div'); d.id = px + 'gdChips'; d.className = 'gdChips';
  d.innerHTML = '<div class="gdT">Guardian is</div><div class="gdRow">' + [['F','👨 Father'],['M','👩 Mother'],['O','🧑 Other person']].map(function(x){ return '<button type="button" data-nofb class="gdC" data-m="' + x[0] + '" onclick="gdPick(\'' + px + '\',\'' + x[0] + '\')">' + x[1] + '</button>'; }).join('') + '</div>';
  lab.parentNode.insertBefore(d, lab);
  var g = function(id){ var e = document.getElementById(px + id); return e ? e.value.trim() : ''; };
  var rel = g('GuardianRelation').toUpperCase(), nm = g('GuardianName').toUpperCase(), m = '';
  if(rel === 'FATHER' && (!nm || nm === g('FatherName').toUpperCase())) m = 'F';
  else if(rel === 'MOTHER' && (!nm || nm === g('MotherName').toUpperCase())) m = 'M';
  else if(nm) m = 'O';
  ['Father','Mother'].forEach(function(w){ GD_K.forEach(function(k){ var e = document.getElementById(px + w + k); if(e) e.addEventListener('input', function(){ gdCopy(px); }); }); });
  gdPick(px, m, true);
}
function gdPick(px, m, first){
  var was = GD[px]; GD[px] = m;
  document.querySelectorAll('#' + px + 'gdChips .gdC').forEach(function(b){ b.classList.toggle('on', b.dataset.m === m); });
  var lock = m === 'F' || m === 'M';
  GD_K.concat(['Relation']).forEach(function(k){ var e = document.getElementById(px + 'Guardian' + k); if(e){ e.readOnly = lock; e.classList.toggle('gdLock', lock); } });
  if(lock) gdCopy(px);
  else if(!first && m === 'O' && (was === 'F' || was === 'M')) GD_K.concat(['Relation']).forEach(function(k){ var e = document.getElementById(px + 'Guardian' + k); if(e) e.value = ''; });
}
function gdCopy(px){
  var m = GD[px]; if(m !== 'F' && m !== 'M') return;
  var w = m === 'F' ? 'Father' : 'Mother';
  GD_K.forEach(function(k){ var s = document.getElementById(px + w + k), e = document.getElementById(px + 'Guardian' + k); if(s && e) e.value = s.value; });
  var r = document.getElementById(px + 'GuardianRelation'); if(r) r.value = w;
}
