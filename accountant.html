<title>Fees Office</title>
<style>

.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#fee2e2;color:#991b1b}.dchip.l{background:#fff3e0;color:#9a3412}.dchip.u{background:#ede9fe;color:#5b21b6}

#login h1{margin:8px 0 2px;font-size:20px;color:var(--navy);text-align:center}

  .wrap{margin:0;padding:0;max-width:none}
}
.hcard{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #eef0f3;margin-bottom:12px}
.hcard h3{margin:0 0 8px;font-size:15px}
.hrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid #f1f5f9;font-size:13.5px;line-height:1.4}
.hrow:first-of-type{border-top:none}.hrow .ic{flex-shrink:0;width:22px;text-align:center}
.hbig{font-size:26px;font-weight:900;color:#0b2a5c;line-height:1.1}
.hmut{color:#64748b;font-size:12.5px;font-weight:600}
.hchip{display:inline-block;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin:3px 4px 0 0}
.hwarn{color:#9a3412}.hgood{color:#166534}.herr{color:#b91c1c}

.mo{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}.mo label{margin:0;border:1px solid #cbd5e1;border-radius:999px;padding:0 10px;min-height:36px;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;background:#fff}.mo input{width:auto;min-height:0}
h3.g{margin:14px 0 4px;color:var(--navy);font-size:14px;border-bottom:2px solid var(--line);padding-bottom:3px}

.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#e0f2fe;color:#075985;white-space:nowrap}
.pill.n{background:#dcfce7;color:#166534}.pill.o{background:#e5e7eb;color:#374151}.pill.d{background:#fee2e2;color:#991b1b}.pill.g{background:#dcfce7;color:#166534}
.srow{background:#fff;border-radius:14px;padding:12px;border:1px solid #eef0f3;border-left:5px solid var(--blue);margin-bottom:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.srow b{color:var(--navy)}.srow .l2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ft{width:100%;border-collapse:collapse;font-size:12.5px}.ft th,.ft td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right}.ft th{background:#eef2f7;color:var(--navy);font-size:11.5px}.ft td:first-child,.ft th:first-child,.ft td:nth-child(2),.ft th:nth-child(2){text-align:left}
.ft tr.tot td{font-weight:900;border-top:2px solid var(--navy)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.big div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.big b{display:block;font-size:18px;color:var(--navy)}.big span{font-size:11px;color:var(--muted);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;font-weight:700;color:var(--navy)}.chk input{width:22px;height:22px;min-height:0}
.msg.load::before{content:"";display:inline-block;width:14px;height:14px;border:3px solid #075985;border-top-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-2px;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}

.mini{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}

.row3 input[type=checkbox]{width:24px;height:24px;min-height:0}.row3 .amt{min-height:42px;padding:6px;text-align:right;font-size:15px}

<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
 <div class="box"><div class="title" id="hi">Fees Office</div><div class="meta" id="sub">Loading your permissions... please wait</div></div>
 <div class="msg" id="gMsg"></div>
 <div id="today"></div>
 <div id="homeCards"></div>
 <div class="big2" id="cards"></div>
</div>
<div class="tabs" id="tabsBar"><button class="tabBtn active"><span class="tabIco">💰</span>Fees</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div><script>
const WEB_URL = "https://script.google.com/macros/s/AKfycbyNYyNG5RYxe6tjztXsVbKEAkstJBNYmfwLWZvIqkPouFQsEOsovL-HPmb-KQ82_0NS/exec";
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();



var CARDS = [
 ['COLLECT','💵','Collect Fees','Take payment and print the receipt','fees-collect.html'],
 ['COLLECT','🧾','Receipts','Day book, reprint, cancel','fees-receipts.html'],
 ['STUDENTS','👨‍👩‍👧','Student Fee Setup','Concessions, bus, siblings, previous dues','fees-students.html'],
 ['OPENING','✅','Already Paid','Start the app in the middle of a session','fees-opening.html'],
 ['SETTINGS','⚙️','Fees Settings','Heads, amounts, due dates, receipt look','fees-settings.html'],
 ['REPORTS','📊','Fee Reports','Daily, head-wise, dues, defaulters, ledger','fees-reports.html'],
 ['STUDENTDB','🎓','Students','Add and edit student details','students.html'],
 ['STUDPW','🔑','Student Passwords','Reset a student\'s app password','student-access.html'],
 ['ATTENDANCE','✅','Attendance','Mark and see attendance','daily.html?tab=att'],
 ['ATTENDANCE','📈','Monthly Performance','Attendance and test report of a class','performance.html'],
 ['DAILY','🗂️','Daily Updates','Lessons, homework and notices','daily.html'],
 ['TIMETABLE','🗓️','Timetable','Build and print the timetable','timetable-builder.html'],
 ['CALENDAR','📅','School Calendar','Holidays, exams, programs, meetings','events.html'] ];
function rs(n){ return '₹' + (Math.round((Number(n)||0) * 100) / 100).toLocaleString('en-IN'); }

function hMoney(n,d){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function withTimeout(p, ms){ return new Promise(function(res, rej){ var t = setTimeout(function(){ rej(new Error('TIMEOUT')); }, ms); p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); }); }); }
function hErr(h,k){ return h.errors && h.errors[k] ? '<div class="hrow"><span class="ic">⚠️</span><span class="herr">Could not load this card: '+esc(h.errors[k])+'</span></div>' : ''; }
async function loadHome(me){
  try{
    let h = await withTimeout(apiGet('homesummary',{}), 60000);
    if(!h.success){
      if(me.privileges.indexOf('COLLECT') > -1){ let t = await apiGet('feereceipts',{}); if(t.success){ let s = t.summary; $('today').innerHTML = '<div class="box" style="border-left-color:var(--green)"><div class="title">Today’s collection</div><div class="big"><div><b>'+rs(s.total)+'</b><span>'+s.count+' receipts</span></div><div><b>'+Object.keys(s.byMode).map(k=>esc(k)+' '+rs(s.byMode[k])).join('<br>')+(Object.keys(s.byMode).length?'':'—')+'</b><span>By payment mode</span></div></div></div>'; } }
      return;
    }
    let out = '';
    if(h.noSchool) out += '<div class="box" style="background:#fff7ed;border:1.5px solid #fdba74;font-weight:700">🏖️ No school today: '+esc(h.noSchool)+'</div>';
    if(h.collection){
      let c = h.collection, d = c.decimals || 0, modes = Object.keys(c.byMode || {}).map(k=>'<span class="hchip">'+esc(k)+' '+hMoney(c.byMode[k],d)+'</span>').join('');
      out += '<div class="hcard"><h3>💵 Today’s collection</h3><div class="hbig">'+hMoney(c.total,d)+'</div><div class="hmut">'+c.count+' receipt'+(c.count===1?'':'s')+(c.cancelled?' · '+c.cancelled+' cancelled':'')+'</div>'+(modes?'<div>'+modes+'</div>':'')+'</div>';
    } else if(h.errors && h.errors.collection) out += '<div class="hcard"><h3>💵 Today’s collection</h3>'+hErr(h,'collection')+'</div>';
    let a = h.attention, rows = '';
    if(a){
      if(a.attendance) rows += a.attendance.skipped ? '<div class="hrow"><span class="ic">✅</span><span class="hmut">Attendance: not needed ('+esc(a.attendance.skipped)+')</span></div>' : (a.attendance.missing.length ? '<div class="hrow"><span class="ic">⚠️</span><span class="hwarn"><b>Attendance not marked:</b> '+a.attendance.missing.map(esc).join(', ')+'</span></div>' : '<div class="hrow"><span class="ic">✅</span><span class="hgood">Attendance marked for all '+a.attendance.total+' classes</span></div>');
      if(a.daily) rows += a.daily.skipped ? '<div class="hrow"><span class="ic">✅</span><span class="hmut">Daily update: not needed ('+esc(a.daily.skipped)+')</span></div>' : (a.daily.missing.length ? '<div class="hrow"><span class="ic">⚠️</span><span class="hwarn"><b>Daily update not published:</b> '+a.daily.missing.map(esc).join(', ')+'</span></div>' : '<div class="hrow"><span class="ic">✅</span><span class="hgood">Daily update published for all '+a.daily.total+' classes</span></div>');
      if(a.locked && a.locked.on) rows += '<div class="hrow" id="homeLockRow"><span class="ic">🔒</span><span class="hmut">Checking students locked for unpaid fees...</span></div>';
    }
    rows += hErr(h,'attention');
    if(rows) out += '<div class="hcard"><h3>📌 Needs attention</h3>'+rows+'</div>';
    if(h.birthdays){
      let b = h.birthdays, list = b.list || [], bh = '';
      if(b.missingColumn) bh = '<div class="hrow"><span class="ic">ℹ️</span><span class="hmut">Add a DOB column in the Students sheet to see birthdays.</span></div>';
      else if(!list.length) bh = '<div class="hrow"><span class="ic">🎂</span><span class="hmut">No birthdays in the next '+(b.withinDays||7)+' days.</span></div>';
      else bh = list.map(x=>'<div class="hrow"><span class="ic">'+(x.days===0?'🎉':'🎂')+'</span><span><b>'+esc(x.name)+'</b> · Class '+esc(x.cls)+'<br><span class="hmut">'+(x.days===0?'Today':(x.days===1?'Tomorrow':'In '+x.days+' days, '+esc(x.date)))+' · turns '+x.turns+'</span></span></div>').join('')+(b.more?'<div class="hmut">and more...</div>':'');
      out += '<div class="hcard"><h3>🎂 Birthdays</h3>'+bh+'</div>';
    } else if(h.errors && h.errors.birthdays) out += '<div class="hcard"><h3>🎂 Birthdays</h3>'+hErr(h,'birthdays')+'</div>';
    if(h.events){
      out += '<div class="hcard"><h3>📅 Coming up</h3>'+(h.events.length ? h.events.map(e=>'<div class="hrow"><span class="ic">📅</span><span><b>'+esc(e.title)+'</b><br><span class="hmut">'+(e.today?'On now · ':'')+esc(e.date)+(e.endDate&&e.endDate!==e.date?' to '+esc(e.endDate):'')+(e.time?' · '+esc(e.time):'')+(e.classes?' · '+esc(e.classes):'')+'</span></span></div>').join('') : '<div class="hrow"><span class="ic">📅</span><span class="hmut">Nothing in the next 14 days.</span></div>')+'</div>';
    } else if(h.errors && h.errors.eventsList) out += '<div class="hcard"><h3>📅 Coming up</h3>'+hErr(h,'eventsList')+'</div>';
    $('homeCards').innerHTML = out;
    fillLocked();
  }catch(e){ /* the cards above still work; the home cards are optional */ }
}
async function fillLocked(){
  let el = document.getElementById('homeLockRow'); if(!el) return;
  try{
    let r = await withTimeout(apiGet('homelocked',{}), 90000);
    if(!r || !r.success){ el.innerHTML = '<span class="ic">⚠️</span><span class="hmut">Could not count the locked students.</span>'; return; }
    if(!r.on){ el.remove(); return; }
    el.innerHTML = '<span class="ic">🔒</span><span><b>'+r.locked+'</b> student'+(r.locked===1?'':'s')+' locked out of the Result tab for unpaid fees'+(r.unlocked?' · '+r.unlocked+' unlocked for some days':'')+'</span>';
  }catch(e){ el.innerHTML = '<span class="ic">⚠️</span><span class="hmut">'+(e && e.message==='TIMEOUT' ? 'Counting is taking too long.' : 'Could not count the locked students.')+'</span>'; }
}
async function init(){
  show($('gMsg'),'Loading... please wait','load');
  try{
    let r = await apiGet('feeme',{});
    if(!r.success){ show($('gMsg'),'❌ '+(r.error||'Could not load.'),'err'); return; }
    hide($('gMsg'));
    $('hi').innerText = (r.school || 'School') + ' — Fees Office'; $('sub').innerText = 'Session ' + (r.session || '-') + '. You can open the pages below.';
    let mine = CARDS.filter(c=>r.privileges.indexOf(c[0]) > -1);
    $('cards').innerHTML = mine.length ? mine.map(c=>'<div class="go'+(c[4]?'':' closed')+'" onclick="'+(c[4]?'window.location.href=\''+c[4]+'\'':'')+'"><span class="ic">'+c[1]+'</span>'+esc(c[2])+'<small>'+esc(c[3])+'</small></div>').join('') : '<div class="empty-note" style="grid-column:1/3">No fee page is switched on for you yet. Please ask the admin.</div>';
    loadHome(r);
  }catch(e){ show($('gMsg'),'❌ Could not connect. Check internet and try again.','err'); }
}
init();
</script>
</body></html>
