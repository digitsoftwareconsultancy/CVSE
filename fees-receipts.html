<body>
<div class="top">
  <div class="top-left">
    <div class="avatar" id="avatarLetter">A</div>
    <div style="min-width:0"><div class="welcome" id="wName">Welcome</div><div class="sub" id="wSub">Username: -</div></div>
  </div>
  <div class="top-right">
    <div class="badge" id="roleBadge">ADMIN</div>
    <button class="btn-logout" onclick="doLogout()">Logout</button>
  </div>
</div>
<div class="wrap">
 <div class="box"><div class="title">Receipts</div><div class="meta">Day book. Tap Print to reprint. Cancelled receipts stay in the list.</div>
  <div class="row2"><div><label>Date</label><input id="dt" inputmode="numeric" maxlength="10" oninput="maskD(this)" placeholder="DD-MM-YYYY"></div><div><label>Search (no, name, adm)</label><input id="q" placeholder="Search"></div></div>
  <div class="btnrow"><button class="btn b-blue" onclick="load()">Show</button><button class="btn b-navy" onclick="$('dt').value='';$('q').value='';load('ALL')">All dates</button></div></div>
 <div class="msg" id="gMsg"></div>
 <div id="sumBox"></div>
 <div id="list"></div>
</div>
<div class="modal" id="cm"><div class="mb"><div class="title">Cancel receipt <span id="cNo"></span></div><div class="meta">The amount becomes unpaid again. The receipt number is not used again.</div><label>Reason (required)</label><input id="cWhy" maxlength="120" placeholder="Why is it cancelled?"><div class="msg" id="cMsg"></div><div class="btnrow"><button class="btn b-red" id="cBtn" style="background:var(--red)" onclick="doCancel()">Cancel receipt</button><button class="btn b-navy" onclick="$('cm').classList.remove('on')">Keep it</button></div></div></div>
<div class="tabs" id="tabsBar"><button class="tabBtn" onclick="window.location.href='fees-collect.html'"><span class="tabIco">💵</span>Collect</button><button class="tabBtn active"><span class="tabIco">🧾</span>Receipts</button><button class="tabBtn" onclick="goBack()"><span class="tabIco">⬅️</span>Back</button></div><script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html?tab=last' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}
$('wName').innerText = 'Welcome, ' + (USER.name || 'User'); $('wSub').innerText = 'Username: ' + USER.username;
$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();



var CAN = false, CUR = null;
function rs(n){ return '₹' + (Math.round((Number(n)||0) * 100) / 100).toLocaleString('en-IN'); }
async function load(all){
  let d = all === 'ALL' ? 'ALL' : $('dt').value.trim(), q = $('q').value.trim();
  show($('gMsg'),'Loading receipts... please wait','load'); $('list').innerHTML = '<div class="empty-note">⏳ Loading...</div>';
  try{
    if(!CUR){ let me = await apiGet('feeme',{}); CAN = me.success && me.privileges.indexOf('CANCEL') > -1; CUR = me.success ? me : {}; }
    let p = {q:q}; if(d) p.date = d;
    let r = await apiGet('feereceipts',p);
    if(!r.success){ show($('gMsg'),'❌ '+(r.error||'Could not load.'),'err'); $('list').innerHTML=''; return; }
    hide($('gMsg')); if(!$('dt').value && r.date !== 'ALL') $('dt').value = r.date;
    let s = r.summary;
    $('sumBox').innerHTML = '<div class="box" style="border-left-color:var(--green)"><div class="title">'+(r.date==='ALL'?'All dates':esc(r.date))+'</div><div class="big"><div><b>'+rs(s.total)+'</b><span>'+s.count+' receipts</span></div><div><b>'+(Object.keys(s.byMode).map(k=>esc(k)+' '+rs(s.byMode[k])).join('<br>')||'—')+'</b><span>By payment mode'+(s.cancelled?' · '+s.cancelled+' cancelled':'')+'</span></div></div></div>';
    $('list').innerHTML = r.receipts.length ? r.receipts.map(x=>'<div class="srow" style="cursor:default;border-left-color:'+(x.status==='CANCELLED'?'#94a3b8':'var(--green)')+'"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+esc(x.no)+' · '+esc(x.name)+'</b><span class="pill '+(x.status==='CANCELLED'?'o':'g')+'">'+(x.status==='CANCELLED'?'CANCELLED':rs(x.total))+'</span></div><div class="meta">'+esc(x.date)+(x.time?' '+esc(x.time):'')+' · Class '+esc(x.cls)+' · Adm '+esc(x.adm)+' · '+esc(x.mode)+' · by '+esc(x.by)+(r.date==='ALL'?' · '+esc(x.session):'')+'</div>'+(x.reason?'<div class="meta">Reason: '+esc(x.reason)+'</div>':'')+
      '<div class="btnrow" style="margin-top:8px"><button class="btn b-blue" onclick="window.location.href=\'fees-receipt.html?no='+encodeURIComponent(x.no)+'&s='+encodeURIComponent(x.session)+'\'">🖨 Print</button>'+(CAN&&x.status!=='CANCELLED'?'<button class="btn" style="background:var(--red)" onclick="askCancel(\''+esc(x.no)+'\',\''+esc(x.session)+'\')">Cancel</button>':'')+'</div></div>').join('')+(r.more?'<div class="meta">Showing the latest 200. Use the date or search to narrow down.</div>':'') : '<div class="empty-note">No receipts found.</div>';
  }catch(e){ show($('gMsg'),'❌ Could not connect. Check internet and try again.','err'); $('list').innerHTML=''; }
}
var CNO = '', CSES = '';
function askCancel(no, ses){ CNO = no; CSES = ses; $('cNo').innerText = no; $('cWhy').value = ''; hide($('cMsg')); $('cm').classList.add('on'); }
async function doCancel(){
  let b = $('cBtn'); b.disabled = true; show($('cMsg'),'Cancelling... please wait','load');
  try{
    let r = await apiPost('feecancel',{no:CNO,session:CSES,reason:$('cWhy').value});
    if(r.success){ $('cm').classList.remove('on'); await load($('dt').value ? '' : 'ALL'); show($('gMsg'),'✅ '+r.message,'ok'); }
    else show($('cMsg'),'❌ '+(r.error||'Could not cancel.'),'err');
  }catch(e){ show($('cMsg'),'❌ Could not connect. Nothing was changed. Try again.','err'); }
  b.disabled = false;
}
load();
</script>
</body></html>
