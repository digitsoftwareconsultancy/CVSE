<script>
const WEB_URL = (window.CVSE_CONFIG && window.CVSE_CONFIG.WEB_URL) || ""; if(!WEB_URL){ document.addEventListener("DOMContentLoaded", function(){ var d=document.createElement("div"); d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fee2e2;border:2px solid #c62828;color:#7f1d1d;border-radius:12px;padding:14px;font:700 14px Arial"; d.textContent="Setup file (config.js) is missing or empty. Reload the page. If it still shows, tell your admin."; document.body.appendChild(d); }); }
function ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
var USER = {username:ls('cvse_username'), name:ls('cvse_name'), role:ls('cvse_role')};
if(!ls('cvse_token') || !USER.username || USER.role !== 'admin' && USER.role !== 'accountant'){ window.location.href = 'index.html'; }
function authCheck(j){ if(j && j.code === 'AUTH'){ try{ localStorage.clear(); }catch(e){} alert('Session expired. Please login again.'); window.location.href = 'index.html'; } }
async function apiGet(action, params){
  let url = WEB_URL + '?action=' + action + '&token=' + encodeURIComponent(ls('cvse_token'));
  for(let k in (params || {})) url += '&' + k + '=' + encodeURIComponent(params[k]);
  let r = await fetch(url); let j = await r.json(); authCheck(j); return j;
}
async function apiPost(action, payload){
  let r = await fetch(WEB_URL, {method:'POST', body:JSON.stringify(Object.assign({action:action, token:ls('cvse_token')}, payload || {}))});
  let j = await r.json(); authCheck(j); return j;
}
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function show(el, text, kind){ el.className = 'msg show ' + kind; el.innerText = text; }
function hide(el){ el.className = 'msg'; }
function goBack(){ window.location.href = USER.role === 'admin' ? 'admin.html?tab=last' : 'accountant.html'; }
function doLogout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function maskD(el){
  let d = el.value.replace(/[^0-9]/g, '').substring(0, 8), o = d;
  if(d.length > 4) o = d.substring(0, 2) + '-' + d.substring(2, 4) + '-' + d.substring(4);
  else if(d.length > 2) o = d.substring(0, 2) + '-' + d.substring(2);
  el.value = o;
}

$('roleBadge').innerText = USER.role === 'accountant' ? 'ACCOUNTANT' : 'ADMIN';
$('avatarLetter').innerText = String(USER.name || 'U').trim().charAt(0).toUpperCase();

function depLink(){

    advMark();

/* S15: count the advanced settings and mark the ones that differ from the normal value */
function advMark(){
  let box = $('advFee'); if(!box) return;
  let n = 0, ch = 0;
  box.querySelectorAll('.fld').forEach(function(x){
    if(x.style.display === 'none') return;
    n++;
    let d = x.getAttribute('data-def'), k = x.getAttribute('data-k'), val = '';
    if(d === null) return;
    let el = $('s_'+k); if(!el) return;
    if(!el.dataset.advOn){ el.dataset.advOn = '1'; el.addEventListener('change', advMark); }
    val = el.tagName === 'DIV' ? headTicks(k) : String(el.value).trim();
    let on = val !== d; if(on) ch++;
    let t = x.querySelector('.advTag'); if(t) t.innerHTML = on ? '<span class="advTagOn">changed</span>' : '';
  });
  let info = box.querySelector('.advInfo'); if(info) info.innerHTML = '– '+n+' setting'+(n===1?'':'s')+(ch ? ', <b style="color:var(--orange,#ef6c00)">'+ch+' changed</b>' : '');
}

function routeRow(r){ return '<div class="card2" data-id="'+esc(r.routeId||'')+'"><button class="x" onclick="this.closest(\'.card2\').remove()">✕</button><label>Route name</label><input class="f_n" style="width:calc(100% - 46px)" value="'+esc(r.name||'')+'">'+
 '<div class="row2"><div><label>'+routeAmtLabel()+'</label><input class="f_m" inputmode="decimal" value="'+esc(r.monthly===undefined?'':r.monthly)+'"></div><div><label>One-way amount (optional)</label><input class="f_o" inputmode="decimal" value="'+esc(r.oneWay===undefined?'':r.oneWay)+'"></div></div>'+
 '<label>Status</label><select class="f_t"><option value="ACTIVE">Active</option><option value="INACTIVE"'+(r.status==='INACTIVE'?' selected':'')+'>Inactive</option></select></div>'; }
function routeAmtLabel(){      // S23 (F5): amount charged in each ticked month of the bus head
  let h = (D.heads||[]).find(x=>x.id===busHead()), ms = h ? String(h.months||'').split(',').filter(x=>x).map(Number) : [];
  ms.sort((a,b)=>MORDER.indexOf(a)-MORDER.indexOf(b));
  return 'Amount each time it falls due' + (ms.length && ms.length < 12 ? ' ('+ms.map(m=>MN[m]).join(', ')+')' : ms.length===12 ? ' (every month)' : '');
}
function dRoutes(){ return (busHead() ? '' : '<div class="help" style="background:#fff7ed;color:#9a3412;border:1px solid #fdba74;border-radius:12px;padding:10px;margin-bottom:10px;font-weight:700">⚠ Bus routes are set, but no fee head is chosen for the bus fee, so no bus fee is charged. Choose it in Receipt &amp; Rules → Monthly head used for bus fee.</div>') + '<div id="list">'+D.routes.map(routeRow).join('')+'</div><div class="btnrow"><button class="btn b-blue" onclick="$(\'list\').insertAdjacentHTML(\'beforeend\',routeRow({}))">+ Add route</button></div>'; }
function rRoutes(){ return [...document.querySelectorAll('#list .card2')].map(c=>({routeId:c.dataset.id,name:c.querySelector('.f_n').value,monthly:c.querySelector('.f_m').value,oneWay:c.querySelector('.f_o').value,status:c.querySelector('.f_t').value})); }
/* ---- slabs ---- */
function slabRow(s){ let hs=activeHeads('INSTALMENTS'); return '<div class="card2"><button class="x" onclick="this.closest(\'.card2\').remove()">✕</button><label>Fee head</label><select class="f_h" style="width:calc(100% - 46px)">'+hs.map(h=>'<option value="'+esc(h.id)+'"'+(h.id===s.headId?' selected':'')+'>'+esc(h.name)+'</option>').join('')+'</select>'+
 '<div class="row2"><div><label>Admitted from</label><input class="f_f" inputmode="numeric" oninput="maskD(this)" maxlength="10" value="'+esc(s.fromDate||'')+'" placeholder="DD-MM-YYYY"></div><div><label>Admitted to</label><input class="f_t" inputmode="numeric" oninput="maskD(this)" maxlength="10" value="'+esc(s.toDate||'')+'" placeholder="DD-MM-YYYY"></div></div>'+
 '<label>Charge (% of the amount)</label><input class="f_p" inputmode="decimal" value="'+esc(s.percent===undefined?'':s.percent)+'"></div>'; }
function dSlabs(){ if(!activeHeads('INSTALMENTS').length) return '<div class="empty-note">No instalment-type fee head yet.</div>'; return '<div id="list">'+D.slabs.map(slabRow).join('')+'</div><div class="btnrow"><button class="btn b-blue" onclick="$(\'list\').insertAdjacentHTML(\'beforeend\',slabRow({}))">+ Add slab</button></div><div class="help">Children admitted outside every slab pay 100%.</div>'; }
function rSlabs(){ return [...document.querySelectorAll('#list .card2')].map(c=>({headId:c.querySelector('.f_h').value,fromDate:c.querySelector('.f_f').value,toDate:c.querySelector('.f_t').value,percent:c.querySelector('.f_p').value})); }
/* ---- sibling ---- */
function sibRow(s){ let ids = String(s.headIds||'ALL')==='ALL' ? [] : String(s.headIds).split(','); return '<div class="card2"><button class="x" onclick="this.closest(\'.card2\').remove()">✕</button><div class="row2" style="width:calc(100% - 46px)"><div><label>For child number</label><select class="f_c">'+[2,3,4,5,6].map(n=>'<option'+(+s.childNo===n?' selected':'')+'>'+n+'</option>').join('')+'</select></div><div><label>Type</label><select class="f_m"><option value="PERCENT"'+(s.mode!=='FIXED'?' selected':'')+'>Percent off</option><option value="FIXED"'+(s.mode==='FIXED'?' selected':'')+'>Fixed amount off</option></select></div></div>'+
 '<label>Value</label><input class="f_v" inputmode="decimal" value="'+esc(s.value===undefined?'':s.value)+'">'+
 '<label>On which heads (none ticked = all heads)</label><div class="cl f_h">'+D.heads.filter(h=>h.status==='ACTIVE').map(h=>'<label><input type="checkbox" value="'+esc(h.id)+'"'+(ids.indexOf(h.id)>-1?' checked':'')+'>'+esc(h.name)+'</label>').join('')+'</div></div>'; }
function dSibling(){ return '<div id="list">'+D.sibling.map(sibRow).join('')+'</div><div class="btnrow"><button class="btn b-blue" onclick="$(\'list\').insertAdjacentHTML(\'beforeend\',sibRow({childNo:2,mode:\'PERCENT\'}))">+ Add rule</button></div><div class="help">A fixed amount is taken off each chosen head (for a monthly head, per month).</div>'; }
function rSibling(){ return [...document.querySelectorAll('#list .card2')].map(c=>({childNo:c.querySelector('.f_c').value,mode:c.querySelector('.f_m').value,value:c.querySelector('.f_v').value,headIds:[...c.querySelectorAll('.f_h input:checked')].map(i=>i.value).join(',')||'ALL'})); }
/* ---- copy ---- */
function dCopy(){
  return '<label>Copy from</label><select id="cFrom">'+D.sessions.map(s=>'<option'+(s===D.session?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select><label>New session (example 2027-2028)</label><input id="cTo" placeholder="2027-2028"><div class="btnrow"><button class="btn b-purple" id="cBtn" onclick="doCopy()">Copy</button></div><div class="msg" id="sMsg"></div>';
}
async function doCopy(){
  let b = $('cBtn'), m = $('sMsg'); b.disabled = true; show(m,'Copying...','load');
  try{
    let r = await apiPost('copyfeesession',{from:$('cFrom').value,to:$('cTo').value.trim()});
    if(r.success){ show(m,'✅ '+r.message,'ok'); await load($('cTo').value.trim()); TAB='structure'; chips(); draw(); show($('gMsg'),'✅ '+r.message,'ok'); }
    else show(m,'❌ '+(r.error||'Failed.'),'err');
  }catch(e){ show(m,'❌ Could not connect. Nothing was changed. Try again.','err'); }
  b.disabled = false;
}
/* ---- save ---- */
var READ = {settings:rSettings,groups:rGroups,heads:rHeads,structure:rStructure,instalments:rInstalments,items:rItems,routes:rRoutes,slabs:rSlabs,sibling:rSibling};
async function save(){
  let b = $('saveBtn'), m = $('sMsg'), sec = TAB; b.disabled = true; show(m,'Saving...','load');
  try{
    let r = await apiPost('savefeesetup',{section:sec,session:D.session,rows:JSON.stringify(READ[sec]())});
    if(r.success){ await load(D.session); TAB = sec; chips(); draw(); show($('sMsg'),'✅ '+r.message,'ok'); return; }
    show(m,'❌ '+(r.error||'Could not save.'),'err'); m.scrollIntoView({block:'center'});
  }catch(e){ show(m,'❌ Could not connect. Nothing was saved. Try again.','err'); }
  b.disabled = false;
}
load('');
</script>
</body></html>
